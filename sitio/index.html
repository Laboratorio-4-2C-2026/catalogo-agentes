ara que un integrante nuevo levante el proyecto sin ayuda. Usar cuando entra alguien nuevo o rotan los roles.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [{"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, {"nombre": "Santos Bogo", "github": "santosbogo"}], "area": ["documentacion"], "fase": ["mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["github", "linear", "discord", "openrouter"], "madurez": "usado-en-proyecto", "relacionados": ["g15-onboarding-doc-builder"], "ejemplo": "**Pedido:** Generá la guía de onboarding para alguien que entra al proyecto este mes.\n\n**Resultado:** Un `README.md` o `docs/ONBOARDING.md` con las 8 secciones (qué es, requisitos, setup paso a paso con comandos reales, tests y lint, flujo de trabajo, mapa del código, primera contribución y problemas comunes). Lo que no pudo confirmar en el repo queda marcado con `<!-- TODO: verificar -->`.", "ruta": "agentes/g11-repo-onboarding"}, {"name": "g11-revisar-consultas", "description": "Revisa el rendimiento de las consultas de un backend con Prisma o SQL (N+1, findMany sin límite, include de más, filtros sin índice) y propone el índice o la consulta concreta. Usar en PRs que tocan repositories o el schema, o cuando una pantalla anda lenta; no edita código ni corre migraciones.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["backend", "datos"], "fase": ["revision"], "tecnologias": ["prisma", "postgresql"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g03-postgresql-best-practices"], "ejemplo": "**Pedido:** \"Revisá las consultas del mapa de partidos de SportMatch, tarda ~2 s\"\n\n**Resultado:** Siguió el camino desde la pantalla del mapa hasta `GET /matches`. Encontró que `findUpcoming` trae\ntodos los partidos futuros sin `take` y filtra cupo y distancia en Node. También confirmó lo de SPO-306:\npara el tercer criterio de desempate, `getScores` carga todos los ratings y no-shows históricos de cada\norganizador y promedia en Node. Propuso la consulta SQL que lo reemplaza (con las reglas de no-show que\ntiene que replicar), un bounding box por coordenadas y los índices `@@index([status, date])` y\n`@@index([organizerId, status])`. Además avisó que el guard de autenticación hace 3 consultas y una\nllamada a Firebase en cada request, y que conviene medir eso antes de culpar a la base.", "ruta": "agentes/g11-revisar-consultas"}, {"name": "g11-revisar-despliegue", "description": "Revisa la configuración de despliegue de una app con contenedores (Dockerfile, docker-compose, CI/CD y variables de entorno) buscando migraciones peligrosas al arrancar, healthchecks faltantes y secretos expuestos. Usar en PRs que tocan infraestructura o antes de un release; no despliega ni lee secretos.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["devops"], "fase": ["revision", "despliegue"], "tecnologias": ["docker"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g08-release-checklist"], "ejemplo": "**Pedido:** \"Revisá toda la configuración de despliegue de SportMatch, back y front\"\n\n**Resultado:** Armó el mapa (back en GHCR → Azure por webhook, front en Vercel, base en Neon) y dio el veredicto\n\"listo con pasos manuales\". Marcó como riesgos la migración en cada arranque\n(`docker-entrypoint.sh:4`), el `/health` con un timeout de 2 s contra el arranque en frío de Neon, el\n`GIT_SHA` que se inyecta y nadie expone, la imagen corriendo como root y un PAT para publicar en GHCR.\nTambién detectó que las tres `VAPID_*` que el back exige para arrancar no están en ningún README. Dejó 5\npasos manuales para verificar en Azure y Vercel.", "ruta": "agentes/g11-revisar-despliegue"}, {"name": "g11-revisar-diseno", "description": "Revisa el diff de frontend de una PR contra el design system escrito del repo y marca valores hardcodeados, componentes duplicados, layouts rotos en mobile, faltas de accesibilidad y copy fuera de convención, con archivo:línea. Usar en PRs que tocan pantallas o componentes; no edita código.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["diseno", "frontend"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá el diseño de la PR 102\" (la que creó la pantalla del mapa de SportMatch)\n\n**Resultado:** Un hallazgo Alto: `mapa/page.tsx:22` le resta al mapa la altura de la navegación en\nmobile, en lugar de dejarlo pasar por debajo del chrome flotante como pide `DESIGN.md §4`. Es el bug que\nse arregló cinco semanas después en SPO-305. Además encontró dos Bajos: un `border` en lugar de\n`--ring-glass` (§15) en `match-row.tsx:16` y sombras con valores a mano en `match-pin.tsx:10-14`.", "ruta": "agentes/g11-revisar-diseno"}, {"name": "g11-revisar-privacidad", "description": "Revisa la privacidad de una app web con API REST: qué datos personales devuelve cada endpoint a otros usuarios, qué se escribe en logs y qué se manda a terceros. Usar para encontrar respuestas permitidas que muestran de más, a diferencia de una revisión de seguridad; no edita código.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["seguridad", "backend"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá la privacidad de los endpoints de partidos, perfiles y solicitudes de SportMatch\"\n\n**Resultado:** Encontró 8 exposiciones (1 alta, 4 medias, 3 bajas). La alta es `POST /users`, que el front no usa: con\nel uid de Firebase de otra cuenta devuelve su fila completa (mail, rol, bloqueo), y su 409 confirma si un\nmail está registrado (marcada `cruza con seguridad`). También marcó que `/public/matches/:id` manda las\ncoordenadas exactas sin login, aunque la vista pública no las usa. Confirmó que organizador,\nparticipantes y solicitantes siempre salen con `select { id, name, photoUrl }`. Dejó 4 preguntas para el\nPO, por ejemplo si cualquiera puede ver las faltas por no-show y el historial de partidos de otro\nusuario.", "ruta": "agentes/g11-revisar-privacidad"}, {"name": "g11-security-agent", "description": "Agente de GitHub Actions que prueba en vivo la API NestJS de SportMatch contra una base descartable, buscando accesos a recursos ajenos y reglas de negocio que se pueden saltear, y comenta en la PR solo los hallazgos reproducibles. Usar en PRs que tocan el backend.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, "colaboradores": [], "area": ["seguridad", "backend"], "fase": ["testing", "revision"], "tecnologias": ["nestjs", "prisma", "firebase"], "herramientas": ["otra"], "requiere": ["github", "linear", "discord", "openrouter"], "madurez": "usado-en-proyecto", "relacionados": ["g08-security-reviewer"], "ejemplo": "**Pedido:** Una PR hacia `dev` toca `back/` (o se le pone el label `security-agent`).\n\n**Resultado:** Levanta el back con una base descartable y prueba con los usuarios A, B y C si alguien puede leer o modificar recursos ajenos o saltear reglas de negocio (cupo, unirse dos veces, fechas pasadas). Comenta en la PR solo los hallazgos que se repiten al volver a ejecutar los requests desde una base limpia.", "ruta": "agentes/g11-security-agent"}, {"name": "g11-sportmatch-sim", "description": "Agente que corre Claude Code en modo headless para simular usuarios de SportMatch (unirse, organizar, aceptar solicitudes, calificar) según su arquetipo, y así generar actividad realista para los KPIs. Usar para poblar y hacer evolucionar un entorno de dev o prod con datos creíbles.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, "colaboradores": [], "area": ["datos", "qa"], "fase": ["testing"], "tecnologias": ["typescript", "firebase"], "herramientas": ["claude-code"], "requiere": ["github", "discord"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Correr el workflow `simular.yml` a mano con entorno `dev` (equivale a `claude -p \"Hacé una corrida según CLAUDE.md\"`).\n\n**Resultado:** Claude hace de cada persona simulada que entra ese día: revisa y acepta o rechaza solicitudes, cancela o califica partidos, se une a uno que encaje con sus deportes y su zona u organiza uno nuevo, anota una línea en su diario y cierra con un resumen de 3 a 5 líneas de la corrida.", "ruta": "agentes/g11-sportmatch-sim"}, {"name": "g11-test-agent", "description": "Agente de GitHub Actions que escribe y corre tests e2e (Jest, NestJS, Prisma) de la API de SportMatch a partir de los criterios de aceptación de un ticket de Linear, itera hasta que pasan y abre una PR con el test. Usar cuando un ticket de back necesita cobertura de integración.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [{"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}], "area": ["qa", "backend"], "fase": ["testing"], "tecnologias": ["nestjs", "prisma", "jest", "typescript"], "herramientas": ["otra"], "requiere": ["github", "linear", "discord", "openrouter"], "madurez": "usado-en-proyecto", "relacionados": ["g08-backend-test-engineer", "g03-express-test-builder-agent"], "ejemplo": "**Pedido:** Correr el workflow `test-agent` a mano con el ticket `SPO-168`.\n\n**Resultado:** Con el contexto del módulo ya cargado, escribe un `back/test/<nombre>.e2e-spec.ts`, lo corre contra la app Nest real con la base vacía y corrige hasta cubrir los criterios de aceptación (como máximo 15 iteraciones). Cierra con la cobertura por criterio y los bugs sospechados, y abre una PR con el test.", "ruta": "agentes/g11-test-agent"}, {"name": "g11-triage-incidente", "description": "Hace el triage de un incidente de una app desplegada: arma hipótesis desde el síntoma, las prueba con comandos de solo lectura, propone una mitigación y redacta el borrador del postmortem. Usar cuando algo falla en un entorno desplegado; no reinicia, no despliega ni hace rollback.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, "colaboradores": [], "area": ["devops"], "fase": ["mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g15-bug-investigator"], "ejemplo": "**Pedido:** \"Usá g11-triage-incidente: el login da 500 en dev desde hace una hora.\"\n\n**Resultado:** Reproduce el error con una request, prueba sus hipótesis con comandos de solo lectura y entrega el estado, la causa con evidencia, la mitigación para que la corra una persona y el borrador del postmortem.", "ruta": "agentes/g11-triage-incidente"}, {"name": "g11-usabilidad-sintetica", "description": "Hace una prueba de usabilidad sintética de una app web: encarna a una persona con un objetivo, usa la app en un navegador real sin leer el código y reporta con capturas dónde dudó o se trabó. Usar antes de validar con usuarios reales o después de sumar un flujo nuevo; no los reemplaza ni toca el código.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, "colaboradores": [], "area": ["qa", "diseno"], "fase": ["testing"], "tecnologias": ["playwright"], "herramientas": ["claude-code"], "requiere": ["playwright"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** \"Usá el agente g11-usabilidad-sintetica en el preview de dev. Persona: alguien de 30 años que juega\nal fútbol los fines de semana y nunca usó la app. Objetivo: encontrar un partido para este finde y sumarse.\"\n\n**Resultado:** Martín, la persona simulada, lo logra a medias: manda la solicitud a un partido del sábado,\npero queda pendiente de que la apruebe el organizador, así que todavía no está anotado. Le llevó 10\nacciones en 5 pantallas, contando registro y onboarding, y eligió el partido sin saber dónde quedaba. El\ninforme ordena las fricciones por severidad, cada una con su captura, y trae las preguntas para hacerle a\nun usuario real y la lista de datos de prueba que creó.", "ruta": "agentes/g11-usabilidad-sintetica"}, {"name": "g11-weekly-status", "description": "Agente programado (GitHub Actions, los viernes) que redacta el informe de avance semanal para la cátedra con los datos de Linear y GitHub, con estado RAG, riesgos, avance, entregables y próxima semana. Usar para el status semanal de un proyecto que se gestiona en Linear.", "tipo": "agente", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [{"nombre": "Tomás Valle Durán", "github": "TomasValleDuran"}, {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, {"nombre": "Santos Bogo", "github": "santosbogo"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["github", "linear", "discord", "openrouter"], "madurez": "usado-en-proyecto", "relacionados": ["g07-weekly-process-checklist", "g15-weekly-status-report"], "ejemplo": "**Pedido:** La corrida programada de los viernes (o una ejecución manual del workflow).\n\n**Resultado:** Publica el informe semanal para la cátedra: estado (ok, desvío recuperable o comprometido), el resumen en una oración, hasta 4 riesgos con sus identifiers de Linear y las secciones Avance de la semana, Entregables / demo mostrable y Próxima semana. Avisa por Discord con el titular y el link.", "ruta": "agentes/g11-weekly-status"}, {"name": "g13-auditor-de-higiene-de-tickets", "description": "Audita los tickets de Multica de MicroChangas y lista los que tienen datos faltantes (horas estimadas o reales, módulo, tipo, asignado, criterios de aceptación) agrupados por responsable, con el comentario listo para avisarle. Usar antes de calcular métricas o KPIs y al cierre de cada semana; no evalúa si un ticket está listo para el sprint (para eso, un checker de Definition of Ready).", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "usado-en-proyecto", "relacionados": ["g07-ready-check", "g11-dor-checker", "g13-reporte-de-estado"], "ejemplo": "**Pedido:** Revisá la higiene de los tickets antes de que corra el reporte de KPIs.\n\n**Resultado:** Un resumen con cuántos tickets están completos, una tabla por responsable con lo que le falta a cada ticket (por ejemplo, \"Guardar la ubicación de la changa (MIC-111): falta Duración real\") y el comentario sugerido para cada uno. No publica nada salvo que se lo confirmes.", "ruta": "agentes/g13-auditor-de-higiene-de-tickets"}, {"name": "g13-curador-de-contexto", "description": "Compara el CLAUDE.md y el AGENTS.md de un repo de MicroChangas con la realidad (scripts, módulos, variables de entorno, convenciones que los líderes repiten en las reviews) y propone la actualización para que Claude Code, Codex y Antigravity trabajen con el mismo contexto. Usar cada semana o cuando una PR cambia la estructura del repo; es el contexto para las herramientas de IA, la guía para personas la escribe g13-onboarding-de-repo.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["ia", "documentacion"], "fase": ["mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g11-context-curator", "g13-onboarding-de-repo", "g13-tutor-del-proyecto"], "ejemplo": "**Pedido:** Revisá si el CLAUDE.md del back está al día.\n\n**Resultado:** Una tabla que muestra que el archivo solo habla de Didit y le faltan los comandos de Supabase local, el mapa de `src/modules/` y dos reglas que los líderes pidieron varias veces en las reviews, cada una con su evidencia, y un `CLAUDE.propuesto.md` listo para que un dev lo revise y lo suba.", "ruta": "agentes/g13-curador-de-contexto"}, {"name": "g13-documentador-de-progreso", "description": "Compila la evidencia de un sprint de MicroChangas para el reporte que pide la cátedra (tickets cerrados con horas estimadas vs. reales, PRs mergeadas, decisiones, deuda y burndown en horas), sacada de Multica y GitHub. Usar al cierre de cada sprint o entrega; para el estado semanal de lo trabado está g13-reporte-de-estado.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "multica"], "madurez": "experimental", "relacionados": ["g13-reporte-de-estado", "g08-progress-summarizer", "g15-technical-progress-reporter"], "ejemplo": "**Pedido:** Armá la evidencia del sprint 3, del 16/10 al 12/11.\n\n**Resultado:** Deja `progreso-sprint-3-2026-11-12.md` con el resumen, la tabla de tickets cerrados con horas estimadas y reales y su PR, las PRs mergeadas, el burndown en horas día por día, las decisiones, la deuda pendiente y los datos que no pudo obtener.", "ruta": "agentes/g13-documentador-de-progreso"}, {"name": "g13-lecciones-aprendidas", "description": "Al cierre de un sprint o entrega de MicroChangas, destila lecciones aprendidas reutilizables por otros equipos a partir de evidencia real (bugs que salieron del QA, tickets reabiertos o cancelados, comentarios repetidos de los líderes en las PRs, deploys fallidos, ADRs y desvíos de estimación), sin señalar personas. Usar al cerrar cada entrega; para medir el avance del sprint está g13-documentador-de-progreso.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "multica"], "madurez": "experimental", "relacionados": ["g07-sprint-retro", "g15-technical-retro-analyst", "g13-documentador-de-progreso"], "ejemplo": "**Pedido:** Sacá las lecciones aprendidas del sprint 3, del 16/10 al 12/11.\n\n**Resultado:** Deja `lecciones/2026-11-12-sprint-3.md` con entre 3 y 7 lecciones (por ejemplo, \"Partir los tickets full stack en uno por repo\", con los tickets que se partieron y las horas de desvío como evidencia), cada una con contexto, qué pasó, qué aprendimos, qué haríamos distinto y sus etiquetas, sin nombrar personas.", "ruta": "agentes/g13-lecciones-aprendidas"}, {"name": "g13-onboarding-de-repo", "description": "Lee el repo de backend (NestJS + Prisma + Supabase) o de frontend (React + Vite) de MicroChangas y escribe la guía del primer día para un integrante nuevo (qué es, cómo levantarlo, mapa de carpetas y módulos, convenciones y el flujo ticket → branch → PR → review), verificando cada comando contra el repo. Usar cuando entra alguien al equipo o rota un rol; es para personas, el contexto para las herramientas de IA lo mantiene g13-curador-de-contexto.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["documentacion"], "fase": ["mantenimiento"], "tecnologias": ["nestjs", "react", "prisma", "supabase", "typescript"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-repo-onboarding", "g15-onboarding-doc-builder", "g13-curador-de-contexto", "g13-levantar-stack", "g13-tutor-del-proyecto"], "ejemplo": "**Pedido:** Armá la guía del primer día del backend para Max, que entra esta semana.\n\n**Resultado:** Deja `ONBOARDING.md` en la raíz de `microchangas-backend` con qué es el repo, qué instalar, cómo levantarlo, el mapa de módulos NestJS, las convenciones de branch y PR, cómo es su primera PR y a quién preguntar por cada módulo, más una lista de cosas del README que no coinciden con el código.", "ruta": "agentes/g13-onboarding-de-repo"}, {"name": "g13-preparador-de-steering", "description": "Arma el borrador del deck de steering de MicroChangas (avance del sprint, guion de demo, KPIs, riesgos y decisiones que se piden) juntando el último reporte de estado de Multica, los tickets cerrados, las PRs mergeadas y los KPIs del kpi-reporter, con notas del orador y la fuente de cada número. Usar unos días antes de cada steering con la cátedra; no arma las slides en sí, deja el contenido listo para pasarlo.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "multica"], "madurez": "experimental", "relacionados": ["g15-steering-context-analyst", "g15-steering-deck-builder", "g11-auditar-steering", "g13-reporte-de-estado"], "ejemplo": "**Pedido:** Prepará el steering del jueves 12/11, que cubre el sprint 3 (16/10 al 12/11).\n\n**Resultado:** Deja `steering-2026-11-12.md` con 7 slides en borrador (dónde estamos, qué se hizo, guion de la demo, KPIs, riesgos, decisiones que se piden y próximos pasos), cada una con bullets y notas del orador, más la fuente de cada número y los datos que no pudo obtener.", "ruta": "agentes/g13-preparador-de-steering"}, {"name": "g13-reporte-de-estado", "description": "Agente de Multica que corre solo los lunes 9:00 y arma el reporte semanal de estado de MicroChangas para los líderes: cruza los tickets de Multica con las PRs y branches de GitHub, marca lo trabado (tickets sin código, PRs esperando review, carga concentrada) y propone 2 a 4 acciones. Solo lectura. Para la evidencia del sprint que pide la cátedra está g13-documentador-de-progreso.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "otra"], "requiere": ["github", "multica"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g15-weekly-status-report", "g11-weekly-status", "g13-documentador-de-progreso"], "ejemplo": "**Pedido:** (Lo dispara el autopilot \"Reporte de estado semanal\" de Multica los lunes 9:00, o a mano desde el autopilot.)\n\n**Resultado:** Publica un comentario en el issue \"Reporte de estado <fecha>\" con el resumen de la semana, la tabla de tickets en curso con su señal (trabado, esperando líder, listo para arrancar), las PRs abiertas y qué está esperando cada una, y 2 a 4 acciones numeradas; después pasa el issue a done.", "ruta": "agentes/g13-reporte-de-estado"}, {"name": "g13-tutor-del-proyecto", "description": "Responde las preguntas de los devs de MicroChangas sobre cómo está hecho el proyecto (convenciones, arquitectura, dónde vive cada cosa, cómo se resolvió algo parecido) citando archivo y línea del backend NestJS o del frontend React, sin escribir el código por ellos. Usar cuando un dev tiene una duda del proyecto que hoy le preguntaría a un líder; para la guía completa del primer día está g13-onboarding-de-repo.", "tipo": "agente", "grupo": "13", "autor": {"nombre": "Pablo Pagliaricci", "github": "Pagliaricci"}, "colaboradores": [], "area": ["backend", "frontend", "documentacion"], "fase": ["desarrollo"], "tecnologias": ["nestjs", "react", "prisma", "supabase", "typescript"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g13-onboarding-de-repo", "g15-tech-approach-recommender", "g08-teacher"], "ejemplo": "**Pedido:** ¿Cómo valido los datos que llegan a un endpoint nuevo en el back?\n\n**Resultado:** Responde que se usan DTOs con class-validator y el ValidationPipe global, cita el archivo y la línea donde se registra el pipe y un DTO existente para copiar el patrón, y avisa qué error devuelve la API cuando la validación falla, sin escribir el DTO nuevo.", "ruta": "agentes/g13-tutor-del-proyecto"}, {"name": "g15-adr-writer", "description": "Redacta ADRs a nivel programa de gestión de FutTracker (herramientas, metodología, modelo de cronograma, stack de IA), que son decisiones del Tech Lead, nunca decisiones de implementación del producto. Usalo cuando se tomó una decisión de gestión que cambia un límite y hay que dejar su porqué registrado.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion", "gestion"], "fase": ["diseno"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Documentá la decisión de tratar el Módulo 0 como pre-supuesto.\n\n**Resultado:** Confirma que la decisión es de gestión y no de producto, y escribe un ADR numerado en tl/adr/ con estado, contexto, decisión, consecuencias y alternativas, usando el razonamiento aportado. También lo guarda en Engram.", "ruta": "agentes/g15-adr-writer"}, {"name": "g15-agent-opportunity-orchestrator", "description": "Coordina una ronda de brainstorming de agentes para FutTracker con cuatro miradas (PM, PO, QA, TL), la contrasta con los agentes y skills existentes y sintetiza propuestas sin duplicaciones. Usalo ante «qué agentes nos faltan»; solo propone, no implementa ni ejecuta los agentes propuestos.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["ia", "gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Qué agentes nos faltan? Repetí la ronda PM/PO/QA/TL.\n\n**Resultado:** Inventaría agentes y skills, delega los cuatro perfiles y devuelve una síntesis corta con una tabla de ampliaciones, nuevos, condicionados y descartes con dueño y solapamiento. Después propone entrevistar una propuesta por vez.", "ruta": "agentes/g15-agent-opportunity-orchestrator"}, {"name": "g15-backend-supabase-implementer", "description": "Dado un ticket de Linear de FutTracker, implementa el backend que pide (schema, migraciones versionadas de Supabase, políticas RLS y API routes o Server Actions) siguiendo las convenciones de auth y RLS del propio repo. Usalo cuando un dev backend toma un ticket de datos o API; corre dentro del repo de producto.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["supabase", "postgresql", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Implementá el backend del ticket FUT-90 (tabla de estadísticas con RLS).\n\n**Resultado:** Lee el ticket y las convenciones del repo, genera la migración con el CLI de Supabase con RLS en la misma migración, implementa la API o Server Action con los helpers de auth existentes y verifica con supabase db diff local.", "ruta": "agentes/g15-backend-supabase-implementer"}, {"name": "g15-bug-investigator", "description": "Investiga bugs abiertos o hallazgos de validación de release de FutTracker: distingue reproducido, no reproducido y bloqueado, plantea causas como hipótesis y propone severidad y prioridad para que QA valide. Usalo en el triage manual de un bug; nunca arregla ni edita tickets.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Investigá este bug: al editar la zona del perfil queda sin foco el botón Guardar.\n\n**Resultado:** Pide los pasos, la versión y la evidencia, separa hecho, hipótesis y propuesta, y escribe qa/bugs/investigacion-<id>-<fecha>.md con reproducción, hipótesis, severidad propuesta y faltantes. No crea ni modifica tickets.", "ruta": "agentes/g15-bug-investigator"}, {"name": "g15-demo-recorder", "description": "Graba la demo de steering de FutTracker (55 a 60 segundos) con el producto corriendo en local: decide qué entra según Linear y los PRs, escribe el guion, maneja la app con un script de Playwright que se mueve como una persona y verifica el video cuadro a cuadro. Usalo antes de un steering o para regrabar tras cambios; nunca escribe en el repo del producto.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["qa", "gestion"], "fase": ["revision"], "tecnologias": ["nextjs", "supabase", "playwright"], "herramientas": ["claude-code"], "requiere": ["github", "linear", "engram", "playwright"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Grabá la demo del Steering 3 en local.\n\n**Resultado:** Define qué mostrar según Linear y los PRs, levanta Supabase local con el seed, graba los segmentos con cursor y scroll naturales y entrega el .mp4 con duración, una tabla de pasos (grabado, salteado o fallido) y el comando exacto para reproducirlo.", "ruta": "agentes/g15-demo-recorder"}, {"name": "g15-dod-compliance-checker", "description": "Revisa tickets individuales de FutTracker en Linear contra el Definition of Done y los criterios de aceptación a nivel descripción (compliant, sin AC o AC vagos) antes de cerrarlos. Usalo antes de marcar una story como lista para cerrar o para auditar tickets cerrados sin AC visible; no mira PRs (para eso está g15-pr-dod-gate).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["revision", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Chequeá si FUT-87 cumple el DoD antes de cerrarlo.\n\n**Resultado:** Lee el ticket y el alcance de su story, y devuelve un veredicto compliant, missing-AC o vague-AC con una línea de motivo y los desvíos de alcance. No cambia estado ni contenido en Linear.", "ruta": "agentes/g15-dod-compliance-checker"}, {"name": "g15-evm-calculator", "description": "Calcula el Valor Ganado semanal de FutTracker (PV, EV, AC, SPI, CPI, SV, CV, ETC y EAC) aplicando las reglas de EVM del PM sobre una línea base reproducible y el estado real de Linear, separando lo medido de lo supuesto. Usalo antes de un steering o ante «¿cuánto valor ganamos?»; deja un borrador fechado para validar y nunca inventa horas ni puntos.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Calculemos el valor ganado al corte del viernes.\n\n**Resultado:** Lee las reglas de EVM, la línea base y los tickets de Linear, calcula PV, EV y AC con la etiqueta de origen de cada serie, corre los chequeos de cordura y guarda pm/evm/AAAA-MM-DD-evm.md como borrador pendiente de validación del PM.", "ruta": "agentes/g15-evm-calculator"}, {"name": "g15-frontend-design-implementer", "description": "Dado un ticket de Linear de FutTracker con capturas de diseño embebidas, implementa la UI como componentes modulares y reutilizables, consistentes con el codebase existente (design system de facto) y responsive donde el diseño no cubre todos los breakpoints. Usalo cuando un dev frontend toma un ticket con imágenes.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["frontend", "diseno"], "fase": ["desarrollo"], "tecnologias": ["typescript", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Implementá la pantalla de perfil de equipo del ticket FUT-89.\n\n**Resultado:** Lee el ticket, extrae las capturas, releva los componentes y tokens ya implementados, construye la UI reutilizando lo existente y registra los patrones nuevos en docs/tech-stack/design-system.md. Si no hay imágenes en el ticket, lo dice y no inventa el diseño.", "ruta": "agentes/g15-frontend-design-implementer"}, {"name": "g15-functional-uat-executor", "description": "Valida el cumplimiento funcional de una story de FutTracker por criterio, postmerge o en staging, con evidencia real o aportada por un validador humano en modo asistido. Usalo después de un merge o deploy; nunca simula una ejecución ni revisa PRs.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Validá funcionalmente FUT-87 en staging con la evidencia que te paso.\n\n**Resultado:** Hace el preflight (entorno, revisión desplegada, cuentas), registra cada criterio como cumple, no cumple o bloqueado según la evidencia, y escribe qa/uat/resultados/FUT-87-<fecha>.md. Si no hay browser autorizado, trabaja con los pasos y capturas del validador.", "ruta": "agentes/g15-functional-uat-executor"}, {"name": "g15-governance-checklist-auditor", "description": "Audita el checklist de gobernanza del plan de reestructuración de alcance de FutTracker (cláusula de IA en producto vs proceso, revisión humana de ADR y DoD antes del merge) e informa qué sigue abierto y si bloquea. Usalo periódicamente o antes de dar por cerrado el Plan 1; solo reporta, nunca tilda casillas.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Auditá el checklist de gobernanza del plan 1.\n\n**Resultado:** Lee la sección «Gobernanza (no saltear)» del plan, lista cada ítem tildado o sin tildar, marca los bloqueantes y cruza con Engram para detectar decisiones ya tomadas cuyo casillero quedó sin actualizar.", "ruta": "agentes/g15-governance-checklist-auditor"}, {"name": "g15-onboarding-doc-builder", "description": "Arma el material de onboarding de negocio y proyecto (no de código) para quien se suma al lado de planificación de FutTracker, a partir del plan, las épicas y las decisiones registradas. Usalo cuando entra un nuevo PO, TL, PM o stakeholder.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["documentacion", "gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el onboarding para el nuevo PO.\n\n**Resultado:** Lee el plan, las épicas y las decisiones en Engram, y escribe un documento con qué es FutTracker, alcance y estado actual, decisiones clave con su porqué, vocabulario y a quién consultar. Marca lo que puede estar desactualizado.", "ruta": "agentes/g15-onboarding-doc-builder"}, {"name": "g15-pm-orchestrator", "description": "Router del rol PM de FutTracker: ordena y delega el reporte semanal y el cálculo de valor ganado en los especialistas PM (g15-project-health-monitor, g15-risk-register-keeper, g15-weekly-status-report, g15-evm-calculator), sin hacer el análisis él mismo. Usalo para arrancar un proceso de gestión completo; no redacta ni calcula nada por su cuenta.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Preparemos el reporte semanal.\n\n**Resultado:** Muestra un plan breve, pide el relato semanal y el parte técnico validado, delega en el monitor de salud, el registro de riesgos y el reporte semanal, y devuelve un consolidado con agentes delegados, bloqueos y aprobaciones pendientes. Si falta el parte técnico, el reporte queda marcado como PRELIMINAR.", "ruta": "agentes/g15-pm-orchestrator"}, {"name": "g15-po-backlog-analyst", "description": "Analiza el estado del producto FutTracker desde el PO: qué está listo para implementar, en qué orden por valor, qué está trabado y qué decisiones de producto siguen abiertas, cruzando los documentos de alcance con el proyecto de Linear. Usalo antes de refinar una épica o al arrancar la semana; solo lee Linear y no mira fechas ni EVM (eso es g15-project-health-monitor).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Qué debería entrar primero esta semana y qué lo impide?\n\n**Resultado:** Evalúa el DoR de cada ticket, propone el orden por valor según el criterio validado por el PO (o lo marca pendiente), clasifica las trabas por tipo y rol dueño, y lista decisiones abiertas, deriva de alcance e higiene de tickets. No modifica Linear.", "ruta": "agentes/g15-po-backlog-analyst"}, {"name": "g15-po-orchestrator", "description": "Router del rol PO de FutTracker: coordina el refinamiento de la próxima épica (backlog, factibilidad TL, criterios QA, tickets en modo propuesta) y la auditoría de gobernanza, sin crear ni editar nada en Linear antes de la aprobación humana. Usalo para el proceso P3 o P11; el análisis lo hacen los especialistas.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Refinemos la próxima épica.\n\n**Resultado:** Delega el valor y el orden en g15-po-backlog-analyst, pide factibilidad al router TL y criterios verificables al router QA, y pasa todo a g15-po-ticket-author en modo propuesta. Devuelve el consolidado con aprobaciones pendientes, sin tocar Linear.", "ruta": "agentes/g15-po-orchestrator"}, {"name": "g15-po-ticket-author", "description": "Escribe y refina tickets de FutTracker en Linear con la estructura acordada (contexto, alcance con fuera explícito, requisitos, criterios de aceptación verificables, pasos de verificación y dependencias), pregunta la estimación en Fibonacci y embute capturas del design system en los de frontend. Usalo al crear, partir o llevar a «listo» un ticket; por defecto trabaja en modo propuesta.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}], "area": ["gestion"], "fase": ["analisis", "planificacion"], "tecnologias": ["supabase", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear", "chrome", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Partí el ticket de búsqueda en dos y dejalos listos para implementar.\n\n**Resultado:** Propone las partes con matriz de trazabilidad de requisitos y criterios Dado/Cuando/Entonces, y te hace una sola pregunta por la estimación Fibonacci. Solo tras tu aprobación crea los tickets en Linear, sin asignar ni cambiar estado.", "ruta": "agentes/g15-po-ticket-author"}, {"name": "g15-pr-code-reviewer", "description": "Revisión técnica de un PR del repo de producto futtracker (correctness, RLS y migraciones, convenciones de auth, cobertura de tests) contrastando el diff con el ticket de Linear; es el primer pase automatizado de la revisión que el RACI asigna al TL. Usalo antes de mergear un PR concreto; si queda aprobado y sin más commits previstos, mueve el ticket a Ready for QA.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["backend", "qa"], "fase": ["revision"], "tecnologias": ["supabase"], "herramientas": ["claude-code"], "requiere": ["github", "linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Revisá técnicamente el PR 41 de futtracker.\n\n**Resultado:** Trae el ticket FUT-xxx y el diff, devuelve primero la tabla de cumplimiento de requisitos y criterios, después los hallazgos con archivo y línea (sin código de fix) y cierra con el estado del ticket: movido a Ready for QA, no movido o pendiente manual.", "ruta": "agentes/g15-pr-code-reviewer"}, {"name": "g15-pr-dod-gate", "description": "Gate de Definition of Done sobre un PR puntual de futtracker: CI en verde, story linkeada, migraciones con RLS, tests, docs y orden migración antes que deploy, con veredicto cumple, no cumple o bloqueado por ítem. Usalo antes de mergear; no revisa calidad de código (g15-pr-code-reviewer) ni hace la pasada exploratoria (g15-pr-uat-contrast).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["qa"], "fase": ["revision"], "tecnologias": ["supabase"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Pasale el gate de DoD al PR 41.\n\n**Resultado:** Revisa el PR y sus checks de CI, devuelve una tabla por ítem del DoD con la evidencia de cada uno (check, línea del diff o archivo ausente) y un cierre: DoD incumplido, bloqueado o cumplido. No comenta ni aprueba en GitHub.", "ruta": "agentes/g15-pr-dod-gate"}, {"name": "g15-pr-uat-contrast", "description": "Contrasta el diff de un PR de futtracker con los escenarios de UAT ya escritos en qa/uat/ (cubierto, parcial o sin tocar) y hace una pasada exploratoria adversarial sobre la rama levantada en local. Usalo antes de mergear para saber si el PR cubre lo que pide el UAT de su story; no reemplaza la validación funcional postmerge.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["qa"], "fase": ["revision", "testing"], "tecnologias": ["supabase", "nextjs"], "herramientas": ["claude-code"], "requiere": ["github", "chrome"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Contrastá el PR 41 contra el UAT de su story y probalo en local.\n\n**Resultado:** Busca el guion en qa/uat/, clasifica cada criterio contra el diff, levanta la rama con Supabase local y prueba inputs límite, navegación fuera de guion y doble acción. Devuelve la tabla de criterios, los cambios sin criterio asociado y los bloqueos.", "ruta": "agentes/g15-pr-uat-contrast"}, {"name": "g15-product-adr-drafter", "description": "Documenta una decisión técnica de producto de FutTracker ya tomada como ADR borrador transferible, conservando rationale, alternativas y consecuencias, pendiente de aprobación del TL. Usalo cuando el TL confirmó una decisión; el ADR de gestión es de g15-adr-writer.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion"], "fase": ["diseno"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Dejá asentada como ADR borrador la decisión de usar Supabase central para el reporte de KPIs.\n\n**Resultado:** Verifica que la decisión esté confirmada, escribe tl/producto/adr-borrador-<slug>.md con estado «Borrador — pendiente de aprobación TL» y lista lo que el TL debe confirmar. Si no hay decisión confirmada, devuelve bloqueado.", "ruta": "agentes/g15-product-adr-drafter"}, {"name": "g15-project-health-monitor", "description": "Cruza el Gantt y el camino crítico, el plan de alcance y Linear para dar un veredicto de salud de FutTracker en cronograma, alcance y costo, y proponer rebaselines con alternativas fechadas. Usalo para un chequeo de salud en cierre de sprint o ante un desvío; nunca regenera el cronograma ni aplica el rebaseline.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hacé un health check del proyecto y proponé alternativas si estamos corridos.\n\n**Resultado:** Compara el ritmo de tickets cerrados contra el calendario y las 14 stories de la línea base, y devuelve un estado por eje con sus variaciones principales. Si hay desvío, propone opciones de rebaseline con diferencias por tarea y aprobaciones necesarias, sin aplicar nada.", "ruta": "agentes/g15-project-health-monitor"}, {"name": "g15-qa-orchestrator", "description": "Router del rol QA de FutTracker: coordina la QA de PRs pendientes (UAT contrast, DoD gate, calidad de tests), los criterios verificables de una épica y la validación de release, sin hacer revisión técnica TL ni autorizar releases. Usalo para lanzar un proceso QA completo y obtener un informe consolidado.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hagamos QA de los PRs pendientes.\n\n**Resultado:** Selecciona los PRs abiertos nuevos o con commits desde la última revisión QA, delega en g15-pr-uat-contrast, g15-pr-dod-gate y g15-test-quality-analyst, y consolida un informe incremental con resueltos, pendientes y nuevos hallazgos.", "ruta": "agentes/g15-qa-orchestrator"}, {"name": "g15-regression-matrix-keeper", "description": "Propone y mantiene la matriz de regresión de una épica o candidata a release de FutTracker, con trazabilidad cambio, flujo, caso y evidencia vigente. Usalo en la actualización semanal o al armar una candidata; no ejecuta pruebas y solo aplica la matriz que QA validó.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Actualizá la matriz de regresión para la candidata de esta semana.\n\n**Resultado:** Mapea cada cambio a flujos y casos de regresión con prioridad justificada, decide si repetir o reutilizar cada resultado con su vigencia, y deja un borrador en el informe para aprobación de QA antes de tocar qa/regresion/matriz.md.", "ruta": "agentes/g15-regression-matrix-keeper"}, {"name": "g15-release-criteria-evidence-checker", "description": "Contrasta la evidencia de UAT, regresión, DoD y bugs contra el criterio de release vigente de FutTracker y emite una tabla cumple, no cumple, no aplica o bloqueado por criterio. Usalo al preparar la validación de release; no autoriza ni despliega nada.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["revision", "despliegue"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Contrastá la evidencia de la candidata 0.3 contra el criterio de release.\n\n**Resultado:** Cruza resultados de UAT, matriz de regresión, DoD y bugs con el criterio vigente, lista bloqueantes, pendientes y faltantes, y escribe qa/uat/resultados/release-<version>-<fecha>.md como informe para QA, sin dar permiso de deploy.", "ruta": "agentes/g15-release-criteria-evidence-checker"}, {"name": "g15-risk-register-keeper", "description": "Mantiene el registro único de riesgos, issues y bloqueos de FutTracker y hace seguimiento de las acciones de steering y standup hasta cerrarlas, cruzando Linear con el plan de épicas. Usalo cuando aparece un riesgo nuevo o para perseguir acciones abiertas; propone cambios y solo los aplica tras la validación del PM.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Surgió un riesgo nuevo con la entrega de los parciales; actualizá el registro.\n\n**Resultado:** Propone el alta con origen, impacto y acción mostrando el cambio viejo y nuevo, espera la validación del PM y recién entonces actualiza el registro en el lugar. Devuelve entradas nuevas, actualizadas, cerradas con motivo y acciones vencidas.", "ruta": "agentes/g15-risk-register-keeper"}, {"name": "g15-standards-maintainer", "description": "Propone ajustes puntuales de estándares de FutTracker al cierre del sprint o por urgencia manual, distinguiendo violación de regla vigente de gap documental. Usalo después de reviews y hallazgos técnicos; deja un borrador pendiente de aprobación del TL y no adopta nada.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion", "gestion"], "fase": ["mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Proponé un ajuste de estándares a partir de los hallazgos del sprint.\n\n**Resultado:** Clasifica cada caso como violación de regla vigente, gap o ambigüedad, y escribe tl/producto/propuesta-estandar-<tema>-<fecha>.md marcado «Borrador — pendiente aprobación TL» con problema, evidencia y alternativas.", "ruta": "agentes/g15-standards-maintainer"}, {"name": "g15-steering-context-analyst", "description": "Prepara el research de Talksmith para el deck de steering de FutTracker: junta plan, Linear, cronograma, presupuesto, valor ganado y riesgos del sprint y arma el brief y su registro de corpus. Corre primero, antes de g15-steering-deck-builder; usalo antes de un steering o para refrescar datos tras un cambio de plan.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [{"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}], "area": ["gestion", "documentacion"], "fase": ["analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram", "talksmith"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Prepará el research del Steering 3 con los datos de hoy.\n\n**Resultado:** Escribe el brief en talks/steering-sprint-3/research/articles/ con una sección por tema del steering, fuentes, faltantes con dueño, inconsistencias y checklist de correcciones, y su registro de corpus sin pérdida. No calcula valor ganado.", "ruta": "agentes/g15-steering-context-analyst"}, {"name": "g15-steering-deck-builder", "description": "Arma el deck de steering de FutTracker a partir del research que dejó g15-steering-context-analyst: borrador, diagramas de marca (semáforo, Gantt, valor ganado, matrices de riesgo), rondas de feedback, versión final y render, revisando cada slide. Usalo para armar o refrescar el deck; no recolecta datos ni lee Linear.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion", "diseno"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram", "talksmith"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el borrador del Steering 3 con el research que ya está.\n\n**Resultado:** Lee el corpus, escribe draft.md con las slides del steering, dibuja los diagramas en HTML/SVG/PNG, renderiza el deck con el estilo de la landing y devuelve el chequeo por slide (tamaño de letra, palabras) más las preguntas pendientes para el presentador.", "ruta": "agentes/g15-steering-deck-builder"}, {"name": "g15-team-comms-drafter", "description": "Redacta comunicaciones ad hoc para el equipo o los stakeholders de FutTracker (recordatorios, anuncios, avisos de cambio de alcance), separadas del reporte semanal formal. Usalo para un mensaje puntual fuera de cadencia; solo entrega el borrador y nunca lo envía.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Redactá un recordatorio para los devs sobre la fecha de cierre de la story de búsqueda.\n\n**Resultado:** Lee el plan y los tickets de la story, ajusta el tono a la audiencia y devuelve el texto del mensaje, con una o dos variantes si el tono no es obvio. El envío queda en manos del usuario.", "ruta": "agentes/g15-team-comms-drafter"}, {"name": "g15-tech-approach-recommender", "description": "Dado un ticket de Linear de FutTracker, recomienda qué tecnología o patrón del propio stack conviene para su caso, apoyándose en los precedentes del codebase y en la documentación actual (vía g15-tech-docs-fetcher). Usalo antes de implementar un ticket cuando hay varias formas válidas de resolverlo.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["backend", "frontend"], "fase": ["diseno"], "tecnologias": ["nextjs", "supabase"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Qué enfoque conviene para el ticket FUT-91: Server Action o API route?\n\n**Resultado:** Lee el ticket, busca cómo se resolvieron casos similares en el codebase, verifica la doc vigente y escribe docs/tech-stack/recommendations/FUT-91.md con enfoque recomendado, precedente con archivo y línea, alternativas y riesgos.", "ruta": "agentes/g15-tech-approach-recommender"}, {"name": "g15-tech-docs-fetcher", "description": "Busca y cachea documentación actualizada y alineada a la versión instalada de cualquier librería del stack del proyecto (Next.js, Supabase, TypeScript, React o lo que esté en package.json) en docs/tech-stack/. Usalo antes de escribir código contra una librería cuando no querés depender del conocimiento de entrenamiento, que puede estar desactualizado.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion"], "fase": ["desarrollo"], "tecnologias": ["nodejs"], "herramientas": ["claude-code"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Traeme la doc actual de RLS en Supabase.\n\n**Resultado:** Detecta la versión instalada en package.json y el lockfile, reutiliza el cache si coincide y tiene menos de 30 días, y si no busca en la fuente oficial. Escribe docs/tech-stack/supabase.md con versión, fecha y fuente, y devuelve un resumen accionable.", "ruta": "agentes/g15-tech-docs-fetcher"}, {"name": "g15-technical-debt-keeper", "description": "Propone altas, cambios y cierres de deuda técnica de FutTracker desde la evidencia del sprint, con impacto, consecuencia de demorar y momento de pago sugerido, para que valide el TL. Usalo en el cierre técnico del sprint; no modifica el registro existente.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Proponé las altas de deuda técnica que surgieron en el sprint.\n\n**Resultado:** Lee tl/deuda-tecnica/registro.md para no duplicar, distingue deuda, bug e incumplimiento de estándar, y escribe tl/deuda-tecnica/propuestas-<fecha>.md con evidencia, impacto y momento de pago. El registro queda intacto hasta que el TL valide.", "ruta": "agentes/g15-technical-debt-keeper"}, {"name": "g15-technical-progress-reporter", "description": "Prepara el borrador del parte semanal técnico de FutTracker (cerrado, trabado, reestimado) desde tickets, PRs y el contexto del TL, para que el TL lo valide antes de que lo use el PM. Usalo ante el pedido de parte del PM; no redacta conclusiones de cronograma, semáforo ni EVM.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "github", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el parte técnico de la semana para el PM.\n\n**Resultado:** Distingue cerrado de abierto y mergeado de solo revisado, muestra bloqueos y cambios frente a la estimación humana, y escribe tl/parte-semanal/<semana>.md con TL validador, estado y fecha. Sin validación del TL, el PM lo recibe como borrador.", "ruta": "agentes/g15-technical-progress-reporter"}, {"name": "g15-technical-retro-analyst", "description": "Analiza la retrospectiva técnica del sprint de FutTracker sobre todos los PRs con actividad en el período (también abiertos y con cambios pedidos) y los acuerdos previos, y propone como máximo tres mejoras verificables. Usalo en el cierre técnico del sprint; el TL decide y no se atribuyen culpas.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "github", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hacé la retro técnica del sprint 2.\n\n**Resultado:** Registra el universo de PRs consultado, separa patrones observados de hipótesis, revisa los acuerdos anteriores y escribe tl/retro/<sprint>.md con hasta tres mejoras (responsable humano, señal verificable y fecha) para aprobación del TL.", "ruta": "agentes/g15-technical-retro-analyst"}, {"name": "g15-test-quality-analyst", "description": "Evalúa la calidad de la evidencia de tests de un PR pendiente de FutTracker, nuevo o con commits nuevos: mapea criterios de aceptación a tests y clasifica fallos demostrados, riesgos inferidos y pruebas propuestas. Usalo en la QA de PRs; propone pruebas para que las ejecute el dev, nunca las corre ni escribe código.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Analizá la calidad de los tests del PR 36.\n\n**Resultado:** Mapea los criterios congelados a los tests y a lo que demuestra el CI, compara con la revisión QA anterior por commit y escribe qa/revisiones/36-<head>-tests.md con matriz test, criterio y evidencia, propuestas de prueba y bloqueos.", "ruta": "agentes/g15-test-quality-analyst"}, {"name": "g15-ticket-feasibility-analyst", "description": "Contrasta la factibilidad técnica de los tickets propuestos para una épica de FutTracker contra el schema y el código vigentes (reuso, colisiones, dependencias, casos borde), sin implementar ni estimar. Usalo cuando el PO pide el aporte del TL antes de refinar una épica.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion", "backend"], "fase": ["analisis"], "tecnologias": ["supabase"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Revisá la factibilidad técnica de los tickets de la próxima épica.\n\n**Resultado:** Arma una matriz requisito, evidencia, factibilidad y dependencia (factible, condicionado o decisión pendiente) con archivo y línea, y escribe tl/producto/factibilidad-<epica>-<fecha>.md pendiente de validación del TL. No edita Linear.", "ruta": "agentes/g15-ticket-feasibility-analyst"}, {"name": "g15-tl-orchestrator", "description": "Router del rol TL de FutTracker: coordina la revisión técnica de PRs, el cierre técnico del sprint (retro, deuda, estándares) y los aportes técnicos a PM y PO, delegando en los especialistas TL. Usalo para P4, P5 o P7; nunca ejecuta agentes de desarrollo.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hagamos el cierre técnico del sprint.\n\n**Resultado:** Delega la retrospectiva en g15-technical-retro-analyst y, solo si aplica, la deuda en g15-technical-debt-keeper y los estándares en g15-standards-maintainer. Devuelve el consolidado con un máximo de tres mejoras para validar por el TL humano.", "ruta": "agentes/g15-tl-orchestrator"}, {"name": "g15-tooling-catalog-tracker", "description": "Lleva el estado del catálogo de 9 herramientas de productividad candidatas del Plan 2 de FutTracker, que sigue pendiente con 8 preguntas abiertas, y marca qué pregunta bloquea cada ítem. Usalo al retomar el Plan 2; reporta el estado sin recomendar qué herramienta adoptar.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion", "ia"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Actualizá el estado del catálogo de herramientas del Plan 2.\n\n**Resultado:** Lee el plan y busca en Engram decisiones nuevas, clasifica cada uno de los 9 ítems (candidato, decidido, descartado o bloqueado) y edita solo las columnas de estado y notas, sin tocar la estructura ni las estimaciones.", "ruta": "agentes/g15-tooling-catalog-tracker"}, {"name": "g15-training-audit-scheduler", "description": "Hace seguimiento de los hallazgos de auditoría del repo de capacitación de FutTracker (7 arreglos priorizados) y del cronograma de capacitación de 3 h + 3 h. Usalo para ver el avance del material o actualizar el cronograma sin volver a auditar desde cero.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion", "documentacion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Cómo vienen los 7 arreglos del repo de capacitación?\n\n**Resultado:** Lee los dos documentos de capacitación, marca cada arreglo como planificado, en curso, hecho o descartado, verifica que el cronograma de 3 h + 3 h siga coincidiendo y señala lo marcado como hecho sin confirmar.", "ruta": "agentes/g15-training-audit-scheduler"}, {"name": "g15-uat-script-planner", "description": "Escribe, refresca y hace el preflight de los guiones de UAT de FutTracker para un validador no técnico, uno por story, a partir de sus criterios de aceptación en Linear. Usalo cuando una story se acerca a Done y necesita su guion antes de ejecutar; nunca corre pruebas ni opera entornos.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el guion de UAT de FUT-88.\n\n**Resultado:** Trae el ticket y el alcance de la story, compara con el guion existente (vigente, desactualizado o no verificable) y escribe qa/uat/FUT-88-<slug>.md con pasos numerados de precondición, acción y resultado observable, marcando los criterios vagos.", "ruta": "agentes/g15-uat-script-planner"}, {"name": "g15-weekly-status-report", "description": "Arma el reporte semanal de avance de FutTracker cruzando el movimiento real de tickets en Linear con el mini-reporte escrito por el PM, más los campos de texto del tablero de la cátedra para copiar a mano. Usalo al preparar el reporte de la semana o para revisar qué capturó uno anterior; no calcula EVM.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el reporte de la semana con este mini-reporte.\n\n**Resultado:** Cruza Linear con el mini-reporte, marca el reporte como PRELIMINAR si falta el parte técnico validado y devuelve el reporte en Markdown con semáforos propuestos, actividades, incidentes y banderas de higiene de tickets. Lo guarda en Engram.", "ruta": "agentes/g15-weekly-status-report"}, {"name": "g02-registro-de-decisiones-pm", "description": "Usar después de la reunión semanal de Zest (los jueves) para convertir las notas en un registro de decisiones con motivo, quién decidió, responsable y fecha. Separa decisiones de temas discutidos, detecta pendientes sin dueño y contradicciones con decisiones anteriores, y avisa cuáles tocan la línea base y necesitan control de cambios.", "tipo": "comando", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["google-drive"], "madurez": "experimental", "relacionados": ["g02-control-de-cambios", "g02-status-report-format", "g02-zest-onboarding", "g15-adr-writer"], "ejemplo": "**Pedido:** \"/g02-registro-de-decisiones-pm Notas del jueves 13/08: se dio el challenge de la primera semana; 10 agentes por persona de 5to; tickets para los chicos lo hacemos nosotras por ahora; todos los tickets deben tener fecha; usamos Multica en vez de Jira.\"\n\n**Resultado:** Una tabla con cuatro decisiones (las gestoras crean los tickets por ahora; todos los tickets llevan fecha; se usa Multica en lugar de Jira; el PM registra las decisiones), cada una con quién decidió, responsable y qué toca; los dos datos informados (10 agentes por persona, el uso de Vercel en otros equipos) separados; ninguna que requiera control de cambios; y la propuesta de agregarlas al registro cuando den el OK.", "ruta": "comandos/g02-registro-de-decisiones-pm"}, {"name": "g11-auditar-errores", "description": "Audita el manejo de errores de punta a punta en una app web con API REST (pensado para NestJS, Prisma y Next.js) y entrega una matriz error → respuesta → mensaje en pantalla con archivo:línea. Usar para encontrar errores que terminan en 500 o pantallas que no le dicen al usuario qué pasó; no edita código.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["backend", "frontend", "qa"], "fase": ["revision", "mantenimiento"], "tecnologias": ["nestjs", "prisma", "nextjs"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-contrato-api"], "ejemplo": "**Pedido:** `/g11-auditar-errores join-requests`\n\n**Resultado:** El manejo es prolijo: hay un helper que traduce P2002 y P2025 y el front pasa todo a español. Igual\nencontró tres problemas. El panel del organizador dice \"el partido está lleno\" ante cualquier 409 al\naceptar, aunque la solicitud ya estuviera resuelta. Si el jugador cancela justo cuando lo aceptan, el\nback devuelve 500, porque ese catch solo mapea P2002. Y \"el partido ya se jugó\" es 400 en solicitudes y\n409 en invitaciones. Propuso que el back mande un `code` estable por error, como ya hace con la cuenta\nbloqueada, en vez de que el front compare textos en inglés.", "ruta": "comandos/g11-auditar-errores"}, {"name": "g11-auditoria-bugs", "description": "Audita una app web desplegada con Playwright (flujos, viewports, permisos de la API) y entrega un informe de bugs priorizado por severidad, con evidencia y causa en el código. Usar para buscar bugs en un entorno desplegado; no arregla nada.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["qa", "seguridad"], "fase": ["testing"], "tecnologias": ["playwright"], "herramientas": ["claude-code"], "requiere": ["playwright"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** `/g11-auditoria-bugs https://mi-app-dev.vercel.app ~/proyectos/mi-app ISSUES.md`\n\n**Resultado:** Recorre los flujos principales con Playwright en 375, 1280 y 1440 px usando dos cuentas de prueba, verifica en vivo los permisos de la API y deja `~/mi-app-audit-<fecha>/informe.md` con los hallazgos ordenados por severidad, su evidencia y la causa probable en `archivo:línea`, sin tocar el repo.", "ruta": "comandos/g11-auditoria-bugs"}, {"name": "g11-implementar-conmigo", "description": "Implementa en pareja con el dev un ticket ya especificado: explica cómo se traduce al código y por qué, le deja las decisiones libres, construye test primero y recorre el diff con él. Usar cuando el dev quiere aprender mientras implementa, no recibir la feature hecha.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [], "area": ["backend", "frontend"], "fase": ["desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-implementar-conmigo SPO-271`\n\n**Resultado:** Trae el ticket, explica el plan con la fuente de cada parte (ticket, repo, precedente o libre), espera las decisiones libres del dev y construye en tramos, con el test primero. Deja commits locales con tests en verde, el registro de decisiones y una propuesta de descripción de PR; no hace push sin OK.", "ruta": "comandos/g11-implementar-conmigo"}, {"name": "g11-partir-pr", "description": "Propone cómo partir una PR o rama grande de git en varias PRs chicas que compilen solas, con el orden de merge y los comandos para armarlas. Usar cuando una PR quedó demasiado grande para revisarla; no ejecuta nada sin OK.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-partir-pr 145` (panel de reportes de administración de SportMatch: +1261 líneas, 22 archivos)\n\n**Resultado:** Propone 4 PRs. (1) La hoja inferior que se cierra arrastrando (`gesture`,\n`use-drag-to-dismiss`, `bottom-sheet`, ~175 líneas), separada porque cambia **todas** las hojas de la\napp. (2) Los componentes `swipe-row`, `segmented-control`, `badge` y `use-timed-toast` (~420, depende de\nla 1). (3) Tipos, cliente y hooks de reportes (~210, independiente). (4) La pantalla `/admin/reportes`\ncon el acceso desde Ajustes (~455, depende de las tres). Incluye los comandos para armar cada rama.", "ruta": "comandos/g11-partir-pr"}, {"name": "g11-plan-actualizacion", "description": "Arma un plan para actualizar las dependencias de un proyecto npm: lee los changelogs de las versiones mayores, busca los usos que se rompen y ordena las actualizaciones en tandas con su riesgo. Usar cuando hay que actualizar dependencias; no instala ni cambia nada sin OK.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["devops"], "fase": ["mantenimiento"], "tecnologias": ["nodejs"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** `/g11-plan-actualizacion` (front y back de SportMatch)\n\n**Resultado:** Encontró 47 paquetes desactualizados y 77 vulnerabilidades. Como no había `node_modules`, sacó las\nversiones del lockfile. Puso primero una tanda de bajo riesgo: next 16.4.5 cierra los avisos críticos sin\nser major, y prisma 7.10.1 con @nestjs 11.2.8 cierran los altos del back. Dejó NestJS 12 para el final,\nporque obliga a TypeScript 6, que deprecia `baseUrl` (`back/tsconfig.json:16`) y activa `strict`.\nDesaconsejó prisma 8 (el `latest` es un RC) e ignoró los \"fixes\" de `npm audit` que bajaban de versión\nfirebase, shadcn y jest.", "ruta": "comandos/g11-plan-actualizacion"}, {"name": "g11-revisar-migracion", "description": "Revisa las migraciones de Prisma o SQL de una PR buscando pérdida de datos, renombres que se vuelven borrados, NOT NULL o UNIQUE que fallan con datos existentes y desfasajes con el schema. Usar antes de que una migración llegue a producción; entrega un veredicto y no modifica nada.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["backend", "datos", "devops"], "fase": ["revision", "despliegue"], "tecnologias": ["prisma", "postgresql"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-revisar-migracion 82` (la PR que pasó el schema de SportMatch de español a inglés)\n\n**Resultado:** \"Segura con condiciones\". Son renombres hechos a mano, sin pérdida de datos. Pero los 18\n`RENAME CONSTRAINT ..._not_null` solo funcionan en PostgreSQL 18 o más, y como `docker-entrypoint.sh:4`\ncorre `migrate deploy` en cada arranque, con una versión anterior el backend no levanta. Entrega las\nconsultas `SELECT` para confirmarlo antes del deploy y el camino de vuelta con renombres inversos.", "ruta": "comandos/g11-revisar-migracion"}, {"name": "g11-revisar-para-aprender", "description": "Revisa lo que un dev ya codeó para que aprenda: reconstruye sus decisiones, explica qué cuestan y qué alternativas había, y entrega una lección HTML corta con preguntas de repaso. Usar al terminar una rama o PR, sobre todo con devs junior; no aprueba ni bloquea.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g08-pr-feedback-generator"], "ejemplo": "**Pedido:** `/g11-revisar-para-aprender 149`\n\n**Resultado:** Elige las 3 a 6 decisiones más instructivas de la PR, le pregunta al dev por algunas antes de explicarlas y entrega una lección HTML corta con alternativas, el principio en juego, la mirada de QA y preguntas de repaso. No aprueba ni bloquea la PR.", "ruta": "comandos/g11-revisar-para-aprender"}], A = [{"grupo": "01", "nombre": "Francisco Zizzi", "github": "FranciscoZizzi"}, {"grupo": "01", "nombre": "Tomás Roldán Borjas", "github": "TomRolB"}, {"grupo": "01", "nombre": "Agustín Alma", "github": "AAgustin9"}, {"grupo": "01", "nombre": "Tobías Grati", "github": "tbgrati"}, {"grupo": "02", "nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, {"grupo": "02", "nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, {"grupo": "02", "nombre": "Luz Laura", "github": "luzlaura"}, {"grupo": "02", "nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, {"grupo": "03", "nombre": "Julieta Iglesias", "github": "JuliIglesias"}, {"grupo": "03", "nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"grupo": "03", "nombre": "Mateo Piccinini", "github": "mPiccinini"}, {"grupo": "03", "nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, {"grupo": "04", "nombre": "Manuel Lostaló", "github": "ManuLosta"}, {"grupo": "04", "nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, {"grupo": "04", "nombre": "Martin Barreiro", "github": "martinbar
