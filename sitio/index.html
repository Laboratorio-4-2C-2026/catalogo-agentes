9 en invitaciones. Propuso que el back mande un `code` estable por error, como ya hace con la cuenta\nbloqueada, en vez de que el front compare textos en inglés.", "ruta": "comandos/g11-auditar-errores"}, {"name": "g11-auditoria-bugs", "description": "Audita una app web desplegada con Playwright (flujos, viewports, permisos de la API) y entrega un informe de bugs priorizado por severidad, con evidencia y causa en el código. Usar para buscar bugs en un entorno desplegado; no arregla nada.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["qa", "seguridad"], "fase": ["testing"], "tecnologias": ["playwright"], "herramientas": ["claude-code"], "requiere": ["playwright"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** `/g11-auditoria-bugs https://mi-app-dev.vercel.app ~/proyectos/mi-app ISSUES.md`\n\n**Resultado:** Recorre los flujos principales con Playwright en 375, 1280 y 1440 px usando dos cuentas de prueba, verifica en vivo los permisos de la API y deja `~/mi-app-audit-<fecha>/informe.md` con los hallazgos ordenados por severidad, su evidencia y la causa probable en `archivo:línea`, sin tocar el repo.", "ruta": "comandos/g11-auditoria-bugs"}, {"name": "g11-implementar-conmigo", "description": "Implementa en pareja con el dev un ticket ya especificado: explica cómo se traduce al código y por qué, le deja las decisiones libres, construye test primero y recorre el diff con él. Usar cuando el dev quiere aprender mientras implementa, no recibir la feature hecha.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [], "area": ["backend", "frontend"], "fase": ["desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-implementar-conmigo SPO-271`\n\n**Resultado:** Trae el ticket, explica el plan con la fuente de cada parte (ticket, repo, precedente o libre), espera las decisiones libres del dev y construye en tramos, con el test primero. Deja commits locales con tests en verde, el registro de decisiones y una propuesta de descripción de PR; no hace push sin OK.", "ruta": "comandos/g11-implementar-conmigo"}, {"name": "g11-partir-pr", "description": "Propone cómo partir una PR o rama grande de git en varias PRs chicas que compilen solas, con el orden de merge y los comandos para armarlas. Usar cuando una PR quedó demasiado grande para revisarla; no ejecuta nada sin OK.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-partir-pr 145` (panel de reportes de administración de SportMatch: +1261 líneas, 22 archivos)\n\n**Resultado:** Propone 4 PRs. (1) La hoja inferior que se cierra arrastrando (`gesture`,\n`use-drag-to-dismiss`, `bottom-sheet`, ~175 líneas), separada porque cambia **todas** las hojas de la\napp. (2) Los componentes `swipe-row`, `segmented-control`, `badge` y `use-timed-toast` (~420, depende de\nla 1). (3) Tipos, cliente y hooks de reportes (~210, independiente). (4) La pantalla `/admin/reportes`\ncon el acceso desde Ajustes (~455, depende de las tres). Incluye los comandos para armar cada rama.", "ruta": "comandos/g11-partir-pr"}, {"name": "g11-plan-actualizacion", "description": "Arma un plan para actualizar las dependencias de un proyecto npm: lee los changelogs de las versiones mayores, busca los usos que se rompen y ordena las actualizaciones en tandas con su riesgo. Usar cuando hay que actualizar dependencias; no instala ni cambia nada sin OK.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Santos Bogo", "github": "santosbogo"}, "colaboradores": [], "area": ["devops"], "fase": ["mantenimiento"], "tecnologias": ["nodejs"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** `/g11-plan-actualizacion` (front y back de SportMatch)\n\n**Resultado:** Encontró 47 paquetes desactualizados y 77 vulnerabilidades. Como no había `node_modules`, sacó las\nversiones del lockfile. Puso primero una tanda de bajo riesgo: next 16.4.5 cierra los avisos críticos sin\nser major, y prisma 7.10.1 con @nestjs 11.2.8 cierran los altos del back. Dejó NestJS 12 para el final,\nporque obliga a TypeScript 6, que deprecia `baseUrl` (`back/tsconfig.json:16`) y activa `strict`.\nDesaconsejó prisma 8 (el `latest` es un RC) e ignoró los \"fixes\" de `npm audit` que bajaban de versión\nfirebase, shadcn y jest.", "ruta": "comandos/g11-plan-actualizacion"}, {"name": "g11-revisar-migracion", "description": "Revisa las migraciones de Prisma o SQL de una PR buscando pérdida de datos, renombres que se vuelven borrados, NOT NULL o UNIQUE que fallan con datos existentes y desfasajes con el schema. Usar antes de que una migración llegue a producción; entrega un veredicto y no modifica nada.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Ignacio Chevallier Boutell", "github": "IgnacioChevallier"}, "colaboradores": [], "area": ["backend", "datos", "devops"], "fase": ["revision", "despliegue"], "tecnologias": ["prisma", "postgresql"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "probado", "relacionados": [], "ejemplo": "**Pedido:** `/g11-revisar-migracion 82` (la PR que pasó el schema de SportMatch de español a inglés)\n\n**Resultado:** \"Segura con condiciones\". Son renombres hechos a mano, sin pérdida de datos. Pero los 18\n`RENAME CONSTRAINT ..._not_null` solo funcionan en PostgreSQL 18 o más, y como `docker-entrypoint.sh:4`\ncorre `migrate deploy` en cada arranque, con una versión anterior el backend no levanta. Entrega las\nconsultas `SELECT` para confirmarlo antes del deploy y el camino de vuelta con renombres inversos.", "ruta": "comandos/g11-revisar-migracion"}, {"name": "g11-revisar-para-aprender", "description": "Revisa lo que un dev ya codeó para que aprenda: reconstruye sus decisiones, explica qué cuestan y qué alternativas había, y entrega una lección HTML corta con preguntas de repaso. Usar al terminar una rama o PR, sobre todo con devs junior; no aprueba ni bloquea.", "tipo": "comando", "grupo": "11", "autor": {"nombre": "Matías Chialva", "github": "Matichialvaa"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g08-pr-feedback-generator"], "ejemplo": "**Pedido:** `/g11-revisar-para-aprender 149`\n\n**Resultado:** Elige las 3 a 6 decisiones más instructivas de la PR, le pregunta al dev por algunas antes de explicarlas y entrega una lección HTML corta con alternativas, el principio en juego, la mirada de QA y preguntas de repaso. No aprueba ni bloquea la PR.", "ruta": "comandos/g11-revisar-para-aprender"}], A = [{"grupo": "01", "nombre": "Francisco Zizzi", "github": "FranciscoZizzi"}, {"grupo": "01", "nombre": "Tomás Roldán Borjas", "github": "TomRolB"}, {"grupo": "01", "nombre": "Agustín Alma", "github": "AAgustin9"}, {"grupo": "01", "nombre": "Tobías Grati", "github": "tbgrati"}, {"grupo": "02", "nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, {"grupo": "02", "nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, {"grupo": "02", "nombre": "Luz Laura", "github": "luzlaura"}, {"grupo": "02", "nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, {"grupo": "03", "nombre": "Julieta Iglesias", "github": "JuliIglesias"}, {"grupo": "03", "nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"grupo": "03", "nombre": "Mateo Piccinini", "github": "mPiccinini"}, {"grupo": "03", "nombre": "Lautaro German Reinoso", "github": "LautiGR1 const low = s => String(s||"").toLowerCase();
const alumno = gh => A.find(a => low(a.github) === low(gh));
const comoAutor = gh => P.filter(p => p.autor && low(p.autor.github) === low(gh) && p.grupo !== "00");
const comoColab = gh => P.filter(p => p.colaboradores.some(c => low(c.github) === low(gh)) && p.grupo !== "00");
const st = {q:"", area:new Set(), fase:new Set(), herramientas:new Set(), grupo:new Set(), gAv:new Set()};
const $ = id => document.getElementById(id);
function e(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function a(href,txt,c){const n=e("a",c,txt);n.href=href;return n}
function linkPersona(p){if(!p)return e("span",null,"—");return alumno(p.github)?a("#alumno/"+encodeURIComponent(p.github),p.nombre||p.github):e("span",null,p.nombre||p.github)}

function ruta(){const h=decodeURIComponent(location.hash.slice(1));const i=h.indexOf("/");
  return i<0?{v:h||"explorar",id:null}:{v:h.slice(0,i),id:h.slice(i+1)}}
function render(){const r=ruta();const av=r.v==="avance"||r.v==="alumno";
  $("tab-explorar").className=av?"":"on";$("tab-avance").className=av?"on":"";
  $("sub").textContent=P.length+" piezas · "+A.length+" alumnos · "+new Set(P.map(p=>p.grupo)).size+" grupos con piezas";
  const m=$("main");m.innerHTML="";av?vistaAvance(m,r.v==="alumno"?r.id:null):vistaExplorar(m,r.v==="pieza"?r.id:null);
  if(r.v==="pieza"||r.v==="alumno"){const s=document.querySelector(".on[data-k]");if(s)s.scrollIntoView({block:"nearest"})}}

function chips(box,campo,valores,etq){valores.forEach(v=>{const b=e("button","chip"+(st[campo].has(v)?" on":""),etq?etq(v):v);
  b.onclick=()=>{st[campo].has(v)?st[campo].delete(v):st[campo].add(v);render()};box.append(b)})}
function ok(p){const q=low(st.q);
  if(q&&!low(p.name+" "+p.description+" "+p.tecnologias.join(" ")+" "+(p.autor?p.autor.nombre:"")).includes(q))return false;
  for(const c of ["area","fase","herramientas","grupo"]){if(st[c].size&&![].concat(p[c]).some(v=>st[c].has(v)))return false}return true}

function vistaExplorar(m,sel){
  const q=e("input");q.type="search";q.placeholder="Buscar por nombre, descripción, tecnología o autor…";q.value=st.q;
  q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;render();const n=document.querySelector("input");n.focus();n.setSelectionRange(pos,pos)};m.append(q);
  for(const [campo,et] of [["area","Área"],["fase","Fase"],["herramientas","Herramienta"],["grupo","Grupo"]]){
    const r=e("div","row");r.append(e("b",null,et));chips(r,campo,[...new Set(P.flatMap(p=>[].concat(p[campo])))].sort(),campo==="grupo"?v=>"g"+v:null);m.append(r)}
  const l=P.filter(ok);if(!sel||!l.some(p=>p.name===sel))sel=l.length?l[0].name:null;
  const g=e("div","g"),list=e("div","list"),d=e("div","d");g.append(list,d);m.append(g);
  list.append(e("div","m s",l.length+" de "+P.length+" piezas"));
  l.forEach(p=>{const c=a("#pieza/"+encodeURIComponent(p.name),null,"c"+(p.name===sel?" on":""));c.dataset.k=1;
    c.append(e("div","n",p.name),e("div","m s",p.description));const t=e("div");
    p.area.forEach(v=>t.append(e("span","t",v)));p.herramientas.forEach(v=>t.append(e("span","t b",v)));c.append(t);list.append(c)});
  const p=P.find(x=>x.name===sel);
  if(!p){d.append(e("div","m",P.length?"Ninguna pieza coincide con los filtros.":"Todavía no hay piezas en el catálogo."));return}
  d.append(e("div","n",p.name),e("p",null,p.description));const dl=e("dl");
  const fila=(k,v)=>{dl.append(e("dt",null,k));const dd=e("dd");typeof v==="string"?dd.textContent=v||"—":dd.append(v);dl.append(dd)};
  fila("Tipo",p.tipo);fila("Grupo","g"+p.grupo);fila("Autor",linkPersona(p.autor));
  const col=e("span");p.colaboradores.forEach((c,i)=>{if(i)col.append(", ");col.append(linkPersona(c))});fila("Colaboradores",p.colaboradores.length?col:"—");
  fila("Área",p.area.join(", "));fila("Fase",p.fase.join(", "));fila("Tecnologías",p.tecnologias.join(", "));
  fila("Funciona en",p.herramientas.join(", "));fila("Requiere",p.requiere.join(", ")||"nada externo");fila("Madurez",p.madurez);fila("Carpeta",p.ruta);
  d.append(dl,e("h3",null,"Ejemplo de uso"),e("pre",null,p.ejemplo||"—"));
  if(p.relacionados.length){d.append(e("h3",null,"Relacionadas"));const u=e("ul","p");
    p.relacionados.forEach(n=>{const li=e("li");li.append(P.some(x=>x.name===n)?a("#pieza/"+encodeURIComponent(n),n):e("span",null,n));u.append(li)});d.append(u)}}

function vistaAvance(m,sel){
  const grupos=[...new Set(A.map(x=>x.grupo))].sort();const r=e("div","row");r.style.marginTop="16px";r.append(e("b",null,"Grupo"));
  grupos.forEach(gr=>{const b=e("button","chip"+(st.gAv.has(gr)?" on":""),"g"+gr);b.onclick=()=>{st.gAv.has(gr)?st.gAv.delete(gr):st.gAv.add(gr);render()};r.append(b)});m.append(r);
  const vis=A.filter(x=>!st.gAv.size||st.gAv.has(x.grupo));const n=x=>comoAutor(x.github).length;
  const s=e("div","stats");[[vis.filter(x=>n(x)>=META).length+" de "+vis.length,"alumnos con "+META+" o más"],
    [vis.reduce((t,x)=>t+n(x),0),"piezas como autor"],[vis.reduce((t,x)=>t+comoColab(x.github).length,0),"colaboraciones"]]
    .forEach(([v,k])=>{const c=e("div","st");c.append(e("div","v",String(v)),e("div","m s",k));s.append(c)});m.append(s);
  const g=e("div","g"),izq=e("div"),d=e("div","d");g.append(izq,d);m.append(g);
  const tw=e("div","tw"),tb=e("table");tb.innerHTML="<tr><th>Alumno</th><th>Grupo</th><th>Autor</th><th>Avance</th><th>Colab.</th><th>Estado</th></tr>";
