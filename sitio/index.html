generá el reporte de readiness para autorizar el pase a producción.\"\n\n**Resultado:** Reporte ejecutivo generado en `next_tickets/sprint_29_05_nov/sprint_readiness_report.md` detallando el estado de 9 tickets (8 mergeados, 1 pospuesto sin bloqueo crítico), resultado exitoso de `code-freeze-auditor` con 0 warnings, balance de 18 hs cumplido y dictamen de READY FOR PROD para mergear a `main`.", "ruta": "agentes/g08-sprint-readiness-orchestrator"}, {"name": "g08-teacher", "description": "Asistente mentor pedagógico que explica conceptos técnicos, patrones de diseño y decisiones de arquitectura del proyecto de forma clara y adaptada. Usar para resolver dudas conceptuales.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["documentacion", "ia"], "fase": ["analisis", "desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Explicame por qué separamos la lógica en 4 capas en lugar de llamar a Firestore desde la ruta.\n\n**Resultado:** Explicación pedagógica sobre desacoplamiento, facilidad de testeo unitario sin emuladores y separación de responsabilidades.", "ruta": "agentes/g08-teacher"}, {"name": "g08-ticket-creator", "description": "Crea tickets de desarrollo estructurados en formato Markdown con objetivos claros, contexto técnico y criterios de aceptación verificables. Usar al descomponer requerimientos en tareas asignables.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-ticket-creator-backend", "g08-ticket-creator-frontend", "g08-qa-ticket-reviewer"], "ejemplo": "**Pedido:** Escribí el ticket para implementar el sistema de notificaciones toast en la app.\n\n**Resultado:** Ticket completo con contexto, componentes a crear, comportamiento esperado y criterios de aceptación.", "ruta": "agentes/g08-ticket-creator"}, {"name": "g08-ticket-creator-backend", "description": "Genera tickets técnicos de backend en formato Markdown con firmas, DTOs y criterios de aceptación sin dar código copy-paste. Usar al planificar tareas del servidor. Delega frontend a g08-ticket-creator-frontend y orquestación a g08-ticket-orchestrator.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["typescript", "express", "firebase"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-po-backend-tickets", "g08-ticket-creator-frontend", "g08-ticket-orchestrator"], "ejemplo": "**Pedido:** Redactá el ticket técnico de backend para implementar el endpoint de reintento masivo de IA por examen.\n\n**Resultado:** Ticket Markdown estructurado en `next_tickets/backend/` con firmas exactas de controlador y servicio, validaciones Zod, código HTTP 200/409, tests unitarios requeridos y criterios de aceptación, sin código de copia y pega.", "ruta": "agentes/g08-ticket-creator-backend"}, {"name": "g08-ticket-creator-frontend", "description": "Genera tickets de desarrollo frontend en Markdown enfocados en componentes, tokens de diseño y UI reutilizable sin código copy-paste. Usar al planificar vistas y pantallas. Delega backend a g08-ticket-creator-backend e integración a g08-ticket-creator-integration.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["frontend", "gestion"], "fase": ["planificacion", "diseno"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-po-frontend-tickets", "g08-ticket-creator-backend", "g08-ticket-creator-integration"], "ejemplo": "**Pedido:** Creá el ticket de frontend para maquetar el modal de aprobación individual de exámenes con confirmación.\n\n**Resultado:** Ticket Markdown estructurado en `next_tickets/frontend/` detallando componentes de Shadcn UI a reutilizar, tokens de color aplicables, estados de carga y criterios de aceptación, sin código de copia y pega.", "ruta": "agentes/g08-ticket-creator-frontend"}, {"name": "g08-ticket-creator-integration", "description": "Genera tickets de integración frontend-backend en Markdown detallando servicios API, estados asíncronos y planes de prueba manual sin código copy-paste. Usar al conectar pantallas con endpoints. Delega backend a g08-ticket-creator-backend y frontend a g08-ticket-creator-frontend.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "frontend", "gestion"], "fase": ["planificacion", "testing"], "tecnologias": ["typescript", "react", "express"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-po-integration-tickets", "g08-ticket-creator-backend", "g08-ticket-creator-frontend"], "ejemplo": "**Pedido:** Creá el ticket de integración para conectar la acción de cierre definitivo de examen entre el diálogo docente y la vista del alumno.\n\n**Resultado:** Ticket Markdown estructurado en `next_tickets/integration/` detallando el método `closeExam` en `examService.ts`, el manejo de feedback por toast, el bloqueo en `TakeExamPage.tsx` y el plan de prueba manual E2E paso a paso.", "ruta": "agentes/g08-ticket-creator-integration"}, {"name": "g08-ticket-orchestrator", "description": "Tech Lead y orquestador que coordina el desglose de tickets del sprint, balancea estrictamente 6 hs semanales por desarrollador y genera diagramas Mermaid. Usar al planificar la capacidad del sprint. Delega la redacción de tickets a g08-ticket-creator-*.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-sprint-readiness-orchestrator", "g08-ticket-creator-backend", "g08-ticket-creator-frontend", "g08-ticket-creator-integration"], "ejemplo": "**Pedido:** Planificá la distribución de 18 horas para el sprint del 29 de Octubre al 5 de Noviembre entre los 3 desarrolladores.\n\n**Resultado:** Plan de sprint balanceado en `next_tickets/` con 6.0 horas exactas para Facu (Reintentos masivos y CI), 6.0 horas para Lulo (Aprobación individual) y 6.0 horas para Tomi (Cierre de examen y bloqueo), incluyendo diagrama de dependencias Mermaid.", "ruta": "agentes/g08-ticket-orchestrator"}, {"name": "g08-tough-job-planning-agent", "description": "Orquesta requerimientos complejos y multifacéticos dividiéndolos en fases de ejecución, aclarando dudas con el usuario y asignando subtareas a agentes especializados. Usar al encarar épicas grandes.", "tipo": "agente", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Planificá la migración del pipeline de corrección automática a un modelo con reintentos asíncronos.\n\n**Resultado:** Plan en 3 fases (contratos, worker asíncrono y auditoría UI) con prompts listos para despachar a cada agente especializado.", "ruta": "agentes/g08-tough-job-planning-agent"}, {"name": "g15-adr-writer", "description": "Redacta ADRs a nivel programa de gestión de FutTracker (herramientas, metodología, modelo de cronograma, stack de IA), que son decisiones del Tech Lead, nunca decisiones de implementación del producto. Usalo cuando se tomó una decisión de gestión que cambia un límite y hay que dejar su porqué registrado.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion", "gestion"], "fase": ["diseno"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Documentá la decisión de tratar el Módulo 0 como pre-supuesto.\n\n**Resultado:** Confirma que la decisión es de gestión y no de producto, y escribe un ADR numerado en tl/adr/ con estado, contexto, decisión, consecuencias y alternativas, usando el razonamiento aportado. También lo guarda en Engram.", "ruta": "agentes/g15-adr-writer"}, {"name": "g15-agent-opportunity-orchestrator", "description": "Coordina una ronda de brainstorming de agentes para FutTracker con cuatro miradas (PM, PO, QA, TL), la contrasta con los agentes y skills existentes y sintetiza propuestas sin duplicaciones. Usalo ante «qué agentes nos faltan»; solo propone, no implementa ni ejecuta los agentes propuestos.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["ia", "gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Qué agentes nos faltan? Repetí la ronda PM/PO/QA/TL.\n\n**Resultado:** Inventaría agentes y skills, delega los cuatro perfiles y devuelve una síntesis corta con una tabla de ampliaciones, nuevos, condicionados y descartes con dueño y solapamiento. Después propone entrevistar una propuesta por vez.", "ruta": "agentes/g15-agent-opportunity-orchestrator"}, {"name": "g15-backend-supabase-implementer", "description": "Dado un ticket de Linear de FutTracker, implementa el backend que pide (schema, migraciones versionadas de Supabase, políticas RLS y API routes o Server Actions) siguiendo las convenciones de auth y RLS del propio repo. Usalo cuando un dev backend toma un ticket de datos o API; corre dentro del repo de producto.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["supabase", "postgresql", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Implementá el backend del ticket FUT-90 (tabla de estadísticas con RLS).\n\n**Resultado:** Lee el ticket y las convenciones del repo, genera la migración con el CLI de Supabase con RLS en la misma migración, implementa la API o Server Action con los helpers de auth existentes y verifica con supabase db diff local.", "ruta": "agentes/g15-backend-supabase-implementer"}, {"name": "g15-bug-investigator", "description": "Investiga bugs abiertos o hallazgos de validación de release de FutTracker: distingue reproducido, no reproducido y bloqueado, plantea causas como hipótesis y propone severidad y prioridad para que QA valide. Usalo en el triage manual de un bug; nunca arregla ni edita tickets.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Investigá este bug: al editar la zona del perfil queda sin foco el botón Guardar.\n\n**Resultado:** Pide los pasos, la versión y la evidencia, separa hecho, hipótesis y propuesta, y escribe qa/bugs/investigacion-<id>-<fecha>.md con reproducción, hipótesis, severidad propuesta y faltantes. No crea ni modifica tickets.", "ruta": "agentes/g15-bug-investigator"}, {"name": "g15-demo-recorder", "description": "Graba la demo de steering de FutTracker (55 a 60 segundos) con el producto corriendo en local: decide qué entra según Linear y los PRs, escribe el guion, maneja la app con un script de Playwright que se mueve como una persona y verifica el video cuadro a cuadro. Usalo antes de un steering o para regrabar tras cambios; nunca escribe en el repo del producto.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["qa", "gestion"], "fase": ["revision"], "tecnologias": ["nextjs", "supabase", "playwright"], "herramientas": ["claude-code"], "requiere": ["github", "linear", "engram", "playwright"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Grabá la demo del Steering 3 en local.\n\n**Resultado:** Define qué mostrar según Linear y los PRs, levanta Supabase local con el seed, graba los segmentos con cursor y scroll naturales y entrega el .mp4 con duración, una tabla de pasos (grabado, salteado o fallido) y el comando exacto para reproducirlo.", "ruta": "agentes/g15-demo-recorder"}, {"name": "g15-dod-compliance-checker", "description": "Revisa tickets individuales de FutTracker en Linear contra el Definition of Done y los criterios de aceptación a nivel descripción (compliant, sin AC o AC vagos) antes de cerrarlos. Usalo antes de marcar una story como lista para cerrar o para auditar tickets cerrados sin AC visible; no mira PRs (para eso está g15-pr-dod-gate).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["revision", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Chequeá si FUT-87 cumple el DoD antes de cerrarlo.\n\n**Resultado:** Lee el ticket y el alcance de su story, y devuelve un veredicto compliant, missing-AC o vague-AC con una línea de motivo y los desvíos de alcance. No cambia estado ni contenido en Linear.", "ruta": "agentes/g15-dod-compliance-checker"}, {"name": "g15-evm-calculator", "description": "Calcula el Valor Ganado semanal de FutTracker (PV, EV, AC, SPI, CPI, SV, CV, ETC y EAC) aplicando las reglas de EVM del PM sobre una línea base reproducible y el estado real de Linear, separando lo medido de lo supuesto. Usalo antes de un steering o ante «¿cuánto valor ganamos?»; deja un borrador fechado para validar y nunca inventa horas ni puntos.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Calculemos el valor ganado al corte del viernes.\n\n**Resultado:** Lee las reglas de EVM, la línea base y los tickets de Linear, calcula PV, EV y AC con la etiqueta de origen de cada serie, corre los chequeos de cordura y guarda pm/evm/AAAA-MM-DD-evm.md como borrador pendiente de validación del PM.", "ruta": "agentes/g15-evm-calculator"}, {"name": "g15-frontend-design-implementer", "description": "Dado un ticket de Linear de FutTracker con capturas de diseño embebidas, implementa la UI como componentes modulares y reutilizables, consistentes con el codebase existente (design system de facto) y responsive donde el diseño no cubre todos los breakpoints. Usalo cuando un dev frontend toma un ticket con imágenes.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["frontend", "diseno"], "fase": ["desarrollo"], "tecnologias": ["typescript", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Implementá la pantalla de perfil de equipo del ticket FUT-89.\n\n**Resultado:** Lee el ticket, extrae las capturas, releva los componentes y tokens ya implementados, construye la UI reutilizando lo existente y registra los patrones nuevos en docs/tech-stack/design-system.md. Si no hay imágenes en el ticket, lo dice y no inventa el diseño.", "ruta": "agentes/g15-frontend-design-implementer"}, {"name": "g15-functional-uat-executor", "description": "Valida el cumplimiento funcional de una story de FutTracker por criterio, postmerge o en staging, con evidencia real o aportada por un validador humano en modo asistido. Usalo después de un merge o deploy; nunca simula una ejecución ni revisa PRs.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["qa"], "fase": ["testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Validá funcionalmente FUT-87 en staging con la evidencia que te paso.\n\n**Resultado:** Hace el preflight (entorno, revisión desplegada, cuentas), registra cada criterio como cumple, no cumple o bloqueado según la evidencia, y escribe qa/uat/resultados/FUT-87-<fecha>.md. Si no hay browser autorizado, trabaja con los pasos y capturas del validador.", "ruta": "agentes/g15-functional-uat-executor"}, {"name": "g15-governance-checklist-auditor", "description": "Audita el checklist de gobernanza del plan de reestructuración de alcance de FutTracker (cláusula de IA en producto vs proceso, revisión humana de ADR y DoD antes del merge) e informa qué sigue abierto y si bloquea. Usalo periódicamente o antes de dar por cerrado el Plan 1; solo reporta, nunca tilda casillas.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Auditá el checklist de gobernanza del plan 1.\n\n**Resultado:** Lee la sección «Gobernanza (no saltear)» del plan, lista cada ítem tildado o sin tildar, marca los bloqueantes y cruza con Engram para detectar decisiones ya tomadas cuyo casillero quedó sin actualizar.", "ruta": "agentes/g15-governance-checklist-auditor"}, {"name": "g15-onboarding-doc-builder", "description": "Arma el material de onboarding de negocio y proyecto (no de código) para quien se suma al lado de planificación de FutTracker, a partir del plan, las épicas y las decisiones registradas. Usalo cuando entra un nuevo PO, TL, PM o stakeholder.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["documentacion", "gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el onboarding para el nuevo PO.\n\n**Resultado:** Lee el plan, las épicas y las decisiones en Engram, y escribe un documento con qué es FutTracker, alcance y estado actual, decisiones clave con su porqué, vocabulario y a quién consultar. Marca lo que puede estar desactualizado.", "ruta": "agentes/g15-onboarding-doc-builder"}, {"name": "g15-pm-orchestrator", "description": "Router del rol PM de FutTracker: ordena y delega el reporte semanal y el cálculo de valor ganado en los especialistas PM (g15-project-health-monitor, g15-risk-register-keeper, g15-weekly-status-report, g15-evm-calculator), sin hacer el análisis él mismo. Usalo para arrancar un proceso de gestión completo; no redacta ni calcula nada por su cuenta.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Preparemos el reporte semanal.\n\n**Resultado:** Muestra un plan breve, pide el relato semanal y el parte técnico validado, delega en el monitor de salud, el registro de riesgos y el reporte semanal, y devuelve un consolidado con agentes delegados, bloqueos y aprobaciones pendientes. Si falta el parte técnico, el reporte queda marcado como PRELIMINAR.", "ruta": "agentes/g15-pm-orchestrator"}, {"name": "g15-po-backlog-analyst", "description": "Analiza el estado del producto FutTracker desde el PO: qué está listo para implementar, en qué orden por valor, qué está trabado y qué decisiones de producto siguen abiertas, cruzando los documentos de alcance con el proyecto de Linear. Usalo antes de refinar una épica o al arrancar la semana; solo lee Linear y no mira fechas ni EVM (eso es g15-project-health-monitor).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Qué debería entrar primero esta semana y qué lo impide?\n\n**Resultado:** Evalúa el DoR de cada ticket, propone el orden por valor según el criterio validado por el PO (o lo marca pendiente), clasifica las trabas por tipo y rol dueño, y lista decisiones abiertas, deriva de alcance e higiene de tickets. No modifica Linear.", "ruta": "agentes/g15-po-backlog-analyst"}, {"name": "g15-po-orchestrator", "description": "Router del rol PO de FutTracker: coordina el refinamiento de la próxima épica (backlog, factibilidad TL, criterios QA, tickets en modo propuesta) y la auditoría de gobernanza, sin crear ni editar nada en Linear antes de la aprobación humana. Usalo para el proceso P3 o P11; el análisis lo hacen los especialistas.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Refinemos la próxima épica.\n\n**Resultado:** Delega el valor y el orden en g15-po-backlog-analyst, pide factibilidad al router TL y criterios verificables al router QA, y pasa todo a g15-po-ticket-author en modo propuesta. Devuelve el consolidado con aprobaciones pendientes, sin tocar Linear.", "ruta": "agentes/g15-po-orchestrator"}, {"name": "g15-po-ticket-author", "description": "Escribe y refina tickets de FutTracker en Linear con la estructura acordada (contexto, alcance con fuera explícito, requisitos, criterios de aceptación verificables, pasos de verificación y dependencias), pregunta la estimación en Fibonacci y embute capturas del design system en los de frontend. Usalo al crear, partir o llevar a «listo» un ticket; por defecto trabaja en modo propuesta.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Felipe Germano", "github": "GermanoFelipe"}, "colaboradores": [{"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}], "area": ["gestion"], "fase": ["analisis", "planificacion"], "tecnologias": ["supabase", "nextjs"], "herramientas": ["claude-code"], "requiere": ["linear", "chrome", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Partí el ticket de búsqueda en dos y dejalos listos para implementar.\n\n**Resultado:** Propone las partes con matriz de trazabilidad de requisitos y criterios Dado/Cuando/Entonces, y te hace una sola pregunta por la estimación Fibonacci. Solo tras tu aprobación crea los tickets en Linear, sin asignar ni cambiar estado.", "ruta": "agentes/g15-po-ticket-author"}, {"name": "g15-pr-code-reviewer", "description": "Revisión técnica de un PR del repo de producto futtracker (correctness, RLS y migraciones, convenciones de auth, cobertura de tests) contrastando el diff con el ticket de Linear; es el primer pase automatizado de la revisión que el RACI asigna al TL. Usalo antes de mergear un PR concreto; si queda aprobado y sin más commits previstos, mueve el ticket a Ready for QA.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["backend", "qa"], "fase": ["revision"], "tecnologias": ["supabase"], "herramientas": ["claude-code"], "requiere": ["github", "linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Revisá técnicamente el PR 41 de futtracker.\n\n**Resultado:** Trae el ticket FUT-xxx y el diff, devuelve primero la tabla de cumplimiento de requisitos y criterios, después los hallazgos con archivo y línea (sin código de fix) y cierra con el estado del ticket: movido a Ready for QA, no movido o pendiente manual.", "ruta": "agentes/g15-pr-code-reviewer"}, {"name": "g15-pr-dod-gate", "description": "Gate de Definition of Done sobre un PR puntual de futtracker: CI en verde, story linkeada, migraciones con RLS, tests, docs y orden migración antes que deploy, con veredicto cumple, no cumple o bloqueado por ítem. Usalo antes de mergear; no revisa calidad de código (g15-pr-code-reviewer) ni hace la pasada exploratoria (g15-pr-uat-contrast).", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["qa"], "fase": ["revision"], "tecnologias": ["supabase"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Pasale el gate de DoD al PR 41.\n\n**Resultado:** Revisa el PR y sus checks de CI, devuelve una tabla por ítem del DoD con la evidencia de cada uno (check, línea del diff o archivo ausente) y un cierre: DoD incumplido, bloqueado o cumplido. No comenta ni aprueba en GitHub.", "ruta": "agentes/g15-pr-dod-gate"}, {"name": "g15-pr-uat-contrast", "description": "Contrasta el diff de un PR de futtracker con los escenarios de UAT ya escritos en qa/uat/ (cubierto, parcial o sin tocar) y hace una pasada exploratoria adversarial sobre la rama levantada en local. Usalo antes de mergear para saber si el PR cubre lo que pide el UAT de su story; no reemplaza la validación funcional postmerge.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, "colaboradores": [{"nombre": "Felipe Germano", "github": "GermanoFelipe"}], "area": ["qa"], "fase": ["revision", "testing"], "tecnologias": ["supabase", "nextjs"], "herramientas": ["claude-code"], "requiere": ["github", "chrome"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Contrastá el PR 41 contra el UAT de su story y probalo en local.\n\n**Resultado:** Busca el guion en qa/uat/, clasifica cada criterio contra el diff, levanta la rama con Supabase local y prueba inputs límite, navegación fuera de guion y doble acción. Devuelve la tabla de criterios, los cambios sin criterio asociado y los bloqueos.", "ruta": "agentes/g15-pr-uat-contrast"}, {"name": "g15-product-adr-drafter", "description": "Documenta una decisión técnica de producto de FutTracker ya tomada como ADR borrador transferible, conservando rationale, alternativas y consecuencias, pendiente de aprobación del TL. Usalo cuando el TL confirmó una decisión; el ADR de gestión es de g15-adr-writer.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Marcos Sasaki", "github": "sasakiimarcos"}, "colaboradores": [{"nombre": "Francisco Calveyra", "github": "FranCalveyra"}], "area": ["documentacion"], "fase": ["diseno"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Dejá asentada como ADR borrador la decisión de usar Supabase central para el reporte de KPIs.\n\n**Resultado:** Verifica que la decisión esté confirmada, escribe tl/producto/adr-borrador-<slug>.md con estado «Borrador — pendiente de aprobación TL» y lista lo que el TL debe confirmar. Si no hay decisión confirmada, devuelve bloqueado.", "ruta": "agentes/g15-product-adr-drafter"}, {"name": "g15-project-health-monitor", "description": "Cruza el Gantt y el camino crítico, el plan de alcance y Linear para dar un veredicto de salud de FutTracker en cronograma, alcance y costo, y proponer rebaselines con alternativas fechadas. Usalo para un chequeo de salud en cierre de sprint o ante un desvío; nunca regenera el cronograma ni aplica el rebaseline.", "tipo": "agente", "grupo": "15", "autor": {"nombre": "Francisco Calveyra", "github": "FranCalveyra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear", "engram"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hacé un health check d function vistaExplorar(m,sel){
  const q=e("input");q.type="search";q.placeholder="Buscar por nombre, descripción, tecnología o autor…";q.value=st.q;
  q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;render();const n=document.querySelector("input");n.focus();n.setSelectionRange(pos,pos)};m.append(q);
  for(const [campo,et] of [["area","Área"],["fase","Fase"],["herramientas","Herramienta"],["grupo","Grupo"]]){
    const r=e("div","row");r.append(e("b",null,et));chips(r,campo,[...new Set(P.flatMap(p=>[].concat(p[campo])))].sort(),campo==="grupo"?v=>"g"+v:null);m.append(r)}
  const l=P.filter(ok);if(!sel||!l.some(p=>p.name===sel))sel=l.length?l[0].name:null;
  const g=e("div","g"),list=e("div","list"),d=e("div","d");g.append(list,d);m.append(g);
  list.append(e("div","m s",l.length+" de "+P.length+" piezas"));
  l.forEach(p=>{const c=a("#pieza/"+encodeURIComponent(p.name),null,"c"+(p.name===sel?" on":""));c.dataset.k=1;
    c.append(e("div","n",p.name),e("div","m s",p.description));const t=e("div");
    p.area.forEach(v=>t.append(e("span","t",v)));p.herramientas.forEach(v=>t.append(e("span","t b",v)));c.append(t);list.append(c)});
  const p=P.find(x=>x.name===sel);
  if(!p){d.append(e("div","m",P.length?"Ninguna pieza coincide con los filtros.":"Todavía no hay piezas en el catálogo."));return}
  d.append(e("div","n",p.name),e("p",null,p.description));const dl=e("dl");
  const fila=(k,v)=>{dl.append(e("dt",null,k));const dd=e("dd");typeof v==="string"?dd.textContent=v||"—":dd.append(v);dl.append(dd)};
  fila("Tipo",p.tipo);fila("Grupo","g"+p.grupo);fila("Autor",linkPersona(p.autor));
  const col=e("span");p.colaboradores.forEach((c,i)=>{if(i)col.append(", ");col.append(linkPersona(c))});fila("Colaboradores",p.colaboradores.length?col:"—");
  fila("Área",p.area.join(", "));fila("Fase",p.fase.join(", "));fila("Tecnologías",p.tecnologias.join(", "));
  fila("Funciona en",p.herramientas.join(", "));fila("Requiere",p.requiere.join(", ")||"nada externo");fila("Madurez",p.madurez);fila("Carpeta",p.ruta);
  d.append(dl,e("h3",null,"Ejemplo de uso"),e("pre",null,p.ejemplo||"—"));
  if(p.relacionados.length){d.append(e("h3",null,"Relacionadas"));const u=e("ul","p");
    p.relacionados.forEach(n=>{const li=e("li");li.append(P.some(x=>x.name===n)?a("#pieza/"+encodeURIComponent(n),n):e("span",null,n));u.append(li)});d.append(u)}}

function vistaAvance(m,sel){
  const grupos=[...new Set(A.map(x=>x.grupo))].sort();const r=e("div","row");r.style.marginTop="16px";r.append(e("b",null,"Grupo"));
  grupos.forEach(gr=>{const b=e("button","chip"+(st.gAv.has(gr)?" on":""),"g"+gr);b.onclick=()=>{st.gAv.has(gr)?st.gAv.delete(gr):st.gAv.add(gr);render()};r.append(b)});m.append(r);
  const vis=A.filter(x=>!st.gAv.size||st.gAv.has(x.grupo));const n=x=>comoAutor(x.github).length;
  const s=e("div","stats");[[vis.filter(x=>n(x)>=META).length+" de "+vis.length,"alumnos con "+META+" o más"],
    [vis.reduce((t,x)=>t+n(x),0),"piezas como autor"],[vis.reduce((t,x)=>t+comoColab(x.github).length,0),"colaboraciones"]]
    .forEach(([v,k])=>{const c=e("div","st");c.append(e("div","v",String(v)),e("div","m s",k));s.append(c)});m.append(s);
  const g=e("div","g"),izq=e("div"),d=e("div","d");g.append(izq,d);m.append(g);
  const tw=e("div","tw"),tb=e("table");tb.innerHTML="<tr><th>Alumno</th><th>Grupo</th><th>Autor</th><th>Avance</th><th>Colab.</th><th>Estado</th></tr>";
  vis.slice().sort((x,y)=>x.grupo.localeCompare(y.grupo)||x.nombre.localeCompare(y.nombre)).forEach(x=>{
    const k=n(x),tr=e("tr",low(x.github)===low(sel)?"on":"");tr.dataset.k=low(x.github)===low(sel)?1:"";
    const td=e("td");td.append(a("#alumno/"+encodeURIComponent(x.github),x.nombre||x.github));tr.append(td,e("td",null,"g"+x.grupo),e("td","r",String(k)));
    const tb2=e("td"),bar=e("div","bar"),sp=e("span",k>=META?"full":"");sp.style.width=Math.min(100,k*100/META)+"%";bar.append(sp);tb2.append(bar);tr.append(tb2);
    tr.append(e("td","r",String(comoColab(x.github).length)));const te=e("td");te.append(e("span","pill"+(k>=META?" ok":""),k>=META?"Completo":"Faltan "+(META-k)));tr.append(te);tb.append(tr)});
  tw.append(tb);izq.append(tw);
  const x=sel&&alumno(sel);
  if(!x){d.append(e("div","m","Elegí un alumno para ver sus piezas."));return}
  d.append(e("h2",null,x.nombre||x.github),e("div","m s","@"+x.github+" · grupo "+x.grupo));
  for(const [tit,l] of [["Como autor ("+comoAutor(x.github).length+")",comoAutor(x.github)],["Como colaborador ("+comoColab(x.github).length+")",comoColab(x.github)]]){
    d.append(e("h3",null,tit));if(!l.length){d.append(e("div","m s","Ninguna todavía."));continue}
    const u=e("ul","p");l.forEach(p=>{const li=e("li");li.append(a("#pieza/"+encodeURIComponent(p.name),p.name));u.append(li)});d.append(u)}}

addEventListener("hashchange",render);render();
</script></body></html>
