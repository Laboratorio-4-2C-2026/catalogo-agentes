ander-Kottner"}, "colaboradores": [], "area": ["qa", "seguridad"], "fase": ["revision", "testing"], "tecnologias": ["nestjs", "firebase", "react", "prisma"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g08-security-reviewer"], "ejemplo": "**Pedido:** Hacé QA de seguridad del módulo de vehículos.\n\n**Resultado:** Hallazgos con archivo y línea, severidad, escenario de explotación y arreglo concreto, más lo que se revisó sin problemas y lo que no se pudo verificar.", "ruta": "skills/g04-qa-seguridad"}, {"name": "g04-qa-ui-ux", "description": "Revisa una pantalla corriendo contra el prototipo y el design system de PitStop: tokens, Text e Icon, mobile y desktop, estados vacíos y de error, foco y claridad para usuarios no técnicos. Usar al hacer QA visual o de experiencia de un PR o una pantalla.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["qa", "diseno"], "fase": ["testing", "revision"], "tecnologias": ["react", "tailwindcss"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Hacé QA de UI/UX de la pantalla de historial del PR 57.\n\n**Resultado:** Un reporte por hallazgo con captura, resolución, severidad, resultado esperado y obtenido, más los estados que no se pudieron probar.", "ruta": "skills/g04-qa-ui-ux"}, {"name": "g04-reorganizar-cronograma", "description": "Propone cómo reorganizar el cronograma de PitStop ante atrasos, bajas o cambios de alcance, sin superar la capacidad y conservando la fecha de entrega y el orden de prioridad. Usar cuando algo se atrasó, cambió el alcance o hay que replanificar las semanas que quedan.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Se atrasaron dos tickets de Perfil, reorganizá lo que queda del sprint.\n\n**Resultado:** Dos opciones con sus movimientos y efectos en carga por semana y alcance, una recomendación y, una vez elegida, features.yaml actualizado con las fechas nuevas.", "ruta": "skills/g04-reorganizar-cronograma"}, {"name": "g04-riesgos-presentacion", "description": "Prepara la lámina de riesgos e incidentes de PitStop a partir de risks.yaml: matriz de probabilidad e impacto, principales riesgos, planes e incidentes ocurridos. Usar al presentar o reportar el estado de los riesgos del proyecto.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Preparame los riesgos para la presentación.\n\n**Resultado:** La matriz de riesgos abiertos, los tres principales con responsable y plan, los incidentes ocurridos, los riesgos sin revisar y el mensaje de la lámina.", "ruta": "skills/g04-riesgos-presentacion"}, {"name": "g04-simulacion-de-usuarios", "description": "Simula usuarios sin conocimientos técnicos recorriendo PitStop en el navegador para encontrar fricción antes de probar con personas reales, a partir de perfiles y tareas concretas. Usar para validar un flujo nuevo o preparar pruebas con usuarios.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["qa", "diseno"], "fase": ["testing", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-usabilidad-sintetica", "g11-sportmatch-sim"], "ejemplo": "**Pedido:** Simulá a tres usuarios cargando su primer vehículo y un service.\n\n**Resultado:** Por perfil: tarea completada o no, en qué paso dudó y por qué, con capturas, más una lista de fricciones repetidas ordenadas por impacto.", "ruta": "skills/g04-simulacion-de-usuarios"}, {"name": "g04-start-stack", "description": "Levanta y verifica todo el stack de desarrollo local del repositorio, usando primero la receta guardada en STACK_STARTUP.md y descubriendo el stack solo si no existe o falla. Usar cuando se necesita el entorno local corriendo; se ejecuta a mano con /g04-start-stack y no se activa sola.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [{"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}], "area": ["devops"], "fase": ["desarrollo", "testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Levantá el stack.\n\n**Resultado:** Reutiliza los servicios sanos, inicia los que faltan, los verifica y responde en una línea con las URLs y qué se inició.", "ruta": "skills/g04-start-stack"}, {"name": "g04-stress-testing", "description": "Prueba de estrés de la API NestJS para encontrar a qué carga se degrada, cómo falla y si se recupera, en un entorno local o de prueba aislado. Usar cuando se pide conocer el límite del sistema; para validar la carga esperada, usar load testing.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["qa", "backend"], "fase": ["testing"], "tecnologias": ["nestjs", "k6"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Buscá hasta dónde aguanta el login y el listado de vehículos.\n\n**Resultado:** La carga donde empieza a degradarse y donde falla, el primer recurso agotado, el comportamiento durante el fallo y si se recupera solo, con script reproducible.", "ruta": "skills/g04-stress-testing"}, {"name": "g04-sync-linear", "description": "Sincroniza en las dos direcciones los tickets de Linear del team PIT con el backlog local de PitStop (features.yaml y team.yaml) y detecta desvíos. Usar al crear, reestimar, mover o cerrar un ticket, al editar una funcionalidad con ticket, o antes de planificar la semana.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": ["g11-sincronizar-linear"], "ejemplo": "**Pedido:** ¿El plan y Linear están al día?\n\n**Resultado:** Compara el backlog local con los tickets de Linear, lista los desvíos y actualiza lo que corresponde en cada lado.", "ruta": "skills/g04-sync-linear"}, {"name": "g04-sync-project-docs", "description": "Determina de forma barata si los cambios en stage requieren actualizar la documentación del proyecto y actualiza solo los documentos afectados. Pensada para invocarse desde una skill de commit, antes de commitear.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [{"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}], "area": ["documentacion"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["agnostico", "git"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Antes de commitear, fijate si hay que actualizar la documentación.\n\n**Resultado:** Corre el filtro sobre los cambios en stage y, si corresponde, actualiza solo los documentos afectados; si no, sigue sin tocar nada.", "ruta": "skills/g04-sync-project-docs"}, {"name": "g04-team-weekly-status", "description": "Reporte simple del avance del equipo y del estado del producto cruzando Linear con los PRs de GitHub: qué tickets se tocaron en la semana, quién trabajó en qué y qué funcionalidades ya están integradas en main. Usar cuando el PO o el Tech Lead pregunta en qué trabajó el equipo, cómo va el sprint o en qué estado está la app.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Martin Barreiro", "github": "martinbarreiroo"}], "area": ["gestion"], "fase": ["revision", "planificacion"], "tecnologias": ["agnostico", "git"], "herramientas": ["claude-code"], "requiere": ["linear", "github"], "madurez": "experimental", "relacionados": ["g11-weekly-status"], "ejemplo": "**Pedido:** ¿En qué trabajaron los chicos esta semana a nivel producto? Bien simple.\n\n**Resultado:** Una lista por integrante con los tickets que tocó, su estado y su PR, un resumen de lo que ya quedó integrado en main y los tickets cuyo estado en Linear no coincide con GitHub.", "ruta": "skills/g04-team-weekly-status"}, {"name": "g04-ticket-asignacion", "description": "Reparte los tickets de una semana de PitStop entre los devs por carga, dependencias y continuidad, evitando que un ticket bloquee a otro. Usar cuando se pide asignar tickets o repartir el trabajo de la semana.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Repartí los tickets de la semana entre los tres devs.\n\n**Resultado:** Una tabla por dev con sus tickets y puntos, hasta 6 SP cada uno, indicando qué tickets encadenados deben coordinar entre ellos.", "ruta": "skills/g04-ticket-asignacion"}, {"name": "g04-ticket-contexto", "description": "Escribe la sección Contexto de un ticket de Linear de PitStop: dos párrafos sin jerga que dicen qué se va a construir y qué problema resuelve, para un dev junior que recién abre el ticket. Usar al redactar o mejorar el contexto de un ticket.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Escribí el contexto del ticket de alta de vehículo.\n\n**Resultado:** Dos párrafos cortos, de hasta seis frases, que explican qué podrá hacer el usuario y qué falta hoy, sin rutas, comandos ni términos técnicos sin aclarar.", "ruta": "skills/g04-ticket-contexto"}, {"name": "g04-ticket-especificacion-tecnica", "description": "Escribe la especificación técnica de un ticket de Linear de PitStop: Datos del ticket, Alcance, Backend, Frontend, Componentes, Criterios de aceptación técnicos y Fuera de alcance, con valores exactos para hacer el trabajo con Claude Code. Usar al redactar o completar la parte técnica de un ticket.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion", "backend", "frontend"], "fase": ["analisis", "diseno"], "tecnologias": ["nestjs", "prisma", "react", "tailwindcss"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Escribí la especificación técnica del ticket de editar kilometraje.\n\n**Resultado:** El bloque técnico completo con modelo de Prisma, endpoints, tests de Jest, ruta, componentes con tokens del design system, criterios exactos para mobile y desktop y lo que queda fuera de alcance.", "ruta": "skills/g04-ticket-especificacion-tecnica"}, {"name": "g04-ticket-estimacion", "description": "Estima tickets de PitStop en la escala de 1 a 5 SP, pensando en un estudiante de 3er año que usa Claude Code, y parte en verticales los que no entran. Usar cuando se pide estimar, reestimar o revisar los puntos de un ticket.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": ["g11-estimar-ticket"], "ejemplo": "**Pedido:** ¿Cuántos puntos le ponemos al ticket de subir la foto del vehículo?\n\n**Resultado:** Propone 4 SP porque es una vertical con Firebase Storage para aprender primero, explica el motivo y avisa si conviene partirla.", "ruta": "skills/g04-ticket-estimacion"}, {"name": "g04-ticket-objetivo", "description": "Escribe el bloque de un ticket de Linear de PitStop que lee el dev antes de la parte técnica: Objetivo, Referencia visual, Qué tiene que quedar andando, Por dónde empezar y Palabras que vas a ver. Usar al redactar o mejorar esas secciones.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion", "qa"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Armá el objetivo y lo que tiene que quedar andando del ticket de historial.\n\n**Resultado:** Una frase de objetivo, la pantalla de referencia, de 3 a 6 criterios verificables usando la app, los pasos en orden y el glosario de los términos nuevos.", "ruta": "skills/g04-ticket-objetivo"}, {"name": "g04-ticket-orquestador", "description": "Crea los tickets de Linear de una semana de PitStop orquestando las skills de planeamiento, estimación, asignación, urgencia, contexto, objetivo y especificación técnica, con plan aprobado antes de crear y verificación al final. Usar cuando se pide armar o cargar los tickets de la semana o de una épica.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Armá los tickets de la semana que viene.\n\n**Resultado:** Muestra el plan con títulos, puntos por dev, total y fecha límite; al confirmarlo crea los tickets en Backlog con su project y prioridad, verifica los campos en Linear y actualiza features.yaml.", "ruta": "skills/g04-ticket-orquestador"}, {"name": "g04-ticket-urgencia", "description": "Define la prioridad de los tickets de Linear de una semana de PitStop a partir del grafo de bloqueos, para que el tablero ordenado diga qué hacer primero. Usar cuando se pide priorizar u ordenar los tickets de la semana.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Poneles prioridad a los tickets de esta semana.\n\n**Resultado:** Asigna Urgent al bloqueante raíz, High a los que bloquean a otro, Medium a los independientes y Low a los bloqueados, y muestra el orden resultante.", "ruta": "skills/g04-ticket-urgencia"}, {"name": "g05-watchparty-api-documentation", "description": "Crea y actualiza la documentación de endpoints Express de WatchParty a partir de las rutas, validadores, casos de uso y tests del repositorio. Usar cuando se agrega o cambia un contrato de API.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["documentacion", "backend"], "fase": ["desarrollo", "revision"], "tecnologias": ["express", "typescript"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Documentá el listado paginado de opiniones usando su ruta y tests actuales.\n\n**Resultado:** Contrato completo con parámetros, cursor opaco, respuestas y ejemplos ficticios trazados al código.\n\n**Otro uso:** Tras cambiar una regla de validación, generá el delta de documentación y los errores afectados sin reescribir los endpoints ajenos al cambio.", "ruta": "skills/g05-watchparty-api-documentation"}, {"name": "g05-watchparty-backend-conventions", "description": "Implementa y revisa módulos y endpoints Express de WatchParty siguiendo sus capas, contratos, errores e inyección de dependencias. Usar al crear o modificar el backend del repositorio.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo", "revision"], "tecnologias": ["express", "typescript", "supabase"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g03-express-project-structure-guidelines"], "ejemplo": "**Pedido:** Agregá un endpoint de consulta de una entidad propia siguiendo el backend actual.\n\n**Resultado:** Plan o implementación según autorización, reutilizando identidad, errores y store, con el cambio de composición mínimo.\n\n**Otro uso:** Revisar un endpoint que consulta Supabase desde un handler extenso. Identificá responsabilidades mezcladas y propuesta compatible con el módulo existente, sin refactorizar por iniciativa propia.", "ruta": "skills/g05-watchparty-backend-conventions"}, {"name": "g05-watchparty-bug-diagnosis", "description": "Diagnostica fallas de WatchParty desde el código, los tests y las evidencias del entorno. Usar ante errores nuevos o intermitentes; cuando la tarea incluye resolverlos, guía la corrección y su prueba de regresión.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["qa", "frontend", "backend"], "fase": ["analisis", "testing"], "tecnologias": ["react", "express", "typescript", "supabase"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g15-bug-investigator", "g05-watchparty-web-api-integration"], "ejemplo": "**Pedido:** Una pantalla muestra error al consultar una ruta protegida; investigá sin cambiar nada.\n\n**Resultado:** Separación de estado de sesión, respuesta HTTP y error de infraestructura, con hipótesis y una comprobación discriminante.\n\n**Otro uso:** Un test pasa aislado pero falla en suite. Compará orden, reloj y estado compartido; no lo desactives ni lo repitas hasta obtener verde.", "ruta": "skills/g05-watchparty-bug-diagnosis"}, {"name": "g05-watchparty-pr-preparation", "description": "Prepara los cambios del checkout de WatchParty para revisión: alcance del diff, validaciones locales, título, descripción y evidencia de la PR. Usar antes de entregar cambios o actualizar una solicitud de revisión.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["devops", "qa", "documentacion"], "fase": ["revision"], "tecnologias": ["git", "typescript"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g09-pre-pr-gate"], "ejemplo": "**Pedido:** Prepará la descripción y el checklist de mi cambio de frontend antes de pedir review.\n\n**Resultado:** Borrador basado en el diff, checks aplicables y estado real de evidencia, sin publicar ni tocar commits.\n\n**Otro uso:** Un cambio SQL y API necesita revisión. Documentá el orden y compatibilidad a verificar y enlazá el análisis de migración disponible sin aplicarla.", "ruta": "skills/g05-watchparty-pr-preparation"}, {"name": "g05-watchparty-regression-selection", "description": "Selecciona y ejecuta los tests existentes de WatchParty pertinentes al impacto de un cambio. Usar al validar una tarea o planificar regresión; distingue cobertura existente y brechas que requieren pruebas nuevas.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["qa", "backend", "frontend"], "fase": ["planificacion", "testing"], "tecnologias": ["typescript", "vitest"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g15-regression-matrix-keeper"], "ejemplo": "**Pedido:** Cambió el middleware de autenticación; elegí la regresión existente que conviene correr.\n\n**Resultado:** Selección sustentada de pruebas de rutas protegidas y sesión dependiente, con comandos y límites, sin escribir tests nuevos.\n\n**Otro uso:** Un componente compartido de formulario cambió. Localizá sus pruebas y consumidores relevantes; separá interacciones automatizadas de responsive visual pendiente.", "ruta": "skills/g05-watchparty-regression-selection"}, {"name": "g05-watchparty-supabase-migration-review", "description": "Revisa migraciones SQL y políticas de acceso de WatchParty buscando incompatibilidad con datos existentes, pérdida de datos y cambios de privilegios. Usar antes de aplicar cambios de schema; entrega hallazgos y un plan de verificación, sin ejecutar migraciones.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["datos", "backend", "seguridad", "qa"], "fase": ["revision"], "tecnologias": ["supabase", "postgresql"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-revisar-migracion"], "ejemplo": "**Pedido:** Revisá una migración que agrega UNIQUE a una relación usuario/recurso.\n\n**Resultado:** Evaluación de duplicados posibles, efecto sobre la API y comprobaciones de lectura propuestas, sin borrar datos ni aplicar el constraint.\n\n**Otro uso:** Una vista expone datos propios a una nueva consulta. Revisá columnas, consumidores y contexto de privilegios/RLS antes de considerarla segura.", "ruta": "skills/g05-watchparty-supabase-migration-review"}, {"name": "g05-watchparty-test-creation", "description": "Crea y mantiene tests unitarios, HTTP y React de WatchParty con Vitest, Supertest y Testing Library. Usar al implementar funcionalidades, corregir defectos o reforzar cobertura siguiendo la estructura del repositorio.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["qa", "backend", "frontend"], "fase": ["desarrollo", "testing"], "tecnologias": ["typescript", "vitest", "supertest", "react"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g03-javascript-typescript-vitest", "g03-supertest-api-testing", "g03-express-test-builder-agent"], "ejemplo": "**Pedido:** Implementá tests del caso de uso que guarda una reseña con un store en memoria.\n\n**Resultado:** Archivo junto al patrón del módulo, casos deterministas para los escenarios acordados y validación autorizada, sin acceder a Supabase real.\n\n**Otro uso:** Probar un formulario React. Usá JSDOM, Testing Library y user-event para sus estados e interacción; los breakpoints visuales necesitan navegador y quedan separados.", "ruta": "skills/g05-watchparty-test-creation"}, {"name": "g05-watchparty-ui", "description": "Aplica y preserva el sistema de diseño de WatchParty al crear, modificar, refactorizar o revisar interfaces React y TypeScript con Vite. Usar en pantallas, componentes, navegación, responsive, accesibilidad y temas del frontend.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["frontend", "diseno", "qa"], "fase": ["desarrollo", "revision"], "tecnologias": ["react", "typescript", "vite", "tailwindcss"], "herramientas": ["codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g11-revisar-diseno", "g05-watchparty-web-api-integration"], "ejemplo": "**Pedido:** Implementá un formulario en WatchParty respetando el sistema de diseño y los componentes existentes.\n\n**Resultado:** Formulario React que reutiliza primitives y tokens del proyecto, contempla estados y accesibilidad y se verifica con las validaciones pertinentes, manteniendo el alcance de la tarea.", "ruta": "skills/g05-watchparty-ui"}, {"name": "g05-watchparty-web-api-integration", "description": "Integra o revisa pantallas React de WatchParty con su API Node: cliente tipado, sesión, carga, errores y ciclo de vida asíncrono. Usar al conectar datos; la apariencia, los tokens y los componentes visuales corresponden a watchparty-ui.", "tipo": "skill", "grupo": "05", "autor": {"nombre": "Pedro de Foronda", "github": "Pedrodeforonda"}, "colaboradores": [], "area": ["frontend", "backend"], "fase": ["desarrollo", "revision"], "tecnologias": ["react", "typescript", "supabase"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-revisar-react-query", "g05-watchparty-ui", "g05-watchparty-bug-diagnosis"], "ejemplo": "**Pedido:** Conectá una pantalla de historial al endpoint existente con filtros y estado vacío.\n\n**Resultado:** Consumo tipado, estados y control de solicitudes del contexto anterior, sin cambiar el diseño ni consultar la base desde React.\n\n**Otro uso:** Revisar un formulario que muestra éxito antes de recibir confirmación. Documentá la secuencia, el estado correcto y la comprobación mínima pendiente.", "ruta": "skills/g05-watchparty-web-api-integration"}, {"name": "g07-code-review-tl", "description": "Code review riguroso de un PR fullstack como Tech Lead: valida el ticket de Jira, levanta el stack, corre build y tests, prueba la API y el flujo en Chrome (E2E) y devuelve comentarios accionables por severidad con archivo:línea. Usar cuando el TL tenga que revisar un PR antes de mergearlo.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["backend", "frontend", "qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github", "chrome"], "madurez": "usado-en-proyecto", "relacionados": ["g07-qa-acceptance", "g07-pr-jira-sync"], "ejemplo": "**Pedido:** Usá la skill g07-code-review-tl para revisar el PR #92 del ticket KEY-107 y probá la UI en http://localhost:5173.\n\n**Resultado:** Trae el ticket de Jira, revisa el diff, corre build, lint y tests, levanta el stack, prueba la API y el flujo en Chrome, y devuelve en el chat un reporte con veredicto, cumplimiento de criterios, resultados de ejecución y de UI, y comentarios por severidad con archivo:línea. No comenta en GitHub.", "ruta": "skills/g07-code-review-tl"}, {"name": "g07-delivery-digest", "description": "Publica en Discord los avisos de un equipo que entrega por ciclos usando el Due date de Jira (MCP), en dos modos: el día de entrega (qué vence hoy y qué quedó asignado para la próxima) y a mitad de ciclo (cómo vienen las tareas de la próxima entrega, con su riesgo). Usar desde una rutina programada o cuando el PM quiera ver o probar los avisos fuera de horario.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-ready-check"], "ejemplo": "**Pedido:** Corré el g07-delivery-digest en modo mitad de ciclo.\n\n**Resultado:** Calcula la próxima fecha de entrega, trae de Jira las tareas que vencen ese día (paginando hasta el final), las lista por developer con su marca de estado (✅/🔧/⚠️/🚫), resume en una línea cuántas están en riesgo y de quién, y publica el mensaje en Discord.", "ruta": "skills/g07-delivery-digest"}, {"name": "g07-pr-jira-sync", "description": "Cruza los PRs de GitHub con el estado de los tickets en Jira (MCP) y detecta inconsistencias de trazabilidad (tickets In Review sin PR, PRs mergeados con el ticket abierto, tickets Done con el PR abierto, PRs sin key, viejos o sin reviewer), con una acción concreta por hallazgo. Usar cuando el TL o el PM quiera verificar que el board refleja el código antes de una reunión, un cierre de semana o una entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["jira", "github"], "madurez": "usado-en-proyecto", "relacionados": ["g07-code-review-tl", "g07-release-notes", "g07-role-handoff"], "ejemplo": "**Pedido:** Cruzá los PRs con Jira antes de la reunión del jueves.\n\n**Resultado:** Corre pr_snapshot.py para sacar el estado de los PRs, consulta los tickets activos y cerrados en Jira, aplica las reglas R1 a R9 y devuelve un reporte por severidad con una acción concreta y con dueño por cada inconsistencia. No mueve tickets ni comenta en GitHub.", "ruta": "skills/g07-pr-jira-sync"}, {"name": "g07-ready-check", "description": "Audita los tickets de Jira (MCP) que el equipo está por empezar contra una Definition of Ready configurable (user story, criterios de aceptación verificables, dueño, fecha, épica, contrato de API y dependencias resueltas a tiempo) y devuelve por ticket qué falta y la corrección propuesta, más las cadenas de bloqueo que ponen en riesgo una entrega. Usar antes del planning o cuando el PO o QA quiera saber si lo comprometido está listo para arrancar.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "qa"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g07-qa-acceptance", "g07-delivery-digest", "g07-role-handoff"], "ejemplo": "**Pedido:** Antes del planning, revisá si los tickets de la próxima entrega están listos para arrancar.\n\n**Resultado:** Trae de Jira los tickets To Do de las dos próximas entregas y sus bloqueantes, los evalúa contra la Definition of Ready de config.md, marca cada uno 🟢/🟡/🔴 con lo que falta y la corrección propuesta (por ejemplo, criterios vagos reescritos en Gherkin), y muestra las cadenas de bloqueo y dependencias no linkeadas que ponen en riesgo una entrega. Solo comenta en Jira si le confirmás.", "ruta": "skills/g07-ready-check"}, {"name": "g07-release-notes", "description": "Genera las release notes de una entrega a partir de los tickets Done en Jira (MCP) y los PRs mergeados en GitHub, agrupadas por épica, en lenguaje de usuario y con lo que quedó pendiente al final. Usar cuando el PO quiera comunicar qué hay de nuevo en el producto a usuarios, stakeholders o la cátedra después de una entrega o un sprint.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["despliegue"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-pr-jira-sync", "g07-delivery-digest"], "ejemplo": "**Pedido:** Armame las release notes de la entrega del 29/10.\n\n**Resultado:** Busca los tickets Done con esa due date, los confirma contra los PRs mergeados, y escribe las notas en lenguaje de usuario agrupadas por épica, con lo más destacado, 'Bajo el capó', lo que quedó pendiente y una verificación interna; las manda a Discord solo si confirmás.", "ruta": "skills/g07-release-notes"}, {"name": "g07-role-handoff", "description": "Arma el documento de traspaso de un rol del equipo (PM, TL, QA o PO) para quien lo asume, con el estado real de Jira (MCP) y GitHub, los bloqueos vivos, las rutinas del rol y los acuerdos, personas y accesos que solo conoce quien se va. Usar cuando los roles roten y alguien tenga que tomar la posta sin perder contexto.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github"], "madurez": "experimental", "relacionados": ["g07-pr-jira-sync", "g07-sprint-status-report", "g07-ready-check"], "ejemplo": "**Pedido:** Armá el handoff de TL: me voy yo (Marco) y lo asume Denise desde hoy.\n\n**Resultado:** Trae de Jira las dos próximas entregas y los bloqueos vivos, cruza los tickets con los PRs abiertos y te pregunta los acuerdos, las personas y los accesos que no están escritos. Devuelve un documento dirigido a Denise con lo primero que tiene que hacer, las entregas con su riesgo, los PRs que necesitan acción, lo propio del rol y lo que no se pudo verificar. No mueve tickets ni comenta en GitHub.", "ruta": "skills/g07-role-handoff"}, {"name": "g07-sprint-retro", "description": "Genera la retro de un sprint cerrado desde Jira (MCP), con lo completado vs. lo planificado, las issues arrastradas, las señales de bloqueo y acciones para el próximo sprint, y la envía al canal de Discord del equipo. Usar cuando el PM cierre un sprint y necesite armar la retro o un resumen para la cátedra.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-weekly-process-checklist"], "ejemplo": "**Pedido:** Hacé la retro del Sprint 2.\n\n**Resultado:** Verifica en Jira que el sprint esté cerrado, separa lo completado de lo no completado (nunca empezado vs. a mitad), detecta issues arrastradas y señales de bloqueo, y arma una agenda de retro con acciones atadas a issues concretas; lo muestra en el chat y lo envía a Discord.", "ruta": "skills/g07-sprint-retro"}, {"name": "g07-sprint-status-report", "description": "Genera el reporte de estado del sprint en curso a partir de Jira en vivo (MCP) y las novedades del equipo que pegue el PM (standups, bloqueos de Discord), detectando bloqueos, tareas estancadas o sin asignar y desbalance de carga, y lo envía al canal de Discord del equipo. Usar cuando el PM necesite un panorama del avance antes de una reunión, un standup o una entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-retro", "g07-delivery-digest", "g07-weekly-process-checklist"], "ejemplo": "**Pedido:** Armame el reporte de estado del sprint. Novedades del standup: Marco está bloqueado esperando el endpoint de login.\n\n**Resultado:** Trae el sprint activo de Jira, arma el reporte en cinco secciones (resumen con semáforo, estado por developer, bloqueos, tareas sin asignar o estancadas y recomendaciones atadas a issues concretas), lo muestra en el chat y lo envía al canal de Discord si hay webhook configurado.", "ruta": "skills/g07-sprint-status-report"}, {"name": "g07-weekly-process-checklist", "description": "Mantiene un único Google Doc que responde semana a semana las preguntas de proceso que pide la cátedra (organización del trabajo, avance visible, decisiones, riesgos y seguimiento semanal), usando Jira en vivo (MCP) para lo verificable y pidiéndole al PM las decisiones de la semana. Usar cuando el PM tenga que preparar o actualizar la evidencia de proceso para la clase o la entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "google-drive"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-sprint-retro"], "ejemplo": "**Pedido:** Actualizá el documento de proceso de esta semana. Decisión: usamos JWT en vez de sesiones; participaron Franco y Valentina.\n\n**Resultado:** Lee el Google Doc existente, trae de Jira el sprint activo y los riesgos vivos, agrega al final una entrada 'Semana del DD/MM' con Organización, Avance, Decisiones y Riesgos, te la muestra y reescribe el documento completo sin tocar las semanas anteriores.", "ruta": "skills/g07-weekly-process-checklist"}, {"name": "g08-align-problem-with-agent", "description": "Analiza una tarea o requerimiento complejo, busca el agente especializado más idóneo en el catálogo y genera un prompt optimizado para su ejecución. Usar antes de despachar tareas a subagentes.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["ia", "gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Tengo que auditar la seguridad de las reglas de Firestore, ¿qué agente uso y con qué prompt?\n\n**Resultado:** Recomendación de g08-firestore-rules-data-architect con un prompt listo para ejecutar indicando alcance y restricciones.", "ruta": "skills/g08-align-problem-with-agent"}, {"name": "g08-backend-test-setup", "description": "Configura, valida y prepara la infraestructura de testing del backend con Jest, TypeScript y Firebase Emulator Suite. Usar para inicializar o reparar el entorno de pruebas del backend.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["typescript", "jest", "firebase"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-backend-test-engineer", "g08-backend-tester"], "ejemplo": "**Pedido:** Configurá el entorno de testing unitario y emuladores para Cloud Functions con Jest.\n\n**Resultado:** La configuración de jest.config.cjs, tsconfig.test.json, setup.ts para Firebase Emulator y un test mínimo de sanidad ejecutándose exitosamente.", "ruta": "skills/g08-backend-test-setup"}, {"name": "g08-backend-tester", "description": "Diseña, crea y ejecuta tests unitarios y de integración para la lógica de negocio del backend con Jest y Firebase Emulators. Usar al escribir nuevas Cloud Functions o endpoints para asegurar cobertura.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["typescript", "jest", "firebase"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-backend-test-engineer", "g08-backend-test-setup"], "ejemplo": "**Pedido:** Creá los tests unitarios para el servicio de cálculo de promedios de exámenes.\n\n**Resultado:** Suite completa en Jest con mocks aislados de repositorios Firestore y casos de prueba para entradas válidas y condiciones de borde.", "ruta": "skills/g08-backend-tester"}, {"name": "g08-classify-vulnerability", "description": "Clasifica vulnerabilidades de seguridad en código fuente mediante tablas de decisión objetivas y mapeo a identificadores MITRE CWE. Usar al auditar código para calificar severidad y dificultad de remediación.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["seguridad", "qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-security-reviewer"], "ejemplo": "**Pedido:** Clasificá un endpoint que no verifica si el usuario es dueño del examen antes de borrarlo.\n\n**Resultado:** Clasificación como Severidad Alta (CWE-862: Missing Authorization) con tabla de impacto y dificultad de remediación baja.", "ruta": "skills/g08-classify-vulnerability"}, {"name": "g08-commit", "description": "Ejecuta compuertas de calidad (lint, typecheck, tests) y verifica que no haya secretos expuestos antes de construir un commit semántico. Usar antes de commitear cambios en cualquier repositorio.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["devops", "qa"], "fase": ["desarrollo"], "tecnologias": ["git"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Prepará el commit con los cambios del servicio de materias asegurando que pase los tests.\n\n**Resultado:** Validación de lint y pruebas ejecutadas exitosamente, y generación del commit con mensaje semántico estructurado.", "ruta": "skills/g08-commit"}, {"name": "g08-define-color-palette", "description": "Define e implementa paletas de color funcionales y accesibles bajo el estándar WCAG AA con distribución 60-30-10 y tokens inmutables en TypeScript. Usar al crear o ajustar temas de diseño en el frontend.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["diseno", "frontend"], "fase": ["diseno", "desarrollo"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Definí una paleta accesible para estados de corrección (aprobado, desaprobado, pendiente).\n\n**Resultado:** Tokens de color en TypeScript con verificación de contraste WCAG AA sobre fondos claros y oscuros.", "ruta": "skills/g08-define-color-palette"}, {"name": "g08-plan-with-user-input", "description": "Estructura un proceso interactivo de consultas para alinear alcance, restricciones y preferencias con el usuario antes de redactar un plan de ejecución. Usar al abordar requerimientos ambiguos.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Ayudame a planificar la funcionalidad de exportación de notas a PDF.\n\n**Resultado:** Batería de preguntas sobre formato, datos a incluir y permisos de rol, seguida del plan de desarrollo consensuado.", "ruta": "skills/g08-plan-with-user-input"}, {"name": "g08-pr-feedback-generator", "description": "Genera feedback estructurado y pedagógico en Markdown para revisiones de Pull Requests en GitHub. Usar al revisar PRs para explicar problemas detectados y sugerir soluciones sin dar código directo.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["qa", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Generá el feedback para el PR #42 señalando que faltan validaciones en el controlador.\n\n**Resultado:** Un comentario formateado para GitHub en Markdown con resumen de hallazgos, explicación pedagógica del riesgo y pistas claras para resolverlo.", "ruta": "skills/g08-pr-feedback-generator"}, {"name": "g08-qa-ticket-reviewer", "description": "Revisa tickets de desarrollo y sus PRs asociados desde la perspectiva de QA Lead, evaluando cumplimiento de requerimientos, criterios de aceptación y calidad. Usar antes de aprobar el paso a testing.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["qa", "gestion"], "fase": ["revision", "testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g08-ticket-creator", "g08-ticket-creator-backend", "g08-ticket-creator-frontend"], "ejemplo": "**Pedido:** Revisá si el PR #15 cumple con todos los criterios de aceptación del ticket backend_054.\n\n**Resultado:** Informe de revisión que compara cada criterio del ticket con el código implementado, destacando casos borde no cubiertos y dando el veredicto de aprobación.", "ruta": "skills/g08-qa-ticket-reviewer"}, {"name": "g08-scaffold-component", "description": "Porta o construye componentes de UI en la app frontend a partir del Design System y Storybook, integrando paso pedagógico explicativo. Usar al incorporar elementos visuales a las vistas.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["frontend", "diseno"], "fase": ["desarrollo"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-ticket-creator-frontend"], "ejemplo": "**Pedido:** Portá el componente ButtonGroup desde el design system a la aplicación frontend.\n\n**Resultado:** Componente creado con TypeScript estricto, variantes tipadas y explicación pedagógica de su integración.", "ruta": "skills/g08-scaffold-component"}, {"name": "g08-scaffold-page", "description": "Crea rutas y vistas de página en el frontend React siguiendo las convenciones de enrutador, layout y protección por roles. Usar al crear nuevas pantallas de la aplicación.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["frontend"], "fase": ["desarrollo"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Creá la estructura de la página /exams/:id/grading con protección para rol profesor.\n\n**Resultado:** Ruta configurada con su componente de vista, guarda de autenticación y layout base listo para poblar.", "ruta": "skills/g08-scaffold-page"}, {"name": "g08-scaffold-resource", "description": "Crea recursos REST completos en el backend con ruta, controlador, servicio y repositorio Firestore, con explicación de cada capa. Usar al exponer una nueva entidad en la API.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["typescript", "express", "firestore"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Scaffoldeá el recurso REST para gestión de comentarios de retroalimentación.\n\n**Resultado:** Estructura completa de 4 capas creada con inyección de dependencias y contratos tipados.", "ruta": "skills/g08-scaffold-resource"}, {"name": "g08-teach", "description": "Guía explicaciones pedagógicas estructuradas sobre conceptos de desarrollo web, backend, frontend y arquitectura para desarrolladores junior. Usar cuando se solicita comprender el porqué de una solución.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["documentacion", "ia"], "fase": ["analisis", "desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Explicame paso a paso cómo funciona la cola asíncrona de Cloud Tasks para procesar correcciones.\n\n**Resultado:** Explicación conceptual con analogías, diagrama de flujo del ciclo de vida y puntos clave de manejo de idempotencia.", "ruta": "skills/g08-teach"}, {"name": "g09-check-front-back-contract", "description": "Comparar los contratos entre el frontend React/TypeScript y el backend Kotlin/Spring Boot de Zervi, incluso en distintas branches, e identificar incompatibilidades concretas de la API. Usar para verificar la integración entre ambas capas.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend"], "fase": ["revision", "integracion"], "tecnologias": ["typescript", "react", "kotlin", "spring-boot", "postgresql", "auth0"], "herramientas": ["codex"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g09-debug-local-integration", "g09-ticket-test-matrix", "g09-review-ticket-pr"], "ejemplo": "**Pedido**\n\n> Compará el alta de turnos entre las ramas del frontend y del backend. ¿Qué pasa si el cliente omite la fecha?\n\n**Salida esperada**\n\nUna tabla por operación con método, ruta, campos obligatorios y respuesta. Cada incompatibilidad incluye las ubicaciones del cliente y del controlador.", "ruta": "skills/g09-check-front-back-contract"}, {"name": "g09-debug-local-integration", "description": "Diagnosticar fallas de integración local entre el frontend React y el backend Spring Boot de Zervi, incluyendo red, CORS, autenticación Auth0 y errores HTTP. Usar para identificar la causa con evidencia; implementar correcciones solo cuando se solicite.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend"], "fase": ["desarrollo", "integracion"], "tecnologias": ["typescript", "react", "kotlin", "spring-boot", "postgresql", "auth0", "docker"], "herramientas": ["codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g09-check-front-back-contract", "g09-fix-review-findings", "g09-review-ticket-pr", "g09-ticket-test-matrix"], "ejemplo": "**Pedido**\n\n> Desde React recibo un 401 al listar turnos en local. Seguí el request desde el navegador hasta Spring Boot.\n\n**Salida esperada**\n\nUn diagnóstico que identifica dónde se rechaza el request, la evidencia disponible y una prueba para confirmar la causa.", "ruta": "skills/g09-debug-local-integration"}, {"name": "g09-fix-review-findings", "description": "Validar observaciones de revisión de PRs de Zervi contra el código vigente, aplicar las correcciones justificadas y preparar respuestas para GitHub. Usar al resolver comentarios de revisión del backend o frontend.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend"], "fase": ["desarrollo", "revision"], "tecnologias": ["typescript", "react", "kotlin", "spring-boot", "postgresql"], "herramientas": ["codex"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g09-ticket-test-matrix", "g09-pre-pr-gate", "g09-review-ticket-pr"], "ejemplo": "**Pedido**\n\n> Revisá el comentario de la PR que pide validar fechas pasadas. Si sigue vigente, corregilo y prepará la respuesta.\n\n**Salida esperada**\n\nEl estado del hallazgo, el cambio aplicado si corresponde, la prueba de verificación y un borrador de respuesta para GitHub.", "ruta": "skills/g09-fix-review-findings"}, {"name": "g09-generar-coleccion-postman", "description": "Generar una colección Postman ejecutable para un ticket de Zervi con requests, aserciones y fixtures locales. Usar al entregar o verificar un endpoint.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["desarrollo", "revision"], "tecnologias": ["postman", "kotlin", "spring-boot", "postgresql"], "herramientas": ["codex"], "requiere": [], "madurez": "prototipo", "relacionados": ["ticket-test-matrix", "check-front-back-contract"], "ejemplo": "**Pedido**\n\n> Generá una colección para probar el alta de turnos en local, con un caso válido y otro sin fecha.\n\n**Salida esperada**\n\nUna colección importable en Postman con variables de entorno, cuerpos de ejemplo y aserciones sobre los códigos y campos definidos por el endpoint.", "ruta": "skills/g09-generar-coleccion-postman"}, {"name": "g09-pre-pr-gate", "description": "Verificar que una branch de Zervi esté lista para abrir o actualizar una PR, revisando alcance, contratos, migraciones, seguridad y checks aplicables a backend y frontend. Usar antes de enviar cambios a revisión.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend", "qa"], "fase": ["revision"], "tecnologias": ["typescript", "react", "kotlin", "spring-boot", "postgresql", "flyway"], "herramientas": ["codex"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g09-check-front-back-contract", "g09-ticket-test-matrix", "g09-fix-review-findings", "g09-review-ticket-pr"], "ejemplo": "**Pedido**\n\n> Revisá mi rama antes de abrir la PR. Cambié un DTO de turnos y agregué una migración Flyway.\n\n**Salida esperada**\n\nUn veredicto de preparación con el impacto en consumidores, los controles ejecutados y los pendientes que impiden abrir la PR.", "ruta": "skills/g09-pre-pr-gate"}, {"name": "g09-preparar-demo-sprint", "description": "Preparar un guion de demo del sprint de Zervi a partir de tickets de Jira y PRs de GitHub, con datos, roles, recorridos y resultados esperados. Usar antes de la revisión del sprint para ensayar la demostración.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["gestion", "qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira", "github"], "madurez": "prototipo", "relacionados": ["g09-reporte-de-estado", "ticket-test-matrix"], "ejemplo": "**Pedido**\n\n> Prepará una demo de cinco minutos del sprint actual con los tickets de turnos que tengan implementación demostrable.\n\n**Salida esperada**\n\nUn guion ordenado por tiempo, con rol, datos iniciales, pasos, resultado visible y enlaces al ticket y a la PR.", "ruta": "skills/g09-preparar-demo-sprint"}, {"name": "g09-reporte-de-estado", "description": "Preparar el reporte de estado de Zervi para Equipo09 cruzando los tickets del sprint en Jira mediante el MCP de Atlassian con sus pull requests de GitHub. Usar para informar avances, revisiones pendientes y bloqueos con evidencia.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira", "github"], "madurez": "prototipo", "relacionados": ["review-ticket-pr", "pre-pr-gate"], "ejemplo": "**Pedido**\n\n> Armá el reporte de Equipo09 para el sprint activo. Identificá los tickets en revisión y los que figuran terminados con una PR abierta.\n\n**Salida esperada**\n\nUna tabla que cruza estado de Jira, PR y evidencia, con las discrepancias y los bloqueos que el equipo debe revisar.", "ruta": "skills/g09-reporte-de-estado"}, {"name": "g09-resolve-pr-merge-conflicts", "description": "Resolver conflictos de merge en branches de PRs de Zervi preservando la intención de ambos cambios y validando la integración del backend y frontend. Usar ante PRs con conflictos u operaciones Git detenidas por conflictos.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend"], "fase": ["integracion", "revision"], "tecnologias": ["git", "typescript", "react", "kotlin", "spring-boot", "postgresql", "flyway"], "herramientas": ["codex"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g09-check-front-back-contract", "g09-pre-pr-gate", "g09-review-ticket-pr", "g08-git-conflict-resolver"], "ejemplo": "**Pedido**\n\n> Resolvé el conflicto de esta rama con main en el DTO de turnos y verificá que el cliente siga aceptando la respuesta.\n\n**Salida esperada**\n\nLa resolución explicada por archivo, los cambios conservados de cada rama y el resultado de las pruebas pertinentes.", "ruta": "skills/g09-resolve-pr-merge-conflicts"}, {"name": "g09-review-ticket-pr", "description": "Revisar branches o PRs de Zervi contra tickets de Jira, especificaciones o criterios de aceptación y entregar hallazgos accionables en Markdown listo para GitHub. Usar para revisar implementación, contratos entre frontend React/TypeScript y backend Kotlin/Spring Boot, seguridad, persistencia, pruebas y compatibilidad entre branches.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["frontend", "backend", "qa"], "fase": ["revision"], "tecnologias": ["typescript", "react", "kotlin", "spring-boot", "postgresql", "flyway", "auth0"], "herramientas": ["codex"], "requiere": ["github", "jira"], "madurez": "usado-en-proyecto", "relacionados": ["g09-check-front-back-contract", "g09-ticket-test-matrix", "g09-fix-review-findings", "g09-pre-pr-gate", "g09-debug-local-integration"], "ejemplo": "**Pedido**\n\n> Contrastá la PR de cancelación de turnos con su ticket de Jira. Revisá en particular qué ocurre si cancela otro usuario.\n\n**Salida esperada**\n\nUna revisión por criterio de aceptación, con hallazgos priorizados, referencias al código y pruebas faltantes.", "ruta": "skills/g09-review-ticket-pr"}, {"name": "g09-ticket-test-matrix", "description": "Convertir tickets o especificaciones de Zervi en una matriz trazable de pruebas y auditar la cobertura real del backend Kotlin/Spring Boot y frontend React/TypeScript. Usar para planificar pruebas de aceptación o revisar cobertura; implementar pruebas solo cuando se solicite.", "tipo": "skill", "grupo": "09", "autor": {"nombre": "Máximo Sallemi", "github": "MaximoSallemi"}, "colaboradores": [], "area": ["qa", "frontend", "backend"], "fase": ["planificacion", "revision"], "tecnologias": ["kotlin", "spring-boot", "junit", "postgresql", "testcontainers", "typescript", "react", "vitest"], "herramientas": ["codex"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": ["g09-check-front-back-contract", "g09-pre-pr-gate", "g09-review-ticket-pr", "g09-debug-local-integration"], "ejemplo": "**Pedido**\n\n> Armá la matriz de pruebas del ticket de cancelación. Incluí el caso de otro usuario y comprobá cuáles ya cubre la suite.\n\n**Salida esperada**\n\nUna fila por escenario con precondiciones, resultado esperado, prueba existente y brecha de cobertura.", "ruta": "skills/g09-ticket-test-matrix"}, {"name": "g10-acceptance-criteria", "description": "Definir y mejorar criterios de aceptación de funcionalidades, bugs y tickets a partir de requisitos, diseños y arquitectura existente. Usar al preparar o aclarar trabajo; no para dictaminar el cierre de un PR.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["gestion"], "fase": ["analisis"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Redactá los criterios de aceptación de este requisito y separá qué se comprueba en backend y qué en la interfaz.\n**Resultado:** Condiciones observables, con alcance y dependencias si hacen falta. No los marca como cumplidos ni los escribe en Jira hasta que autorices esa actualización.", "ruta": "skills/g10-acceptance-criteria"}, {"name": "g10-audit-demo-readiness", "description": "Comprobar desde la interfaz si una aplicación poblada permite demostrar los escenarios acordados, incluyendo datos y medios. Usar antes de una demo para obtener veredicto, evidencia y problemas priorizados.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["qa"], "fase": ["testing", "revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g10-uat-planner", "g09-preparar-demo-sprint"], "ejemplo": "**Pedido:** Auditá búsqueda, detalle e historial en la aplicación preparada y comprobá que las fotos se vean.\n\n**Resultado:** Matriz ejecutada, veredicto, hallazgos y guion comprobado, con capturas y pasos no ejecutados.", "ruta": "skills/g10-audit-demo-readiness"}, {"name": "g10-blocker-detector", "description": "Encontrar bloqueos y dependencias que detienen tickets de un sprint usando Jira, comentarios y PR de GitHub. Usar para revisar impedimentos o vigilar bloqueos; distinguir bloqueos confirmados de señales de riesgo.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira", "github"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Revisá el sprint y separá los tickets frenados de verdad de las señales que todavía hay que validar.\n**Resultado:** Tabla de bloqueos confirmados y señales, con evidencia, impacto y la decisión que podría destrabarlos. No comenta tickets ni avisa al equipo.", "ruta": "skills/g10-blocker-detector"}, {"name": "g10-branch-pr-review", "description": "Revisa una branch o PR contra el ticket y los criterios de aceptación, no contra nits de estilo. Usar cuando el usuario pide revisar una branch, un PR, un ticket, criterios de aceptación, si está para aprobar, qué está mal, o un comment para dejar en el PR.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Revisá esta branch contra el ticket y decime si está para aprobar. Si algo no cumple, pasame un comment para pegar en el PR.\n**Resultado:** Veredicto primero, según el diff y los criterios. Si está para mergear, indica que no hace falta comment. Si no, un solo comentario listo para pegar, con el archivo y las líneas.", "ruta": "skills/g10-branch-pr-review"}, {"name": "g10-delivery-capacity-planner", "description": "Planificar iteraciones según capacidad individual, secuencia de dependencias y cronograma, con estimaciones fundamentadas y trabajo diferido. Usar para evaluar un compromiso de entrega; admite backlog aportado sin exigir Jira.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g10-sprint-planner"], "ejemplo": "**Pedido:** Proponé una iteración con Ana y Bruno disponibles 6 h netas cada uno; mostrámela sin registrar cambios.\n\n**Resultado:** Distribución, totales, dependencias, riesgos temporales y alcance diferido, sin prometer fechas no sustentadas.", "ruta": "skills/g10-delivery-capacity-planner"}, {"name": "g10-deployment-handoff", "description": "Preparar instrucciones de despliegue con arquitectura, configuración, responsables, verificaciones y recuperación para que el equipo las ejecute. Usar para transferir el procedimiento conservando el ownership y el entorno elegidos.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["devops", "documentacion"], "fase": ["despliegue"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": ["g08-release-checklist", "g11-revisar-despliegue"], "ejemplo": "**Pedido:** Prepará el handoff de despliegue para los devs con responsables, precondiciones y recuperación; no ejecutes cambios.\n\n**Resultado:** Guía verificable con pasos sustentados, comprobaciones propuestas y pendientes de destino.", "ruta": "skills/g10-deployment-handoff"}, {"name": "g10-developer-feedback", "description": "Evaluar el trabajo observable de cada desarrollador con Jira y GitHub, generar una nota de 0 a 10 con evidencia y dar feedback individual. Usar para evaluar contribuciones de un sprint o período, con capacidad, dependencias y datos incompletos explícitos.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira", "github"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Evaluá a cada desarrollador de este sprint con Jira y GitHub: nota de 0 a 10, con evidencia y feedback individual.\n**Resultado:** Tabla por persona con nota, confianza, las cuatro dimensiones y cobertura, más fortalezas y mejoras enlazadas a tickets o PR. No publica la evaluación ni modifica Jira o GitHub.", "ruta": "skills/g10-developer-feedback"}, {"name": "g10-generate-demo-data", "description": "Preparar datasets de demo y generadores reproducibles basados en el modelo y los escenarios de una aplicación. Usar para producir y validar datos; la carga externa requiere un pedido que la autorice.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["datos", "qa"], "fase": ["testing"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Prepará datos de demo coherentes con el esquema y un generador con semilla y fecha explícitas; solo archivos.\n\n**Resultado:** Generador, dataset, validaciones, distribuciones y escenarios; carga y acceso externo separados.", "ruta": "skills/g10-generate-demo-data"}, {"name": "g10-jira-actualizar-ac", "description": "Guía para configurar una automatización de Jira que envía horas registradas y estimaciones de subtareas a Google Apps Script mediante una solicitud HTTP POST para apoyar el análisis de valor ganado.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion", "datos"], "fase": ["analisis", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira", "google-sheets"], "madurez": "experimental", "relacionados": ["g10-jira-asignacion-automatica"], "ejemplo": "**Pedido:** Configurá una automatización de Jira para enviar diariamente las horas trabajadas y estimaciones de las subtareas de Conexia a Google Apps Script para el seguimiento del valor ganado.\n\n**Resultado:** La guía permite configurar una ejecución programada que selecciona subtareas mediante JQL y envía un JSON con identificador, tiempo registrado, estimación, responsable, padre y steering. El procesamiento posterior depende del script receptor.", "ruta": "skills/g10-jira-actualizar-ac"}, {"name": "g10-jira-asignacion-automatica", "description": "Guía para configurar y verificar una automatización programada de Jira que asigna tickets desde el campo Dev planificado y los mueve de Backlog a Por hacer cuando llega su fecha de inicio.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Configurá una automatización de Jira para que los tickets de Conexia se asignen automáticamente al desarrollador planificado cuando llegue su fecha de inicio.\n\n**Resultado:** La guía indica cómo configurar una regla diaria que filtra tickets de Backlog por fecha de inicio, obtiene el accountId de Dev planificado y los mueve a Por hacer. La ejecución automática queda a cargo de Jira.", "ruta": "skills/g10-jira-asignacion-automatica"}, {"name": "g10-jira-auditoria-fechas", "description": "Guía para configurar una automatización de Jira que registra cambios en la fecha de vencimiento de los tickets y facilita la trazabilidad del cronograma.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g10-jira-asignacion-automatica"], "ejemplo": "**Pedido:** Registrá automáticamente los cambios de fecha de vencimiento de los tickets de Conexia.\n\n**Resultado:** La regla agrega un comentario al ticket con la fecha anterior, la nueva y el usuario que realizó el cambio, permitiendo mantener trazabilidad del cronograma.", "ruta": "skills/g10-jira-auditoria-fechas"}, {"name": "g10-jira-branch-en-curso", "description": "Guía para configurar una automatización de Jira que mueve un ticket de Por hacer a En curso al crear una branch.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion", "devops"], "fase": ["desarrollo"], "tecnologias": ["git"], "herramientas": ["otra"], "requiere": ["jira", "github"], "madurez": "usado-en-proyecto", "relacionados": ["g10-jira-asignacion-automatica"], "ejemplo": "**Pedido:** Configurá Jira para que un ticket pase automáticamente a En curso cuando un desarrollador cree una branch asociada a ese ticket.\n\n**Resultado:** La guía indica cómo configurar el disparador Branch created, restringir la ejecución a tickets en Por hacer y realizar la transición a En curso. Jira ejecuta la automatización cuando recibe el evento correspondiente.", "ruta": "skills/g10-jira-branch-en-curso"}, {"name": "g10-jira-cambios-alcance", "description": "Guía para configurar una automatización de Jira que identifica tickets creados después de una fecha de corte y los marca para revisar posibles cambios de alcance.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g10-jira-asignacion-automatica"], "ejemplo": "**Pedido:** Identificá los tickets de Conexia creados después del cierre de la planificación inicial.\n\n**Resultado:** Jira marca los tickets con la etiqueta alcance-agregado y registra un comentario para que el equipo evalúe si representan una modificación del alcance original.", "ruta": "skills/g10-jira-cambios-alcance"}, {"name": "g10-jira-control-reaperturas", "description": "Guía para configurar una automatización de Jira que identifica tickets reabiertos después de su finalización y registra situaciones de retrabajo.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion", "qa"], "fase": ["revision", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g10-jira-pr-merged"], "ejemplo": "**Pedido:** Identificá automáticamente los tickets de Conexia que vuelven a abrirse después de haber sido finalizados.\n\n**Resultado:** Jira agrega la etiqueta reabierto y registra un comentario con el estado anterior, el nuevo estado, el usuario y la fecha de reapertura.", "ruta": "skills/g10-jira-control-reaperturas"}, {"name": "g10-jira-inactividad-tickets", "description": "Guía para configurar una automatización de Jira que detecta tickets En curso sin actualizaciones durante cinco días y registra una alerta de seguimiento.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g10-jira-branch-en-curso"], "ejemplo": "**Pedido:** Detectá tareas de Conexia que llevan cinco días En curso sin actualizaciones.\n\n**Resultado:** Jira identifica los tickets mediante JQL, agrega un comentario de seguimiento y los marca con una etiqueta para evitar notificaciones repetidas.", "ruta": "skills/g10-jira-inactividad-tickets"}, {"name": "g10-jira-notificaciones", "description": "Guía para configurar una automatización de Jira que envía recordatorios por correo sobre tickets asignados que vencen al día siguiente y todavía no están finalizados.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["otra"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": ["g10-jira-asignacion-automatica"], "ejemplo": "**Pedido:** Configurá un recordatorio automático en Jira para detectar tickets de Conexia que vencen mañana y todavía no están finalizados.\n\n**Resultado:** La guía permite configurar una ejecución diaria a las 13:00 que filtra los tickets por vencimiento, estado y responsable, y envía un correo con la clave de cada ticket seleccionado.", "ruta": "skills/g10-jira-notificaciones"}, {"name": "g10-jira-pr-created", "description": "Guía para configurar y verificar una automatización de Jira que mueve un ticket a En revisión cuando se crea un Pull Request vinculado en GitHub.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion", "devops"], "fase": ["desarrollo", "revision"], "tecnologias": ["git"], "herramientas": ["otra"], "requiere": ["jira", "github"], "madurez": "usado-en-proyecto", "relacionados": ["g10-jira-branch-en-curso", "g10-jira-pr-merged"], "ejemplo": "**Pedido:** Configurá Jira para que los tickets de Conexia pasen automáticamente a En revisión cuando un desarrollador abra un Pull Request asociado.\n\n**Resultado:** La guía indica cómo crear una regla con el disparador Pull request created y la acción de transición a En revisión. Jira ejecuta la transición cuando recibe el evento y el workflow lo permite.", "ruta": "skills/g10-jira-pr-created"}, {"name": "g10-jira-pr-merged", "description": "Guía para configurar una automatización de Jira que finaliza tickets en revisión cuando se fusiona un Pull Request vinculado.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Azul Garber", "github": "amgarber"}, "colaboradores": [], "area": ["gestion", "devops"], "fase": ["revision", "desarrollo"], "tecnologias": ["git"], "herramientas": ["otra"], "requiere": ["jira", "github"], "madurez": "usado-en-proyecto", "relacionados": ["g10-jira-branch-en-curso"], "ejemplo": "**Pedido:** Configurá Jira para que un ticket de Conexia pase automáticamente a Finalizado cuando se haga merge de su Pull Request y el ticket esté En revisión.\n\n**Resultado:** La guía permite configurar el evento Pull request merged, la condición En revisión y la transición a Finalizado. Jira ejecuta la regla cuando recibe el evento de merge.", "ruta": "skills/g10-jira-pr-merged"}, {"name": "g10-jira-ticket-builder", "description": "Convertir requisitos, ideas o bugs en borradores de tickets y subtareas de Jira con criterios de aceptación y dependencias. Crear o actualizar los borradores aprobados cuando el usuario lo autorice.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["gestion"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira", "github"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Convertí este requisito en tickets de Jira: exportar a CSV los resultados filtrados, con backend y frontend a cargo de personas distintas.\n**Resultado:** Borradores con problema, alcance, criterios de aceptación y dependencias, separados si cada parte tiene otro responsable. No crea ni edita nada en Jira hasta que apruebes el contenido y el destino.", "ruta": "skills/g10-jira-ticket-builder"}, {"name": "g10-jira-ticket-manager", "description": "Preparar y deduplicar tickets Jira con criterios verificables, campos reales y cambios concretos para aprobación. Usar para registrar trabajo identificado únicamente después de autorización explícita.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["gestion"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g10-jira-ticket-builder"], "ejemplo": "**Pedido:** Prepará un ticket para el estado vacío y revisá duplicados; no ejecutes cambios.\n\n**Resultado:** Borrador con criterios y campos pendientes; reutilización si ya está cubierto y ninguna escritura no autorizada.", "ruta": "skills/g10-jira-ticket-manager"}, {"name": "g10-product-analyzer", "description": "Analizar el estado real de un producto reconstruyendo flujos end-to-end y priorizando gaps con evidencia. Usar para decidir qué falta y qué conservar, sin implementar cambios ni registrar tickets.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["gestion", "frontend", "backend"], "fase": ["analisis"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Analizá el flujo de solicitudes con el repositorio y el contexto; indicá gaps comprobados y qué conservar.\n\n**Resultado:** Informe de estado, gaps, riesgos, prioridades justificadas y capacidades que conviene preservar.", "ruta": "skills/g10-product-analyzer"}, {"name": "g10-review-pr-ticket", "description": "Revisar una PR contra su ticket y comprobar su comportamiento con pruebas locales y navegador, conservando evidencia por versión. Usar para obtener un veredicto y comentario listo para copiar, sin publicarlo.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Pedro Ramirez Neira", "github": "pedroramirezneira"}, "colaboradores": [], "area": ["qa"], "fase": ["revision", "testing"], "tecnologias": ["agnostico"], "herramientas": ["codex"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g10-branch-pr-review", "g07-code-review-tl"], "ejemplo": "**Pedido:** Revisá PR=94 ticket=KAN-197, contrastá criterios y probá el flujo con evidencia.\n\n**Resultado:** Veredicto, hallazgos, matriz del ticket, checks y capturas con límites explícitos.", "ruta": "skills/g10-review-pr-ticket"}, {"name": "g10-sprint-health", "description": "Evaluar el estado de un sprint con Jira, ramas, commits y PR de GitHub, estimando avance técnico aproximado cuando se solicita. Usar en controles diarios o revisiones de salud; no para crear el plan inicial.", "tipo": "skill", "grupo": "10", "autor": {"nombre": "Marcos Carrizo Aslanian", "github": "MarcosCarrizoA"}, "colaboradores": [], "area": ["gestion"], "fa
