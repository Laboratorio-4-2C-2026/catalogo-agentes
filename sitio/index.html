<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Común de Agentes</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1a2130;--muted:#5b6577;--line:#dde1e8;--acc:#2e55c8;--soft:#e7ecfb;--on:#fff;
--tag:#8a5a00;--tagbg:#fbf1dc;--ok:#1f7a4d;--okbg:#e2f3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12161e;--card:#1a1f2a;--fg:#e4e8f0;--muted:#9aa4b6;--line:#2c3342;--acc:#8ea8ff;
--soft:#1f2a48;--on:#10141b;--tag:#f0c56a;--tagbg:#3a2f17;--ok:#6fd3a0;--okbg:#17342a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1160px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{margin:0;font-size:1.6rem}.m{color:var(--muted)}.s{font-size:14px}
nav{display:flex;gap:6px}nav a{text-decoration:none;color:var(--fg);padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}
nav a.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
a{color:var(--acc)}
input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.row b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:100px}
.chip{font:inherit;font-size:14px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.g{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}@media(min-width:880px){.g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.list{display:grid;gap:8px;align-content:start}
.c{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.c.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.n{font-family:ui-monospace,Consolas,monospace;font-weight:600;font-size:14px;word-break:break-word}
.t{display:inline-block;font-size:12px;padding:0 7px;border-radius:99px;background:var(--tagbg);color:var(--tag);margin:3px 3px 0 0}
.t.b{background:var(--soft);color:var(--acc)}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-self:start;position:sticky;top:12px;min-width:0}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:14.5px}dt{color:var(--muted)}dd{margin:0}
pre{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;font:14px/1.5 system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.st .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;white-space:nowrap}
td.r{text-align:right;font-variant-numeric:tabular-nums}tr.on td{background:var(--soft)}
.bar{width:110px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}.bar span.full{background:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--tagbg);color:var(--tag)}.pill.ok{background:var(--okbg);color:var(--ok)}
h2{font-size:1.15rem;margin:22px 0 8px}h3{font-size:1rem;margin:14px 0 6px}
ul.p{padding-left:1.1em;margin:4px 0}
</style></head><body><div class="w">
<header><div><h1>Catálogo Común de Agentes</h1><div class="m s" id="sub"></div></div>
<nav><a href="#explorar" id="tab-explorar">Explorador</a><a href="#avance" id="tab-avance">Avance por alumno</a></nav></header>
<main id="main"></main>
</div>
<script>
const P = [{"name": "g02-acceptance-criteria-to-tests", "description": "Método en dos fases para derivar casos de prueba solo desde los criterios de aceptación de un ticket, antes de leer el código. Usar al escribir tests independientes de la implementación.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, "colaboradores": [], "area": ["qa"], "fase": ["testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g02-e2e-test-writer"], "ejemplo": "**Pedido:** Derivá los casos de prueba del ticket ZEST-87.\n**Resultado:** Genera derived-cases.md con los casos trazados a cada criterio y los criterios ambiguos, sin abrir el código, y recién después implementa los tests.", "ruta": "skills/g02-acceptance-criteria-to-tests"}, {"name": "g02-branch-cleanup", "description": "Usar una vez por semana para listar las branches del repo de Zest (mergeadas, abandonadas y activas) en la planilla de limpieza de branches. Solo reporta: nunca borra branches ni hace push.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["devops"], "fase": ["mantenimiento"], "tecnologias": ["git", "python"], "herramientas": ["claude-code"], "requiere": ["github", "google-sheets"], "madurez": "experimental", "relacionados": ["g13-validar-branch", "g02-branch-cleanup-agent"], "ejemplo": "**Pedido:** Actualizá la planilla de branches.\n**Resultado:** Genera el reporte de branches mergeadas, abandonadas y activas con branch_report.py y actualiza la planilla, sin borrar nada.", "ruta": "skills/g02-branch-cleanup"}, {"name": "g02-bug-origin-check", "description": "Determina si un bug encontrado al revisar una PR de Zest lo introdujo esa PR o ya existía en dev, comparando código e historial. Usar antes de pedirle a un autor que corrija algo en su PR.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Luz Laura", "github": "luzlaura"}, "colaboradores": [], "area": ["qa"], "fase": ["revision", "testing"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g02-stale-review-guard"], "ejemplo": "**Pedido:** En la PR 79 la búsqueda ignora mayúsculas pero no los acentos, ¿es de esta PR?\n**Resultado:** Compara el diff con el código de dev, indica el commit donde apareció el patrón y da un veredicto con la acción a seguir.", "ruta": "skills/g02-bug-origin-check"}, {"name": "g02-catalog-publisher", "description": "Usar para subir o actualizar los agentes y skills del grupo 02 (Zest) en el Catálogo Común de Agentes de la materia (Laboratorio-4-2C-2026/catalogo-agentes). Los exporta de Multica, les arma la ficha, valida y abre el PR.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["documentacion"], "fase": ["despliegue"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["github", "multica"], "madurez": "experimental", "relacionados": ["g03-revisor-de-fichas", "g02-catalog-publisher-agent"], "ejemplo": "**Pedido:** Publicá las piezas nuevas en el catálogo.\n**Resultado:** Explica las tres fases (preparar, subir, mergear), cada una con confirmación del equipo, y las reglas para no modificar instrucciones ni subir secretos.", "ruta": "skills/g02-catalog-publisher"}, {"name": "g02-comite-de-decisiones", "description": "Usar cuando haya que tomar una decisión del proyecto Zest (técnica, de alcance, de presupuesto, de equipo o de cómo presentar algo) y se quiera una mirada sin sesgo: convoca a tres subagentes en paralelo, un abogado del diablo, un aliado y un neutral, y devuelve sus posiciones con preguntas para que decida la persona.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g02-comite-abogado-del-diablo", "g02-comite-aliado", "g02-comite-neutral", "g08-devils-advocate", "g11-analizar-cambio-alcance", "g02-control-de-cambios"], "ejemplo": "**Pedido:** \"/g02-comite-de-decisiones ¿En el Steering 3 recalculamos el EV midiendo gestión e infraestructura como nivel de esfuerzo, aunque el SPI baje, o seguimos con el método del Steering 2?\"\n\n**Resultado:** Encuadra la decisión, lanza los tres subagentes en paralelo con los mismos datos y devuelve las tres posiciones (el abogado del diablo marcó que el CPI también cae, el aliado defendió recalcular y el neutral dijo qué dato da vuelta la decisión), cerrando con preguntas para la persona, sin decidir por ella.", "ruta": "skills/g02-comite-de-decisiones"}, {"name": "g02-console-check", "description": "Usar una vez por semana para levantar Zest en local, recorrer los flujos de los tickets cerrados en la semana y crear un issue en Multica si aparecen errores o warnings en la consola del navegador.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["qa"], "fase": ["testing"], "tecnologias": ["playwright", "javascript"], "herramientas": ["claude-code"], "requiere": ["multica", "chrome"], "madurez": "experimental", "relacionados": ["g02-console-check-agent"], "ejemplo": "**Pedido:** Revisá la consola de la app esta semana.\n**Resultado:** Levanta la app en local, recorre los flujos de los tickets cerrados y reporta en un único issue los errores o warnings de consola.", "ruta": "skills/g02-console-check"}, {"name": "g02-control-de-cambios", "description": "Usar cuando en Zest entra, sale o vuelve alcance (un challenge nuevo, un recorte, una funcionalidad recortada que se recupera) o se mueve una fecha comprometida. Cuantifica el impacto en horas, plata y cronograma, dice de dónde sale el financiamiento, redacta el acta de cambio, versiona la línea base sin pisar la anterior y prepara la slide de trade-off para el steering.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica", "google-drive"], "madurez": "experimental", "relacionados": ["g11-analizar-cambio-alcance", "g02-valor-ganado-evm", "g02-comite-de-decisiones", "g02-registro-de-decisiones-pm", "g02-status-report-format"], "ejemplo": "**Pedido:** \"El profesor nos autorizó recuperar el stepper de porciones y la acción rápida del planificador, que habíamos recortado el 13/10. Armame el control de cambios.\"\n\n**Resultado:** Clasifica el cambio como alcance que vuelve, estima las horas de desarrollo y las traduce a semanas con 6 h por dev, propone financiarlo con la contingencia de actividades e informa cuánto queda, redacta el acta con la referencia a la del 13/10, propone la línea base v3 conservando la v2, lista los tickets a reabrir en Multica y arma la slide de trade-off avisando que en el Steering 2 se había dicho que no se recuperaban.", "ruta": "skills/g02-control-de-cambios"}, {"name": "g02-deck-de-steering", "description": "Usar para armar el deck de un Steering Committee de Zest (o cualquier presentación del proyecto) como una app web en React, Vite y Tailwind en vez de un PowerPoint: primero aprueba los títulos, después muestra tres estilos para elegir y construye con fondos y efectos de React Bits gratuitos, vista de presentador, chequeo automático de layout con capturas y exportación a PDF.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion", "diseno"], "fase": ["revision"], "tecnologias": ["react", "vite", "typescript", "tailwindcss", "playwright"], "herramientas": ["claude-code"], "requiere": ["google-drive"], "madurez": "probado", "relacionados": ["g15-steering-deck-builder", "g04-estructura-de-presentacion", "g11-auditar-steering", "g02-storytelling-de-demo", "g02-valor-ganado-evm"], "ejemplo": "**Pedido:** \"Armame el deck del Steering 3 a partir del Steering 2.\"\n\n**Resultado:** Propone los títulos de las 16 slides como aseveraciones y espera la aprobación, muestra capturas de tres estilos (Citrus editorial, Cocina de noche y Recetario) con la portada y la slide de valor ganado, copia la plantilla, construye las slides con los números en un solo archivo con su fuente, corre el chequeo de layout, revisa cada captura y exporta el PDF de respaldo.", "ruta": "skills/g02-deck-de-steering"}, {"name": "g02-demo-data-generator", "description": "Usar cuando piden datos para poblar la base de Zest. Lee la estructura actual de la base en el repo y genera un paquete listo para cargar con recetas reales, colecciones y usuarios ficticios, con fotos.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["datos"], "fase": ["desarrollo"], "tecnologias": ["typescript", "postgresql", "prisma"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g02-demo-data-generator-agent"], "ejemplo": "**Pedido:** Necesito datos para poblar la base de Zest.\n**Resultado:** Lee el esquema del repo, genera recetas, colecciones y usuarios ficticios con fotos libres y valida el paquete antes de adjuntarlo.", "ruta": "skills/g02-demo-data-generator"}, {"name": "g02-dev-grade-estimator", "description": "Usar para estimar una nota orientativa de cada desarrollador de Zest según el cumplimiento de sus tickets en Multica y la dificultad de lo que terminó, con el desglose y acciones para mejorar.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "probado", "relacionados": ["g02-dev-grade-estimator-agent"], "ejemplo": "**Pedido:** Dame la nota orientativa de cada dev.\n**Resultado:** Aplica una rúbrica sobre cumplimiento de tickets y dificultad y devuelve la nota con el desglose y acciones para mejorar.", "ruta": "skills/g02-dev-grade-estimator"}, {"name": "g02-done-evidence-check", "description": "Indica qué evidencia externa necesita un ticket de Zest para pasar a done y verifica si ya está, sobre todo en deploy e infraestructura, donde el código mergeado no alcanza. Usar antes de cerrar un ticket; no lo mueve.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Luz Laura", "github": "luzlaura"}, "colaboradores": [], "area": ["qa", "devops"], "fase": ["revision", "despliegue"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica", "github"], "madurez": "experimental", "relacionados": ["g02-ticket-merge-sync", "g02-multica-guide"], "ejemplo": "**Pedido:** ¿Puedo pasar a done el ticket del deploy del backend?\n**Resultado:** Revisa ticket y PR, comprueba `/health` en prod y responde qué evidencia está, cuál falta y a quién pedírsela.", "ruta": "skills/g02-done-evidence-check"}, {"name": "g02-estimador-de-horas-reales", "description": "Usar cuando el equipo de Zest no cargó horas y hace falta el costo real (AC) del desarrollo para el valor ganado. Estima horas por persona y por semana a partir de los commits de git de todas las ramas, con un método reproducible (margen, piso y techo por día), las valoriza a la tarifa de la línea base y declara qué no puede ver.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["git", "python"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g02-valor-ganado-evm", "g02-ticket-time-estimator", "g02-dev-grade-estimator", "g15-evm-calculator"], "ejemplo": "**Pedido:** \"No tenemos las horas de los devs del Sprint 3. Estimame el AC de desarrollo de Zest del 06/08 al 12/11 desde git, a USD 10 la hora.\"\n\n**Resultado:** Verifica que el clon no sea superficial, corre `horas_git.py` sobre todas las ramas excluyendo bots y gestión, y devuelve la tabla de horas por dev y por semana (por ejemplo, unas 194 h en total, USD 1.944), con los días de un solo commit marcados y las limitaciones del método escritas, lista para pasar a `g02-valor-ganado-evm`.", "ruta": "skills/g02-estimador-de-horas-reales"}, {"name": "g02-kpi-compliance-check", "description": "Usar para chequear a diario en el panel público de Lab4 KPIs si el Equipo 2 (Zest) reportó el día COMPLETO, y crear un issue con los suscriptores del autopilot solo cuando no lo está.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "probado", "relacionados": ["g11-explicar-kpi", "g02-kpi-compliance-checker"], "ejemplo": "**Pedido:** ¿Zest reportó hoy en el panel de KPIs?\n**Resultado:** Corre el chequeo diario contra el panel público de Lab4 KPIs y define cuándo crear el issue y a quién suscribir, según el código de salida.", "ruta": "skills/g02-kpi-compliance-check"}, {"name": "g02-matriz-raci", "description": "Usar para armar o revisar la matriz RACI de Zest cruzando las actividades de la WBS con los roles del equipo (PM, PO, Tech Lead, QA y los dos devs), con exactamente un Aprobador por actividad, y para mapear los roles a las personas en cada steering, ya que en Zest los roles de gestión rotan. Detecta actividades sin dueño, aprobadores duplicados y sobrecarga.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["google-drive"], "madurez": "experimental", "relacionados": ["g02-zest-onboarding", "g02-status-report-format", "g03-pm-po-agent"], "ejemplo": "**Pedido:** \"Armame la RACI de Zest para el Steering 3 con las actividades de la planilla de status.\"\n\n**Resultado:** Una matriz por rol con todas las actividades de la WBS y exactamente un Aprobador en cada una, la tabla de qué persona tiene cada rol en los steerings 1, 2 y 3, los hallazgos (por ejemplo, actividades del planificador cuyo Aprobador cambia de persona con la rotación) y la vista de responsabilidades por persona para el período actual.", "ruta": "skills/g02-matriz-raci"}, {"name": "g02-multica-guide", "description": "Guía para conectarse a Multica y usar su CLI en el proyecto Zest, con instalación, login, comandos de todos los días y convenciones de tickets. Usar cuando alguien del equipo o un agente necesita leer, crear o mover tickets de Zest.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Luz Laura", "github": "luzlaura"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "usado-en-proyecto", "relacionados": ["g02-zest-ticket-format"], "ejemplo": "**Pedido:** ¿Cómo veo los tickets de Zest que están en revisión desde la terminal?\n**Resultado:** Indica cómo conectar la CLI si hace falta y da el comando `multica issue list` con el proyecto de Zest y `--status in_review`.", "ruta": "skills/g02-multica-guide"}, {"name": "g02-pr-review-format", "description": "Formato fijo para publicar en un PR de Zest el resultado de una revisión automática: tabla de checks, hallazgos por severidad y pendientes. Usar al comentar revisiones de agentes.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g02-pr-reviewer"], "ejemplo": "**Pedido:** Publicá el resultado de la revisión del PR 42 con el formato del equipo.\n**Resultado:** Arma un único comentario con resumen, tabla de checks ejecutados, hallazgos ordenados por severidad y criterios sin resolver.", "ruta": "skills/g02-pr-review-format"}, {"name": "g02-registro-de-riesgos", "description": "Usar para crear o actualizar el registro de riesgos de Zest (amenazas y oportunidades) con probabilidad, impacto en dinero, valor monetario esperado (VME), estrategia y respuesta, y para calibrar la reserva de contingencia contra el VME de los riesgos conocidos. Distingue riesgos de problemas que ya ocurrieron y arma la matriz de probabilidad e impacto para el steering.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["google-drive"], "madurez": "experimental", "relacionados": ["g03-status-risks", "g15-risk-register-keeper", "g02-status-report-format", "g02-valor-ganado-evm", "g02-control-de-cambios"], "ejemplo": "**Pedido:** \"Actualizá el registro de riesgos de Zest para el Steering 3. El planificador termina el mismo día del MVP y volvieron dos funciones que habíamos recortado.\"\n\n**Resultado:** Revisa los riesgos R1–R5 y O1–O3 del Steering 2, agrega uno nuevo de fecha (el planificador sin holgura antes del 12/11) con probabilidad, impacto en dólares y VME, suma el VME de las amenazas y lo compara con las horas de contingencia que quedan, avisa si la reserva no alcanza y entrega las tablas, la matriz y el resumen de cambios.", "ruta": "skills/g02-registro-de-riesgos"}, {"name": "g02-stacked-pr-guard", "description": "Antes de mergear una PR de Zest o borrar una rama, detecta PRs abiertas que apuntan a una rama ya mergeada o que dependen de esa rama, para que nada caiga en una rama muerta. Usar con PRs apiladas; no define la estrategia de ramas.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Luz Laura", "github": "luzlaura"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g02-stale-review-guard"], "ejemplo": "**Pedido:** ¿Puedo mergear la PR 78 de Zest?\n**Resultado:** Avisa que su base `ZEST-126` ya se mergeó en la PR 77, que la PR 80 está apilada encima, y propone cambiar la base antes de mergear.", "ruta": "skills/g02-stacked-pr-guard"}, {"name": "g02-stale-review-guard", "description": "Detecta si la rama de una PR de Zest quedó atrás de dev y contrasta cada hallazgo de una revisión contra el código actual, descartando los que ya no aplican. Usar después de una revisión automática y antes de publicarla.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Luz Laura", "github": "luzlaura"}, "colaboradores": [], "area": ["qa"], "fase": ["revision"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": ["g02-bug-origin-check", "g02-stacked-pr-guard"], "ejemplo": "**Pedido:** Tengo estos 4 hallazgos del code review de la PR 72, ¿siguen valiendo?\n**Resultado:** Informa cuántos commits está atrás la rama y devuelve una tabla que marca cada hallazgo como vigente, ya no aplica o a revisar, con evidencia.", "ruta": "skills/g02-stale-review-guard"}, {"name": "g02-status-report-format", "description": "Usar para cargar cada jueves el status semanal del Equipo 02 (Zest) en el Tablero de Estado del Proyecto (pestaña \"Equipo 02\"): semáforo con motivo y acción, tabla de Cronograma y tabla de Incidentes, a partir de Multica.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica", "github", "google-sheets"], "madurez": "experimental", "relacionados": ["g03-status-risks", "g03-status-schedule", "g03-status-incidents", "g11-weekly-status", "g02-status-report-updater"], "ejemplo": "**Pedido:** Cargá el status de esta semana en el tablero.\n**Resultado:** Define el formato del semáforo con motivo y acción, la tabla de Cronograma y la de Incidentes, y las reglas para no sobrescribir semanas ya cargadas.", "ruta": "skills/g02-status-report-format"}, {"name": "g02-storytelling-de-demo", "description": "Usar para preparar o ensayar la demo de Zest en un steering, en Lab II, en un demo day o en el final: verifica qué está terminado, arma la historia con una persona y entrega el paquete completo (guion clic por clic con quién habla y qué hacer si falla, versiones de 30 s, 2 y 5 minutos, preguntas probables, plan B y checklists). También hace de público para ensayar.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "usado-en-proyecto", "relacionados": ["g04-guion-de-demo", "g09-preparar-demo-sprint", "g05-watchparty-steering-rehearsal", "g02-demo-data-generator", "g02-deck-de-steering"], "ejemplo": "**Pedido:** \"Armame la demo del Steering 3 con colecciones y el planificador: 10 minutos, presentan Santi y Thiago.\"\n\n**Resultado:** Revisa el código y el cronograma, detecta que el planificador todavía no está terminado y arma dos guiones (A con el planificador, B sin él), con la historia de Sofi, tarjetas funcionalidad → valor, un guion clic por clic con quién habla y qué hacer si falla cada paso, versiones cortas, preguntas probables, plan B y checklists para el ensayo y el día.", "ruta": "skills/g02-storytelling-de-demo"}, {"name": "g02-ticket-reminder", "description": "Usar los martes para avisar en Multica a los devs de Zest qué tickets que vencen el jueves todavía no terminaron, con un comentario en cada ticket pendiente.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "probado", "relacionados": ["g02-ticket-reminder-agent"], "ejemplo": "**Pedido:** Recordales los tickets del jueves.\n**Resultado:** Busca los tickets abiertos que vencen el jueves y comenta un recordatorio en cada uno, suscribiendo al dev.", "ruta": "skills/g02-ticket-reminder"}, {"name": "g02-ticket-time-estimator", "description": "Usar cuando piden estimar cuánto va a durar un ticket de Zest. Estima en días hábiles, solo con el historial de tickets terminados en Multica, para cada persona del equipo y para el equipo en promedio.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["multica"], "madurez": "experimental", "relacionados": ["g11-estimar-ticket", "g02-ticket-time-estimator-agent"], "ejemplo": "**Pedido:** ¿Cuánto va a tardar este ticket?\n**Resultado:** Calcula días hábiles por persona y para el equipo con tickets terminados de Multica y deja la estimación comentada.", "ruta": "skills/g02-ticket-time-estimator"}, {"name": "g02-valor-ganado-evm", "description": "Usar para estimar esfuerzo y costo, armar o revisar el presupuesto y calcular, auditar y defender el valor ganado de Zest (PV, EV, AC, SPI, CPI, EAC, ETC, VAC, TCPI) con la teoría de Dirección de Proyectos de la cátedra. Separa líneas de nivel de esfuerzo del desarrollo, muestra cada cuenta y propone la decisión.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Maria Clara Lopez", "github": "ClaraLopez1"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["multica", "google-drive"], "madurez": "usado-en-proyecto", "relacionados": ["g15-evm-calculator", "g04-earned-value-presentacion", "g11-auditar-steering", "g02-status-report-format", "g02-estimador-de-horas-reales", "g02-control-de-cambios"], "ejemplo": "**Pedido:** \"Calculá el valor ganado de Zest al corte del 05/11: PV acumulado 5.600, tickets terminados por actividad [lista], horas reales dev 190 y gestión 300. Quiero los índices globales y los de desarrollo.\"\n\n**Resultado:** Lista los datos con su fuente y fecha, mide gestión e infraestructura como nivel de esfuerzo (EV = PV) y desarrollo por tickets terminados, muestra cada cuenta (`SPI = EV / PV = ...`), compara con el corte anterior, avisa si los índices globales están inflados por composición y cierra con la decisión que corresponde y quién la toma.", "ruta": "skills/g02-valor-ganado-evm"}, {"name": "g02-zest-e2e-conventions", "description": "Convenciones para correr y escribir tests E2E de Zest con Playwright: repos de trabajo, levantar el stack local, selectores y apertura de PRs. Usar al preparar o ejecutar pruebas E2E.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, "colaboradores": [], "area": ["qa", "devops"], "fase": ["testing"], "tecnologias": ["playwright", "docker", "postgresql"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g02-e2e-test-writer", "g02-responsive-check"], "ejemplo": "**Pedido:** Levantá el stack y corré los E2E de la rama del ticket.\n**Resultado:** Actualiza los dos checkouts, levanta Postgres, migra y siembra la base local, espera /health, escribe specs con data-testid y baja todo al terminar.", "ruta": "skills/g02-zest-e2e-conventions"}, {"name": "g02-zest-onboarding", "description": "Usar cuando alguien nuevo en el equipo (por ejemplo, un QA que se suma) pregunta cualquier cosa sobre Zest. Responde con el contexto del proyecto, los repos, los documentos y presentaciones del equipo, Multica y la planilla, siempre citando la fuente.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Ines Gassiebayle", "github": "inesgassiebayle"}, "colaboradores": [], "area": ["documentacion"], "fase": ["mantenimiento"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["github", "multica", "google-sheets"], "madurez": "probado", "relacionados": ["g11-repo-onboarding", "g13-onboarding-de-repo", "g02-zest-onboarding-agent"], "ejemplo": "**Pedido:** ¿Dónde está documentado el esquema de la base?\n**Resultado:** Responde con el contexto del proyecto, repos, documentos y Multica, citando siempre la fuente.", "ruta": "skills/g02-zest-onboarding"}, {"name": "g02-zest-ticket-format", "description": "Estructura y convenciones de los tickets del backlog de Zest: introducción, tareas, criterios de aceptación, etiqueta y sprint. Usar al redactar o revisar un ticket.", "tipo": "skill", "grupo": "02", "autor": {"nombre": "Liz Lubelcyk", "github": "lizlubelczyk"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": ["g02-ticket-drafter"], "ejemplo": "**Pedido:** Escribí un ticket para el endpoint de colecciones siguiendo el formato.\n**Resultado:** Devuelve el ticket con introducción en prosa, tareas numeradas, criterios de aceptación testeables y la etiqueta backend, tras buscar duplicados.", "ruta": "skills/g02-zest-ticket-format"}, {"name": "g03-dart-add-unit-test", "description": "Escribe y organiza tests unitarios de funciones, métodos y clases Dart con package:test. Usar al crear lógica nueva o al corregir un bug, para que el código siga funcionando.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para la función que calcula cuánto debe cada participante.\"\n\n**Resultado:** Un archivo de tests con los casos normales y los bordes (cero participantes, montos con decimales) agrupados y nombrados con claridad.", "ruta": "skills/g03-dart-add-unit-test"}, {"name": "g03-dart-fix-runtime-errors", "description": "Encuentra y corrige errores en tiempo de ejecución de una app Dart o Flutter: obtiene el stack trace, ubica la línea que falla, aplica el arreglo y lo verifica con hot reload. Usar cuando la app tira una excepción mientras corre.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"La app se cierra al abrir el detalle de un evento, arreglalo.\"\n\n**Resultado:** La causa del error ubicada en el código, el arreglo aplicado y la confirmación de que el error ya no aparece después del hot reload.", "ruta": "skills/g03-dart-fix-runtime-errors"}, {"name": "g03-dart-resolve-package-conflicts", "description": "Guía para resolver conflictos de versiones de paquetes cuando pub get falla por dependencias incompatibles. Usar cuando no se pueden instalar las dependencias de un proyecto Dart o Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"pub get falla por un conflicto entre intl y flutter_localizations.\"\n\n**Resultado:** La causa del conflicto, las versiones compatibles a usar y el pubspec.yaml ajustado, con pub get funcionando.", "ruta": "skills/g03-dart-resolve-package-conflicts"}, {"name": "g03-dart-run-static-analysis", "description": "Ejecuta dart analyze para encontrar warnings y errores y aplica dart fix para corregir automáticamente los problemas de lint mecánicos. Usar durante el desarrollo y antes de hacer commit.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["desarrollo", "revision"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Dejá el proyecto sin warnings antes de abrir el PR.\"\n\n**Resultado:** El resultado de dart analyze, los arreglos automáticos aplicados con dart fix y la lista de problemas que hay que resolver a mano.", "ruta": "skills/g03-dart-run-static-analysis"}, {"name": "g03-express-project-structure-guidelines", "description": "Define la estructura de carpetas por recurso, la separación en capas (routes, controllers, services, repositories) y las convenciones de nombres para backends Express con TypeScript. Usar al crear un módulo nuevo o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend"], "fase": ["diseno", "desarrollo"], "tecnologias": ["express", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo la lógica para invitar participantes a un evento?\"\n\n**Resultado:** La ubicación de cada parte (ruta, controlador, servicio, repositorio) dentro del módulo correspondiente, con el motivo de cada decisión.", "ruta": "skills/g03-express-project-structure-guidelines"}, {"name": "g03-express-typescript", "description": "Guía para construir APIs con Express y TypeScript estricto: middlewares (asyncHandler, errorHandler), validación de requests con Zod y seguridad (CORS, Helmet). Usar al crear o revisar endpoints de un backend Express.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["express", "typescript", "zod"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el endpoint POST /events con validación del body.\"\n\n**Resultado:** El controlador, la validación con un esquema de Zod y el manejo de errores con los middlewares del proyecto, siguiendo las convenciones de la skill.", "ruta": "skills/g03-express-typescript"}, {"name": "g03-figma-inspect-design", "description": "Inspecciona frames de Figma, extrae medidas, espaciados, tipografías y colores, y los compara con la implementación en Flutter. Usar al revisar un link de diseño o verificar que una pantalla coincide con Figma.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["diseno", "mobile"], "fase": ["diseno", "revision"], "tecnologias": ["figma", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["figma"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿La pantalla de login coincide con el diseño de Figma?\"\n\n**Resultado:** Las diferencias encontradas entre el frame y el código (espaciados, tamaños de fuente, colores) con el valor esperado y el valor actual de cada una.", "ruta": "skills/g03-figma-inspect-design"}, {"name": "g03-flutter-add-widget-preview", "description": "Agrega previews interactivas de widgets Flutter con el sistema previews.dart para ver y probar componentes sin correr toda la app. Usar al crear componentes de UI nuevos o al cambiar pantallas existentes.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá una preview del componente de tarjeta de evento.\"\n\n**Resultado:** Una preview del componente con sus variantes principales (con y sin imagen, texto largo) lista para ver en el entorno de previews.", "ruta": "skills/g03-flutter-add-widget-preview"}, {"name": "g03-flutter-add-widget-test", "description": "Escribe tests de widgets Flutter con WidgetTester para verificar que un componente muestra los datos correctos y responde a interacciones (tocar, scrollear, escribir). Usar al validar el comportamiento de un widget concreto.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para el formulario de crear evento.\"\n\n**Resultado:** Un archivo de test que monta el widget, simula la carga de datos y el envío, y verifica los mensajes de error y el caso exitoso.", "ruta": "skills/g03-flutter-add-widget-test"}, {"name": "g03-flutter-apply-glassmorphism-design", "description": "Aplica un estilo glassmorphism (paneles translúcidos con desenfoque, profundidad y movimiento suave) a pantallas Flutter usando BackdropFilter y los tokens de diseño propios del proyecto. Usar cuando una pantalla o componente se ve genérico y tiene que verse más profesional.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["diseno", "mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la pantalla de detalle del evento se vea más pro.\"\n\n**Resultado:** La pantalla con superficies translúcidas, jerarquía visual y animaciones suaves construidas con los colores, radios, espaciados y tipografías del proyecto, sin inventar valores nuevos.", "ruta": "skills/g03-flutter-apply-glassmorphism-design"}, {"name": "g03-flutter-apply-material3-guidelines", "description": "Aplica las guías de Material Design 3 en apps Flutter: theming, esquemas de color dinámicos y uso correcto de componentes. Usar al diseñar o refactorizar pantallas y componentes de UI.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Pasá la pantalla de configuración a Material 3.\"\n\n**Resultado:** La pantalla con el ThemeData de Material 3, los componentes actualizados y los colores tomados del esquema del tema en lugar de valores fijos.", "ruta": "skills/g03-flutter-apply-material3-guidelines"}, {"name": "g03-flutter-build-responsive-layout", "description": "Construye layouts Flutter que se adaptan a distintos tamaños de pantalla con LayoutBuilder, MediaQuery y Expanded/Flexible. Usar cuando una pantalla tiene que verse bien en celular, tablet y escritorio.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "frontend"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la lista de eventos use dos columnas en tablet.\"\n\n**Resultado:** La pantalla reorganizada con LayoutBuilder: una columna en celular y dos en pantallas anchas, sin desbordes.", "ruta": "skills/g03-flutter-build-responsive-layout"}, {"name": "g03-flutter-fix-layout-issues", "description": "Corrige errores de layout en Flutter, como \"RenderFlex overflowed\" o \"unbounded height\", usando las herramientas MCP de Dart y Flutter. Usar cuando una pantalla muestra franjas de desborde o falla por restricciones de tamaño.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Me aparece \"RenderFlex overflowed by 42 pixels\" en la pantalla de perfil.\"\n\n**Resultado:** La causa del desborde identificada, el widget corregido (por ejemplo con Expanded o un scroll) y la verificación de que el error desapareció.", "ruta": "skills/g03-flutter-fix-layout-issues"}, {"name": "g03-flutter-project-structure-guidelines", "description": "Define la estructura de carpetas Feature-First, las capas con flujo de datos unidireccional y las convenciones de nombres para apps Flutter. Usar al crear una feature nueva o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo el repositorio y el notifier de la feature de invitaciones?\"\n\n**Resultado:** La ubicación de cada archivo dentro de la feature (data, domain, presentation) con el motivo, siguiendo la estructura del proyecto.", "ruta": "skills/g03-flutter-project-structure-guidelines"}, {"name": "g03-flutter-setup-localization", "description": "Configura la internacionalización de una app Flutter: dependencias flutter_localizations e intl, generate en pubspec.yaml y el archivo l10n.yaml. Usar al agregar soporte de varios idiomas a un proyecto Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Prepará la app para que esté en español y en inglés.\"\n\n**Resultado:** Las dependencias agregadas, l10n.yaml configurado, los archivos .arb iniciales y un ejemplo de cómo usar los textos traducidos en un widget.", "ruta": "skills/g03-flutter-setup-localization"}, {"name": "g03-javascript-typescript-vitest", "description": "Buenas prácticas para tests de JavaScript y TypeScript con Vitest: estructura, mocks con vi e imports explícitos, adaptadas a un backend que no usa globals. Usar al escribir o corregir tests con Vitest.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["vitest", "typescript", "javascript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Este test usa jest.fn() y falla, ¿cómo lo paso a Vitest?\"\n\n**Resultado:** El test reescrito con vi.fn(), los imports explícitos desde vitest y la explicación de cada cambio.", "ruta": "skills/g03-javascript-typescript-vitest"}, {"name": "g03-multi-stage-dockerfile", "description": "Crea Dockerfiles multi-stage optimizados para cualquier lenguaje o framework, separando la etapa de build de la imagen final. Usar al dockerizar un servicio o al reducir el tamaño de una imagen.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["devops"], "fase": ["despliegue"], "tecnologias": ["docker"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el Dockerfile del backend para producción.\"\n\n**Resultado:** Un Dockerfile con una etapa de build y una imagen final liviana que solo contiene lo necesario para correr, con la explicación de cada etapa.", "ruta": "skills/g03-multi-stage-dockerfile"}, {"name": "g03-planify-jira-ticket", "description": "Escribe, mejora o crea tickets de Jira del proyecto Planify con un paso a paso anclado al código real de los repos mobile (Flutter) y backend (Express + Prisma). Usar cuando se pide redactar, revisar o detallar un ticket, aunque solo se dé el número.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["flutter", "express", "prisma"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Mejorá el PLANIFY-40 con un paso a paso como el del 33.\"\n\n**Resultado:** La descripción completa del ticket en español, con Objetivo, Depende de (indicando si cada dependencia ya está mergeada), un Paso a paso donde cada paso dice qué se hace, para qué, en qué archivo real va y por qué no se puede saltear, Fuera de alcance y Criterios de aceptación. Antes de escribir en Jira, muestra el borrador y pide confirmación.", "ruta": "skills/g03-planify-jira-ticket"}, {"name": "g03-postgresql-best-practices", "description": "Buenas prácticas de PostgreSQL para diseño de esquemas, optimización de consultas y administración de la base. Usar al diseñar tablas, índices o consultas, o al investigar una consulta lenta.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend", "datos"], "fase": ["diseno", "desarrollo"], "tecnologias": ["postgresql"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Esta consulta de eventos por usuario tarda 3 segundos, ¿qué hago?\"\n\n**Resultado:** Un diagnóstico con EXPLAIN, los índices que conviene crear y la consulta reescrita, explicando por qué mejora.", "ruta": "skills/g03-postgresql-best-practices"}, {"name": "g03-prisma", "description": "Guía para usar Prisma ORM con operaciones tipadas sobre la base de datos y buen diseño de esquemas. Usar al modelar tablas en schema.prisma o al escribir consultas con Prisma Client.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend", "datos"], "fase": ["desarrollo"], "tecnologias": ["prisma", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá al esquema la relación entre eventos y participantes.\"\n\n**Resultado:** Los modelos de schema.prisma con la relación definida, la migración a generar y un ejemplo de consulta que trae un evento con sus participantes.", "ruta": "skills/g03-prisma"}, {"name": "g03-revisor-de-fichas", "description": "Revisa las fichas de skills, agentes y comandos del Catálogo Común de Agentes y propone mejoras de clasificación, descripción, ejemplo de uso y piezas relacionadas, explicando en qué se diferencian de las parecidas. Usar antes de abrir un PR al catálogo o al revisar uno.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["ia", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "otra"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá las fichas de las piezas que tengo en `skills/` antes de abrir el PR.\"\n\n**Resultado:** Una sección por pieza con lo que está bien, la clasificación corregida con su motivo (por ejemplo, \"falta `qa`: la skill genera casos de prueba\"), una description y un ejemplo de uso propuestos cuando los actuales son flojos, y las piezas parecidas de otros grupos con su diferencia. Después pregunta qué cambios aplicar y modifica solo la ficha y el ejemplo de las piezas elegidas.", "ruta": "skills/g03-revisor-de-fichas"}, {"name": "g03-status-incidents", "description": "Registra, actualiza y cierra los incidentes del reporte semanal del equipo a partir de evidencia real (bugs en Jira, CI fallido, hotfixes, exposiciones de seguridad). Usar cuando el PM pide anotar un incidente o completar la parte de incidentes del reporte.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["mantenimiento", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá el incidente del deploy que falló ayer.\"\n\n**Resultado:** Una fila nueva en la tabla de Incidentes con fecha, descripción, impacto, evidencia y estado, y el color de Incidentes de la semana actualizado.", "ruta": "skills/g03-status-incidents"}, {"name": "g03-status-risks", "description": "Detecta y escribe los riesgos de la semana en la planilla de estado del equipo, con su color, a partir de evidencia real (tickets vencidos, PRs abiertos, integraciones pendientes). Usar cuando el PM pide revisar o anotar los riesgos del reporte semanal.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá los riesgos de la semana.\"\n\n**Resultado:** La fila de Riesgos de la planilla con cada riesgo, su evidencia y el color de la semana, separando hechos de propuestas.", "ruta": "skills/g03-status-risks"}, {"name": "g03-status-schedule", "description": "Actualiza el cronograma de la planilla de estado semanal del equipo (estado, avance, fechas y comentarios por épica) a partir de evidencia real de Jira, git y PRs. Usar cuando el PM pide actualizar avances, fechas o atrasos de la semana.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Actualizá el cronograma de esta semana.\"\n\n**Resultado:** La pestaña del equipo en la planilla con el avance de cada épica, las fechas estimadas o reales y comentarios solo donde hay algo para alertar, todo respaldado por tickets, commits y PRs.", "ruta": "skills/g03-status-schedule"}, {"name": "g03-supertest-api-testing", "description": "Patrones para tests de integración HTTP de APIs Express con TypeScript usando Supertest, repositorios falsos en memoria y verificación de autorización (401 y 403). Usar al testear endpoints de un backend Express.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["express", "typescript", "supertest"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Escribí los tests de integración de GET /events/:id.\"\n\n**Resultado:** Tests con Supertest que cubren el caso exitoso, el recurso inexistente y los accesos sin token o sin permiso, usando un repositorio falso en memoria.", "ruta": "skills/g03-supertest-api-testing"}, {"name": "g04-arquitectura", "description": "Analiza decisiones de arquitectura de un proyecto y las deja como ADR: contexto, drivers, opciones comparadas con sus costos, decisión, riesgos y validación. Usar para una decisión técnica difícil de revertir, como una integración, un servicio nuevo o un cambio de estructura.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [], "area": ["backend", "documentacion"], "fase": ["diseno", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g15-product-adr-drafter"], "ejemplo": "**Pedido:** ¿Cómo hacemos el reporting diario de KPIs, con Vercel Cron o GitHub Actions?\n\n**Resultado:** Un ADR con el contexto, tres opciones comparadas según los mismos criterios, la decisión recomendada, los riesgos y cómo validarla, listo para revisar con el equipo.", "ruta": "skills/g04-arquitectura"}, {"name": "g04-benchmarking", "description": "Compara un producto o una funcionalidad con alternativas reales: matriz de capacidades con fuentes verificables y oportunidades concretas. Usar cuando se pide investigar la competencia, comparar apps del mercado o elegir entre herramientas.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [], "area": ["gestion", "diseno"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Hacé un benchmarking de apps de mantenimiento de vehículos para el recordatorio de kilometraje.\n\n**Resultado:** Una matriz de cinco apps con funciones, precio y fuentes, qué hace bien cada una y tres oportunidades para PitStop dentro del alcance del MVP.", "ruta": "skills/g04-benchmarking"}, {"name": "g04-branching", "description": "Define y aplica la estrategia de ramas de un equipo con tickets de Linear y PRs: nombres, base, rama por ticket, trabajo encadenado, conflictos y orden de merge. Usar al crear ramas, resolver conflictos, coordinar PRs dependientes o limpiar ramas viejas.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [], "area": ["devops", "gestion"], "fase": ["desarrollo", "revision"], "tecnologias": ["git"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Mi ticket depende de la PR de Juan, ¿de dónde saco la rama?\n\n**Resultado:** Revisa el estado de la PR, recomienda basarse en su rama o esperar el merge, da los comandos exactos y explica qué hacer cuando la otra PR se mergee.", "ruta": "skills/g04-branching"}, {"name": "g04-chequeo-de-kpis", "description": "Verifica que el reporting diario de KPIs de PitStop esté sano: workflows corridos, muestras, valores publicados en prod y cantidad mínima de KPIs válidos. Usar cuando se pregunta si los KPIs se están reportando bien o antes de una entrega.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["qa", "devops", "datos"], "fase": ["mantenimiento", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "supabase"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** ¿Se reportaron bien los KPIs esta semana?\n\n**Resultado:** Una tabla por día con KPIs válidos en prod, workflows fallidos y envíos faltantes o tardíos, indicando la evidencia y qué hay que corregir.", "ruta": "skills/g04-chequeo-de-kpis"}, {"name": "g04-commit-local-changes", "description": "Revisa los cambios locales de la rama, sincroniza la documentación del proyecto y crea un commit conciso y bien descripto en inglés. Usar cuando se pide commitear el trabajo actual.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}, {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}], "area": ["documentacion", "devops"], "fase": ["desarrollo"], "tecnologias": ["git"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Commiteá lo que tengo.\n\n**Resultado:** Revisa el diff, descarta archivos sensibles, actualiza la documentación si hace falta y crea el commit con un mensaje que explica el cambio.", "ruta": "skills/g04-commit-local-changes"}, {"name": "g04-cronograma", "description": "Arma o actualiza el cronograma de PitStop a partir de features.yaml y team.yaml: semanas de jueves a jueves, carga en SP contra la capacidad y dependencias. Usar cuando se pide el cronograma del proyecto, ver qué toca cada semana o detectar semanas sobrecargadas.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** ¿Cómo queda el cronograma hasta el cierre del Sprint 3?\n\n**Resultado:** Una tabla por semana con funcionalidades, SP planificados contra los 18 disponibles y dependencias, más las semanas sobrecargadas o vacías y las funcionalidades sin fecha.", "ruta": "skills/g04-cronograma"}, {"name": "g04-dependency-version-control", "description": "Controla las dependencias de un monorepo: decide si agregar una, revisa versiones y vulnerabilidades, y actualiza de a una con lockfile y checks. Usar al agregar o actualizar paquetes, al resolver conflictos de versiones o ante una alerta de seguridad.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [], "area": ["devops", "seguridad"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["nodejs"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-plan-actualizacion"], "ejemplo": "**Pedido:** ¿Podemos subir Prisma a la última versión?\n\n**Resultado:** Lee las notas de la versión, detalla los cambios que afectan al proyecto, sube el paquete con su lockfile, corre todos los checks y devuelve un resumen, o frena si encuentra una migración riesgosa.", "ruta": "skills/g04-dependency-version-control"}, {"name": "g04-desarrollo-ui-ux", "description": "Construye pantallas y componentes de PitStop a partir del design system y Base UI, resueltos para mobile y desktop y con todos sus estados. Usar al implementar o rediseñar interfaz; las convenciones de código generales están en la skill de frontend.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["frontend", "diseno"], "fase": ["diseno", "desarrollo"], "tecnologias": ["react", "tailwindcss", "typescript"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Hacé la pantalla de lista de deseos siguiendo el prototipo.\n\n**Resultado:** Implementa la pantalla con componentes y tokens existentes, en sus dos resoluciones y con estados vacío, de carga y de error, y la prueba en el navegador.", "ruta": "skills/g04-desarrollo-ui-ux"}, {"name": "g04-earned-value-presentacion", "description": "Concilia el Earned Value de PitStop (PV, EV, AC, SPI, CPI) con la historia real de Linear y el plan local, y prepara los números para presentarlos. Usar al actualizar project-plan/earned-value.yaml, reportar la performance del proyecto o armar la lámina de Earned Value.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [{"nombre": "Manuel Lostaló", "github": "ManuLosta"}], "area": ["gestion"], "fase": ["revision", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": ["g15-evm-calculator"], "ejemplo": "**Pedido:** Actualizá el Earned Value y dame los números para la presentación del viernes.\n\n**Resultado:** Actualiza la semana actual con evidencia de Linear, valida el archivo y entrega la tabla acumulada, el SPI y el CPI, las causas de los desvíos y los valores de AC que no tienen respaldo.", "ruta": "skills/g04-earned-value-presentacion"}, {"name": "g04-estructura-de-presentacion", "description": "Define la estructura de una presentación del proyecto PitStop: objetivo, audiencia, láminas, mensaje de cada una, tiempos y quién presenta. Usar cuando hay que preparar una entrega, un sprint review o la presentación final.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Armá la estructura de la presentación del Sprint 3, tenemos 15 minutos.\n\n**Resultado:** Una tabla de láminas con mensaje, contenido, fuente del dato, minutos y responsable, que suma 15 minutos e incluye el bloque de demo.", "ruta": "skills/g04-estructura-de-presentacion"}, {"name": "g04-feature-planning", "description": "Planifica e implementa funcionalidades, arreglos, refactors y cambios técnicos con un flujo interactivo de descubrimiento y aprobación, antes de escribir código. Usar al arrancar el desarrollo de una funcionalidad, con Plan Mode activo.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion", "backend", "frontend"], "fase": ["planificacion", "analisis", "desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Planifiquemos la lista de deseos antes de implementarla.\n\n**Resultado:** Hace preguntas para aclarar el alcance, propone un plan con los archivos afectados y espera la aprobación antes de empezar a implementar.", "ruta": "skills/g04-feature-planning"}, {"name": "g04-frontend-vite-react-typescript", "description": "Convenciones de desarrollo frontend para Vite + React + TypeScript del template del grupo. Aplicar siempre que se implementa o modifica una funcionalidad que toca el frontend.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["frontend"], "fase": ["desarrollo"], "tecnologias": ["react", "vite", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Agregá la pantalla de detalle de un vehículo.\n\n**Resultado:** Implementa la pantalla respetando la estructura de carpetas, el ruteo, el manejo de estado y las convenciones de React y TypeScript del proyecto.", "ruta": "skills/g04-frontend-vite-react-typescript"}, {"name": "g04-guion-de-demo", "description": "Escribe el guión paso a paso de una demo en vivo de PitStop, con datos preparados, qué mostrar y decir en cada paso y un plan B si algo falla. Usar antes de una demo, un sprint review o la presentación final.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion", "qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g15-demo-recorder"], "ejemplo": "**Pedido:** Armá el guión de la demo de 5 minutos para el viernes.\n\n**Resultado:** Los datos a preparar, una tabla de pasos con acción, frase y resultado esperado, una verificación previa en el ambiente real y un plan B para cada momento delicado.", "ruta": "skills/g04-guion-de-demo"}, {"name": "g04-guion-de-presentacion", "description": "Escribe el guión hablado de una presentación a partir de su estructura de láminas, por orador y con tiempos, en español natural. Usar cuando ya están definidas las láminas y hay que preparar qué dice cada integrante.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Escribí el guión de la presentación para los cuatro.\n\n**Resultado:** Un guión por lámina con orador, texto para decir, minutos y frase de pase al siguiente, ajustado al tiempo total con el conteo de palabras.", "ruta": "skills/g04-guion-de-presentacion"}, {"name": "g04-imagenes-para-ticket", "description": "Saca capturas de referencia de la pantalla correcta del prototipo en mobile y desktop y las adjunta al ticket de Linear sin tocar la descripción. Usar cuando un ticket de UI necesita su referencia visual o hay que agregarle imágenes.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Tomás Serra", "github": "TomasSerra"}, "colaboradores": [], "area": ["gestion", "diseno"], "fase": ["analisis", "planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Agregale las capturas del prototipo al ticket de la landing.\n\n**Resultado:** Saca las capturas de desktop y mobile, las adjunta al ticket como adjuntos y confirma que aparecen en Linear.", "ruta": "skills/g04-imagenes-para-ticket"}, {"name": "g04-infra-desarrollo", "description": "Configura y repara la infraestructura de desarrollo de un monorepo con Turborepo: Docker Compose, variables de entorno, scripts, hooks y CI de GitHub Actions, reutilizando lo que trae el template. Usar para problemas de entorno, onboarding o cambios en el pipeline de desarrollo.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [], "area": ["devops"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["turborepo", "docker", "github-actions", "prisma"], "herramientas": ["claude-code"], "requiere": ["github"], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** El CI falla al generar Prisma y a los devs nuevos no les levanta la base.\n\n**Resultado:** Reproduce los dos problemas, corrige la configuración, actualiza la documentación de setup y comprueba que el entorno arranca desde cero y que el CI pasa.", "ruta": "skills/g04-infra-desarrollo"}, {"name": "g04-load-testing", "description": "Prueba de carga de la API NestJS con el tráfico esperado para comprobar latencia p95 y tasa de errores, en un entorno local o de prueba. Usar cuando se pregunta si la API aguanta el uso previsto o antes de un release; para buscar el límite, usar stress testing.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["qa", "backend"], "fase": ["testing"], "tecnologias": ["nestjs", "k6"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": [], "ejemplo": "**Pedido:** Hacé un load test del listado de mantenimientos con 50 usuarios.\n\n**Resultado:** Un script de k6 reproducible, los resultados de p50, p95, errores y requests por segundo contra los umbrales, y el cuello de botella si no cumple.", "ruta": "skills/g04-load-testing"}, {"name": "g04-nestjs-prisma-backend-architecture", "description": "Reglas de arquitectura de la API NestJS + Prisma + PostgreSQL del template del grupo (Changuito/PitStop): capas controller-service-repository, convenciones de Prisma, migraciones y tests con Jest. Usar al escribir, revisar o refactorizar código de apps/api.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Martin Barreiro", "github": "martinbarreiroo"}, "colaboradores": [], "area": ["backend"], "fase": ["diseno", "desarrollo", "revision"], "tecnologias": ["nestjs", "prisma", "postgresql", "typescript", "jest"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Agregá el endpoint para registrar un mantenimiento siguiendo la arquitectura de la API.\n\n**Resultado:** Implementa el módulo con controller, service y repository separados, DTOs con class-validator, el modelo y la migración de Prisma y sus tests de Jest, respetando las reglas del proyecto.", "ruta": "skills/g04-nestjs-prisma-backend-architecture"}, {"name": "g04-pentesting", "description": "Prueba de seguridad autorizada contra la app propia corriendo en local o en un ambiente de prueba: acceso a recursos ajenos, tokens inválidos, entradas maliciosas y asignación masiva. Usar para comprobar en ejecución los controles de la API, solo con autorización del equipo.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [], "area": ["seguridad", "qa"], "fase": ["testing"], "tecnologias": ["nestjs", "firebase"], "herramientas": ["claude-code"], "requiere": [], "madurez": "experimental", "relacionados": ["g11-security-agent"], "ejemplo": "**Pedido:** Hacé un pentest de los endpoints de vehículos en local.\n\n**Resultado:** Un reporte con cada prueba, su request y respuesta como evidencia, severidad y arreglo, incluyendo los controles que resistieron y lo que quedó fuera de alcance.", "ruta": "skills/g04-pentesting"}, {"name": "g04-planeamiento-sprint-tickets", "description": "Elige qué funcionalidades del backlog de PitStop entran en la semana o el sprint según prioridad, fechas del cronograma y capacidad de 18 SP, sin crear los tickets todavía. Usar cuando se pide planificar la semana, el sprint o qué entra en el próximo corte.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Manuel Lostaló", "github": "ManuLosta"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["linear"], "madurez": "usado-en-proyecto", "relacionados": ["g11-planear-sprint"], "ejemplo": "**Pedido:** Planificá la semana que arranca el jueves 13.\n\n**Resultado:** El corte de funcionalidades de la semana hasta 18 SP, en orden de prioridad, con la fecha límite, lo que quedó afuera y por qué.", "ruta": "skills/g04-planeamiento-sprint-tickets"}, {"name": "g04-pr-review-ticket-scope", "description": "Revisión técnica de Pull Requests de GitHub contra el alcance del ticket de Linear que implementan, publicando solo comentarios inline Must fix y Should fix en español. Usar cuando el Tech Lead pide revisar PRs del equipo, corregir o limpiar comentarios fuera de alcance, o definir el orden de merge.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [{"nombre": "Martin Barreiro", "github": "martinbarreiroo"}], "area": ["qa", "gestion"], "fase": ["revision"], "tecnologias": ["agnostico", "git"], "herramientas": ["claude-code", "codex"], "requiere": ["github", "linear"], "madurez": "usado-en-proyecto", "relacionados": ["g07-code-review-tl"], "ejemplo": "**Pedido:** Revisá https://github.com/PitStop-Austral/pitstop-app/pull/9 contra PIT-29 y subí solo los must y should fix.\n\n**Resultado:** Lee el ticket en Linear, corre los checks en la rama, publica una review con los comentarios Must fix y Should fix en español sobre las líneas afectadas y deja en el chat el veredicto y los puntos que quedaron fuera del alcance.", "ruta": "skills/g04-pr-review-ticket-scope"}, {"name": "g04-pre-push-code-review", "description": "Revisa los cambios locales de git antes de pushear: bugs, casos borde, seguridad, reutilización, código innecesario y consistencia con el codebase. Usar cuando se pide una revisión previa al push o validar la calidad antes de commitear.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [{"nombre": "Tomás Serra", "github": "TomasSerra"}], "area": ["qa"], "fase": ["revision"], "tecnologias": ["agnostico", "git"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Hacé una revisión pre-push de mis cambios locales.\n\n**Resultado:** Analiza el diff local y devuelve los hallazgos ordenados por severidad, con archivo, motivo y arreglo sugerido, antes de que se suba el código.", "ruta": "skills/g04-pre-push-code-review"}, {"name": "g04-qa-acceptance-check", "description": "Verificación de QA de un Pull Request contra los criterios de aceptación de su ticket de Linear y la Definition of Done del equipo, corriendo la app y probando cada criterio, no solo compilando. Usar cuando se pide probar un PR, validar que un ticket está terminado o hacer QA antes del merge.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alexander-Kottner"}, "colaboradores": [{"nombre": "Martin Barreiro", "github": "martinbarreiroo"}], "area": ["qa"], "fase": ["testing", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["github", "linear"], "madurez": "experimental", "relacionados": ["g07-qa-acceptance", "g11-qa-con-capturas"], "ejemplo": "**Pedido:** Probá el PR 43 contra PIT-64 antes de que lo mergeemos.\n\n**Resultado:** Levanta la app en la rama del PR, recorre cada criterio de aceptación de la landing en desktop y mobile, corre build y tests y devuelve un checklist pasa/falla con evidencia y los defectos encontrados.", "ruta": "skills/g04-qa-acceptance-check"}, {"name": "g04-qa-seguridad", "description": "Revisión de seguridad del código de un PR o módulo de una app NestJS y React con Firebase Auth: autenticación, permisos por usuario, validación de entradas, secretos y exposición de datos. Usar para revisar un PR sensible o auditar un módulo sin atacar la app en ejecución.", "tipo": "skill", "grupo": "04", "autor": {"nombre": "Alexander Köttner", "github": "Alex
