<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Común de Agentes</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1a2130;--muted:#5b6577;--line:#dde1e8;--acc:#2e55c8;--soft:#e7ecfb;--on:#fff;
--tag:#8a5a00;--tagbg:#fbf1dc;--ok:#1f7a4d;--okbg:#e2f3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12161e;--card:#1a1f2a;--fg:#e4e8f0;--muted:#9aa4b6;--line:#2c3342;--acc:#8ea8ff;
--soft:#1f2a48;--on:#10141b;--tag:#f0c56a;--tagbg:#3a2f17;--ok:#6fd3a0;--okbg:#17342a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1160px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{margin:0;font-size:1.6rem}.m{color:var(--muted)}.s{font-size:14px}
nav{display:flex;gap:6px}nav a{text-decoration:none;color:var(--fg);padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}
nav a.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
a{color:var(--acc)}
input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.row b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:100px}
.chip{font:inherit;font-size:14px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.g{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}@media(min-width:880px){.g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.list{display:grid;gap:8px;align-content:start}
.c{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.c.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.n{font-family:ui-monospace,Consolas,monospace;font-weight:600;font-size:14px;word-break:break-word}
.t{display:inline-block;font-size:12px;padding:0 7px;border-radius:99px;background:var(--tagbg);color:var(--tag);margin:3px 3px 0 0}
.t.b{background:var(--soft);color:var(--acc)}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-self:start;position:sticky;top:12px;min-width:0}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:14.5px}dt{color:var(--muted)}dd{margin:0}
pre{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;font:14px/1.5 system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.st .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;white-space:nowrap}
td.r{text-align:right;font-variant-numeric:tabular-nums}tr.on td{background:var(--soft)}
.bar{width:110px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}.bar span.full{background:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--tagbg);color:var(--tag)}.pill.ok{background:var(--okbg);color:var(--ok)}
h2{font-size:1.15rem;margin:22px 0 8px}h3{font-size:1rem;margin:14px 0 6px}
ul.p{padding-left:1.1em;margin:4px 0}
</style></head><body><div class="w">
<header><div><h1>Catálogo Común de Agentes</h1><div class="m s" id="sub"></div></div>
<nav><a href="#explorar" id="tab-explorar">Explorador</a><a href="#avance" id="tab-avance">Avance por alumno</a></nav></header>
<main id="main"></main>
</div>
<script>
const P = [{"name": "g03-dart-add-unit-test", "description": "Escribe y organiza tests unitarios de funciones, métodos y clases Dart con package:test. Usar al crear lógica nueva o al corregir un bug, para que el código siga funcionando.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para la función que calcula cuánto debe cada participante.\"\n\n**Resultado:** Un archivo de tests con los casos normales y los bordes (cero participantes, montos con decimales) agrupados y nombrados con claridad.", "ruta": "skills/g03-dart-add-unit-test"}, {"name": "g03-dart-fix-runtime-errors", "description": "Encuentra y corrige errores en tiempo de ejecución de una app Dart o Flutter: obtiene el stack trace, ubica la línea que falla, aplica el arreglo y lo verifica con hot reload. Usar cuando la app tira una excepción mientras corre.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"La app se cierra al abrir el detalle de un evento, arreglalo.\"\n\n**Resultado:** La causa del error ubicada en el código, el arreglo aplicado y la confirmación de que el error ya no aparece después del hot reload.", "ruta": "skills/g03-dart-fix-runtime-errors"}, {"name": "g03-dart-resolve-package-conflicts", "description": "Guía para resolver conflictos de versiones de paquetes cuando pub get falla por dependencias incompatibles. Usar cuando no se pueden instalar las dependencias de un proyecto Dart o Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"pub get falla por un conflicto entre intl y flutter_localizations.\"\n\n**Resultado:** La causa del conflicto, las versiones compatibles a usar y el pubspec.yaml ajustado, con pub get funcionando.", "ruta": "skills/g03-dart-resolve-package-conflicts"}, {"name": "g03-dart-run-static-analysis", "description": "Ejecuta dart analyze para encontrar warnings y errores y aplica dart fix para corregir automáticamente los problemas de lint mecánicos. Usar durante el desarrollo y antes de hacer commit.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["desarrollo", "revision"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Dejá el proyecto sin warnings antes de abrir el PR.\"\n\n**Resultado:** El resultado de dart analyze, los arreglos automáticos aplicados con dart fix y la lista de problemas que hay que resolver a mano.", "ruta": "skills/g03-dart-run-static-analysis"}, {"name": "g03-express-project-structure-guidelines", "description": "Define la estructura de carpetas por recurso, la separación en capas (routes, controllers, services, repositories) y las convenciones de nombres para backends Express con TypeScript. Usar al crear un módulo nuevo o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend"], "fase": ["diseno", "desarrollo"], "tecnologias": ["express", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo la lógica para invitar participantes a un evento?\"\n\n**Resultado:** La ubicación de cada parte (ruta, controlador, servicio, repositorio) dentro del módulo correspondiente, con el motivo de cada decisión.", "ruta": "skills/g03-express-project-structure-guidelines"}, {"name": "g03-express-typescript", "description": "Guía para construir APIs con Express y TypeScript estricto: middlewares (asyncHandler, errorHandler), validación de requests con Zod y seguridad (CORS, Helmet). Usar al crear o revisar endpoints de un backend Express.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["express", "typescript", "zod"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el endpoint POST /events con validación del body.\"\n\n**Resultado:** El controlador, la validación con un esquema de Zod y el manejo de errores con los middlewares del proyecto, siguiendo las convenciones de la skill.", "ruta": "skills/g03-express-typescript"}, {"name": "g03-figma-inspect-design", "description": "Inspecciona frames de Figma, extrae medidas, espaciados, tipografías y colores, y los compara con la implementación en Flutter. Usar al revisar un link de diseño o verificar que una pantalla coincide con Figma.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["diseno", "mobile"], "fase": ["diseno", "revision"], "tecnologias": ["figma", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["figma"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿La pantalla de login coincide con el diseño de Figma?\"\n\n**Resultado:** Las diferencias encontradas entre el frame y el código (espaciados, tamaños de fuente, colores) con el valor esperado y el valor actual de cada una.", "ruta": "skills/g03-figma-inspect-design"}, {"name": "g03-flutter-add-widget-preview", "description": "Agrega previews interactivas de widgets Flutter con el sistema previews.dart para ver y probar componentes sin correr toda la app. Usar al crear componentes de UI nuevos o al cambiar pantallas existentes.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá una preview del componente de tarjeta de evento.\"\n\n**Resultado:** Una preview del componente con sus variantes principales (con y sin imagen, texto largo) lista para ver en el entorno de previews.", "ruta": "skills/g03-flutter-add-widget-preview"}, {"name": "g03-flutter-add-widget-test", "description": "Escribe tests de widgets Flutter con WidgetTester para verificar que un componente muestra los datos correctos y responde a interacciones (tocar, scrollear, escribir). Usar al validar el comportamiento de un widget concreto.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para el formulario de crear evento.\"\n\n**Resultado:** Un archivo de test que monta el widget, simula la carga de datos y el envío, y verifica los mensajes de error y el caso exitoso.", "ruta": "skills/g03-flutter-add-widget-test"}, {"name": "g03-flutter-apply-glassmorphism-design", "description": "Aplica un estilo glassmorphism (paneles translúcidos con desenfoque, profundidad y movimiento suave) a pantallas Flutter usando BackdropFilter y los tokens de diseño propios del proyecto. Usar cuando una pantalla o componente se ve genérico y tiene que verse más profesional.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["diseno", "mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la pantalla de detalle del evento se vea más pro.\"\n\n**Resultado:** La pantalla con superficies translúcidas, jerarquía visual y animaciones suaves construidas con los colores, radios, espaciados y tipografías del proyecto, sin inventar valores nuevos.", "ruta": "skills/g03-flutter-apply-glassmorphism-design"}, {"name": "g03-flutter-apply-material3-guidelines", "description": "Aplica las guías de Material Design 3 en apps Flutter: theming, esquemas de color dinámicos y uso correcto de componentes. Usar al diseñar o refactorizar pantallas y componentes de UI.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Pasá la pantalla de configuración a Material 3.\"\n\n**Resultado:** La pantalla con el ThemeData de Material 3, los componentes actualizados y los colores tomados del esquema del tema en lugar de valores fijos.", "ruta": "skills/g03-flutter-apply-material3-guidelines"}, {"name": "g03-flutter-build-responsive-layout", "description": "Construye layouts Flutter que se adaptan a distintos tamaños de pantalla con LayoutBuilder, MediaQuery y Expanded/Flexible. Usar cuando una pantalla tiene que verse bien en celular, tablet y escritorio.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "frontend"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la lista de eventos use dos columnas en tablet.\"\n\n**Resultado:** La pantalla reorganizada con LayoutBuilder: una columna en celular y dos en pantallas anchas, sin desbordes.", "ruta": "skills/g03-flutter-build-responsive-layout"}, {"name": "g03-flutter-fix-layout-issues", "description": "Corrige errores de layout en Flutter, como \"RenderFlex overflowed\" o \"unbounded height\", usando las herramientas MCP de Dart y Flutter. Usar cuando una pantalla muestra franjas de desborde o falla por restricciones de tamaño.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Me aparece \"RenderFlex overflowed by 42 pixels\" en la pantalla de perfil.\"\n\n**Resultado:** La causa del desborde identificada, el widget corregido (por ejemplo con Expanded o un scroll) y la verificación de que el error desapareció.", "ruta": "skills/g03-flutter-fix-layout-issues"}, {"name": "g03-flutter-project-structure-guidelines", "description": "Define la estructura de carpetas Feature-First, las capas con flujo de datos unidireccional y las convenciones de nombres para apps Flutter. Usar al crear una feature nueva o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo el repositorio y el notifier de la feature de invitaciones?\"\n\n**Resultado:** La ubicación de cada archivo dentro de la feature (data, domain, presentation) con el motivo, siguiendo la estructura del proyecto.", "ruta": "skills/g03-flutter-project-structure-guidelines"}, {"name": "g03-flutter-setup-localization", "description": "Configura la internacionalización de una app Flutter: dependencias flutter_localizations e intl, generate en pubspec.yaml y el archivo l10n.yaml. Usar al agregar soporte de varios idiomas a un proyecto Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Prepará la app para que esté en español y en inglés.\"\n\n**Resultado:** Las dependencias agregadas, l10n.yaml configurado, los archivos .arb iniciales y un ejemplo de cómo usar los textos traducidos en un widget.", "ruta": "skills/g03-flutter-setup-localization"}, {"name": "g03-javascript-typescript-vitest", "description": "Buenas prácticas para tests de JavaScript y TypeScript con Vitest: estructura, mocks con vi e imports explícitos, adaptadas a un backend que no usa globals. Usar al escribir o corregir tests con Vitest.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["vitest", "typescript", "javascript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Este test usa jest.fn() y falla, ¿cómo lo paso a Vitest?\"\n\n**Resultado:** El test reescrito con vi.fn(), los imports explícitos desde vitest y la explicación de cada cambio.", "ruta": "skills/g03-javascript-typescript-vitest"}, {"name": "g03-multi-stage-dockerfile", "description": "Crea Dockerfiles multi-stage optimizados para cualquier lenguaje o framework, separando la etapa de build de la imagen final. Usar al dockerizar un servicio o al reducir el tamaño de una imagen.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["devops"], "fase": ["despliegue"], "tecnologias": ["docker"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el Dockerfile del backend para producción.\"\n\n**Resultado:** Un Dockerfile con una etapa de build y una imagen final liviana que solo contiene lo necesario para correr, con la explicación de cada etapa.", "ruta": "skills/g03-multi-stage-dockerfile"}, {"name": "g03-planify-jira-ticket", "description": "Escribe, mejora o crea tickets de Jira del proyecto Planify con un paso a paso anclado al código real de los repos mobile (Flutter) y backend (Express + Prisma). Usar cuando se pide redactar, revisar o detallar un ticket, aunque solo se dé el número.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["flutter", "express", "prisma"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Mejorá el PLANIFY-40 con un paso a paso como el del 33.\"\n\n**Resultado:** La descripción completa del ticket en español, con Objetivo, Depende de (indicando si cada dependencia ya está mergeada), un Paso a paso donde cada paso dice qué se hace, para qué, en qué archivo real va y por qué no se puede saltear, Fuera de alcance y Criterios de aceptación. Antes de escribir en Jira, muestra el borrador y pide confirmación.", "ruta": "skills/g03-planify-jira-ticket"}, {"name": "g03-postgresql-best-practices", "description": "Buenas prácticas de PostgreSQL para diseño de esquemas, optimización de consultas y administración de la base. Usar al diseñar tablas, índices o consultas, o al investigar una consulta lenta.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend", "datos"], "fase": ["diseno", "desarrollo"], "tecnologias": ["postgresql"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Esta consulta de eventos por usuario tarda 3 segundos, ¿qué hago?\"\n\n**Resultado:** Un diagnóstico con EXPLAIN, los índices que conviene crear y la consulta reescrita, explicando por qué mejora.", "ruta": "skills/g03-postgresql-best-practices"}, {"name": "g03-prisma", "description": "Guía para usar Prisma ORM con operaciones tipadas sobre la base de datos y buen diseño de esquemas. Usar al modelar tablas en schema.prisma o al escribir consultas con Prisma Client.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend", "datos"], "fase": ["desarrollo"], "tecnologias": ["prisma", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá al esquema la relación entre eventos y participantes.\"\n\n**Resultado:** Los modelos de schema.prisma con la relación definida, la migración a generar y un ejemplo de consulta que trae un evento con sus participantes.", "ruta": "skills/g03-prisma"}, {"name": "g03-revisor-de-fichas", "description": "Revisa las fichas de skills, agentes y comandos del Catálogo Común de Agentes y propone mejoras de clasificación, descripción, ejemplo de uso y piezas relacionadas, explicando en qué se diferencian de las parecidas. Usar antes de abrir un PR al catálogo o al revisar uno.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["ia", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "otra"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá las fichas de las piezas que tengo en `skills/` antes de abrir el PR.\"\n\n**Resultado:** Una sección por pieza con lo que está bien, la clasificación corregida con su motivo (por ejemplo, \"falta `qa`: la skill genera casos de prueba\"), una description y un ejemplo de uso propuestos cuando los actuales son flojos, y las piezas parecidas de otros grupos con su diferencia. Después pregunta qué cambios aplicar y modifica solo la ficha y el ejemplo de las piezas elegidas.", "ruta": "skills/g03-revisor-de-fichas"}, {"name": "g03-status-incidents", "description": "Registra, actualiza y cierra los incidentes del reporte semanal del equipo a partir de evidencia real (bugs en Jira, CI fallido, hotfixes, exposiciones de seguridad). Usar cuando el PM pide anotar un incidente o completar la parte de incidentes del reporte.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["mantenimiento", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá el incidente del deploy que falló ayer.\"\n\n**Resultado:** Una fila nueva en la tabla de Incidentes con fecha, descripción, impacto, evidencia y estado, y el color de Incidentes de la semana actualizado.", "ruta": "skills/g03-status-incidents"}, {"name": "g03-status-risks", "description": "Detecta y escribe los riesgos de la semana en la planilla de estado del equipo, con su color, a partir de evidencia real (tickets vencidos, PRs abiertos, integraciones pendientes). Usar cuando el PM pide revisar o anotar los riesgos del reporte semanal.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá los riesgos de la semana.\"\n\n**Resultado:** La fila de Riesgos de la planilla con cada riesgo, su evidencia y el color de la semana, separando hechos de propuestas.", "ruta": "skills/g03-status-risks"}, {"name": "g03-status-schedule", "description": "Actualiza el cronograma de la planilla de estado semanal del equipo (estado, avance, fechas y comentarios por épica) a partir de evidencia real de Jira, git y PRs. Usar cuando el PM pide actualizar avances, fechas o atrasos de la semana.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Actualizá el cronograma de esta semana.\"\n\n**Resultado:** La pestaña del equipo en la planilla con el avance de cada épica, las fechas estimadas o reales y comentarios solo donde hay algo para alertar, todo respaldado por tickets, commits y PRs.", "ruta": "skills/g03-status-schedule"}, {"name": "g03-supertest-api-testing", "description": "Patrones para tests de integración HTTP de APIs Express con TypeScript usando Supertest, repositorios falsos en memoria y verificación de autorización (401 y 403). Usar al testear endpoints de un backend Express.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["express", "typescript", "supertest"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Escribí los tests de integración de GET /events/:id.\"\n\n**Resultado:** Tests con Supertest que cubren el caso exitoso, el recurso inexistente y los accesos sin token o sin permiso, usando un repositorio falso en memoria.", "ruta": "skills/g03-supertest-api-testing"}, {"name": "g07-code-review-tl", "description": "Code review riguroso de un PR fullstack como Tech Lead: valida el ticket de Jira, levanta el stack, corre build y tests, prueba la API y el flujo en Chrome (E2E) y devuelve comentarios accionables por severidad con archivo:línea. Usar cuando el TL tenga que revisar un PR antes de mergearlo.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["backend", "frontend", "qa"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github", "chrome"], "madurez": "usado-en-proyecto", "relacionados": ["g07-qa-acceptance", "g07-pr-jira-sync"], "ejemplo": "**Pedido:** Usá la skill g07-code-review-tl para revisar el PR #92 del ticket KEY-107 y probá la UI en http://localhost:5173.\n\n**Resultado:** Trae el ticket de Jira, revisa el diff, corre build, lint y tests, levanta el stack, prueba la API y el flujo en Chrome, y devuelve en el chat un reporte con veredicto, cumplimiento de criterios, resultados de ejecución y de UI, y comentarios por severidad con archivo:línea. No comenta en GitHub.", "ruta": "skills/g07-code-review-tl"}, {"name": "g07-delivery-digest", "description": "Publica en Discord los avisos de un equipo que entrega por ciclos usando el Due date de Jira (MCP), en dos modos: el día de entrega (qué vence hoy y qué quedó asignado para la próxima) y a mitad de ciclo (cómo vienen las tareas de la próxima entrega, con su riesgo). Usar desde una rutina programada o cuando el PM quiera ver o probar los avisos fuera de horario.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-ready-check"], "ejemplo": "**Pedido:** Corré el g07-delivery-digest en modo mitad de ciclo.\n\n**Resultado:** Calcula la próxima fecha de entrega, trae de Jira las tareas que vencen ese día (paginando hasta el final), las lista por developer con su marca de estado (✅/🔧/⚠️/🚫), resume en una línea cuántas están en riesgo y de quién, y publica el mensaje en Discord.", "ruta": "skills/g07-delivery-digest"}, {"name": "g07-pr-jira-sync", "description": "Cruza los PRs de GitHub con el estado de los tickets en Jira (MCP) y detecta inconsistencias de trazabilidad (tickets In Review sin PR, PRs mergeados con el ticket abierto, tickets Done con el PR abierto, PRs sin key, viejos o sin reviewer), con una acción concreta por hallazgo. Usar cuando el TL o el PM quiera verificar que el board refleja el código antes de una reunión, un cierre de semana o una entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["python"], "herramientas": ["claude-code"], "requiere": ["jira", "github"], "madurez": "usado-en-proyecto", "relacionados": ["g07-code-review-tl", "g07-release-notes", "g07-role-handoff"], "ejemplo": "**Pedido:** Cruzá los PRs con Jira antes de la reunión del jueves.\n\n**Resultado:** Corre pr_snapshot.py para sacar el estado de los PRs, consulta los tickets activos y cerrados en Jira, aplica las reglas R1 a R9 y devuelve un reporte por severidad con una acción concreta y con dueño por cada inconsistencia. No mueve tickets ni comenta en GitHub.", "ruta": "skills/g07-pr-jira-sync"}, {"name": "g07-ready-check", "description": "Audita los tickets de Jira (MCP) que el equipo está por empezar contra una Definition of Ready configurable (user story, criterios de aceptación verificables, dueño, fecha, épica, contrato de API y dependencias resueltas a tiempo) y devuelve por ticket qué falta y la corrección propuesta, más las cadenas de bloqueo que ponen en riesgo una entrega. Usar antes del planning o cuando el PO o QA quiera saber si lo comprometido está listo para arrancar.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "qa"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "experimental", "relacionados": ["g07-qa-acceptance", "g07-delivery-digest", "g07-role-handoff"], "ejemplo": "**Pedido:** Antes del planning, revisá si los tickets de la próxima entrega están listos para arrancar.\n\n**Resultado:** Trae de Jira los tickets To Do de las dos próximas entregas y sus bloqueantes, los evalúa contra la Definition of Ready de config.md, marca cada uno 🟢/🟡/🔴 con lo que falta y la corrección propuesta (por ejemplo, criterios vagos reescritos en Gherkin), y muestra las cadenas de bloqueo y dependencias no linkeadas que ponen en riesgo una entrega. Solo comenta en Jira si le confirmás.", "ruta": "skills/g07-ready-check"}, {"name": "g07-release-notes", "description": "Genera las release notes de una entrega a partir de los tickets Done en Jira (MCP) y los PRs mergeados en GitHub, agrupadas por épica, en lenguaje de usuario y con lo que quedó pendiente al final. Usar cuando el PO quiera comunicar qué hay de nuevo en el producto a usuarios, stakeholders o la cátedra después de una entrega o un sprint.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["despliegue"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-pr-jira-sync", "g07-delivery-digest"], "ejemplo": "**Pedido:** Armame las release notes de la entrega del 29/10.\n\n**Resultado:** Busca los tickets Done con esa due date, los confirma contra los PRs mergeados, y escribe las notas en lenguaje de usuario agrupadas por épica, con lo más destacado, 'Bajo el capó', lo que quedó pendiente y una verificación interna; las manda a Discord solo si confirmás.", "ruta": "skills/g07-release-notes"}, {"name": "g07-role-handoff", "description": "Arma el documento de traspaso de un rol del equipo (PM, TL, QA o PO) para quien lo asume, con el estado real de Jira (MCP) y GitHub, los bloqueos vivos, las rutinas del rol y los acuerdos, personas y accesos que solo conoce quien se va. Usar cuando los roles roten y alguien tenga que tomar la posta sin perder contexto.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion", "mantenimiento"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "github"], "madurez": "experimental", "relacionados": ["g07-pr-jira-sync", "g07-sprint-status-report", "g07-ready-check"], "ejemplo": "**Pedido:** Armá el handoff de TL: me voy yo (Marco) y lo asume Denise desde hoy.\n\n**Resultado:** Trae de Jira las dos próximas entregas y los bloqueos vivos, cruza los tickets con los PRs abiertos y te pregunta los acuerdos, las personas y los accesos que no están escritos. Devuelve un documento dirigido a Denise con lo primero que tiene que hacer, las entregas con su riesgo, los PRs que necesitan acción, lo propio del rol y lo que no se pudo verificar. No mueve tickets ni comenta en GitHub.", "ruta": "skills/g07-role-handoff"}, {"name": "g07-sprint-retro", "description": "Genera la retro de un sprint cerrado desde Jira (MCP), con lo completado vs. lo planificado, las issues arrastradas, las señales de bloqueo y acciones para el próximo sprint, y la envía al canal de Discord del equipo. Usar cuando el PM cierre un sprint y necesite armar la retro o un resumen para la cátedra.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-weekly-process-checklist"], "ejemplo": "**Pedido:** Hacé la retro del Sprint 2.\n\n**Resultado:** Verifica en Jira que el sprint esté cerrado, separa lo completado de lo no completado (nunca empezado vs. a mitad), detecta issues arrastradas y señales de bloqueo, y arma una agenda de retro con acciones atadas a issues concretas; lo muestra en el chat y lo envía a Discord.", "ruta": "skills/g07-sprint-retro"}, {"name": "g07-sprint-status-report", "description": "Genera el reporte de estado del sprint en curso a partir de Jira en vivo (MCP) y las novedades del equipo que pegue el PM (standups, bloqueos de Discord), detectando bloqueos, tareas estancadas o sin asignar y desbalance de carga, y lo envía al canal de Discord del equipo. Usar cuando el PM necesite un panorama del avance antes de una reunión, un standup o una entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "discord"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-retro", "g07-delivery-digest", "g07-weekly-process-checklist"], "ejemplo": "**Pedido:** Armame el reporte de estado del sprint. Novedades del standup: Marco está bloqueado esperando el endpoint de login.\n\n**Resultado:** Trae el sprint activo de Jira, arma el reporte en cinco secciones (resumen con semáforo, estado por developer, bloqueos, tareas sin asignar o estancadas y recomendaciones atadas a issues concretas), lo muestra en el chat y lo envía al canal de Discord si hay webhook configurado.", "ruta": "skills/g07-sprint-status-report"}, {"name": "g07-weekly-process-checklist", "description": "Mantiene un único Google Doc que responde semana a semana las preguntas de proceso que pide la cátedra (organización del trabajo, avance visible, decisiones, riesgos y seguimiento semanal), usando Jira en vivo (MCP) para lo verificable y pidiéndole al PM las decisiones de la semana. Usar cuando el PM tenga que preparar o actualizar la evidencia de proceso para la clase o la entrega.", "tipo": "skill", "grupo": "07", "autor": {"nombre": "Josefina Sapag", "github": "jmsapag"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code"], "requiere": ["jira", "google-drive"], "madurez": "usado-en-proyecto", "relacionados": ["g07-sprint-status-report", "g07-sprint-retro"], "ejemplo": "**Pedido:** Actualizá el documento de proceso de esta semana. Decisión: usamos JWT en vez de sesiones; participaron Franco y Valentina.\n\n**Resultado:** Lee el Google Doc existente, trae de Jira el sprint activo y los riesgos vivos, agrega al final una entrada 'Semana del DD/MM' con Organización, Avance, Decisiones y Riesgos, te la muestra y reescribe el documento completo sin tocar las semanas anteriores.", "ruta": "skills/g07-weekly-process-checklist"}, {"name": "g08-align-problem-with-agent", "description": "Analiza una tarea o requerimiento complejo, busca el agente especializado más idóneo en el catálogo y genera un prompt optimizado para su ejecución. Usar antes de despachar tareas a subagentes.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["ia", "gestion"], "fase": ["planificacion"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Tengo que auditar la seguridad de las reglas de Firestore, ¿qué agente uso y con qué prompt?\n\n**Resultado:** Recomendación de g08-firestore-rules-data-architect con un prompt listo para ejecutar indicando alcance y restricciones.", "ruta": "skills/g08-align-problem-with-agent"}, {"name": "g08-backend-test-setup", "description": "Configura, valida y prepara la infraestructura de testing del backend con Jest, TypeScript y Firebase Emulator Suite. Usar para inicializar o reparar el entorno de pruebas del backend.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["typescript", "jest", "firebase"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-backend-test-engineer", "g08-backend-tester"], "ejemplo": "**Pedido:** Configurá el entorno de testing unitario y emuladores para Cloud Functions con Jest.\n\n**Resultado:** La configuración de jest.config.cjs, tsconfig.test.json, setup.ts para Firebase Emulator y un test mínimo de sanidad ejecutándose exitosamente.", "ruta": "skills/g08-backend-test-setup"}, {"name": "g08-backend-tester", "description": "Diseña, crea y ejecuta tests unitarios y de integración para la lógica de negocio del backend con Jest y Firebase Emulators. Usar al escribir nuevas Cloud Functions o endpoints para asegurar cobertura.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["typescript", "jest", "firebase"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-backend-test-engineer", "g08-backend-test-setup"], "ejemplo": "**Pedido:** Creá los tests unitarios para el servicio de cálculo de promedios de exámenes.\n\n**Resultado:** Suite completa en Jest con mocks aislados de repositorios Firestore y casos de prueba para entradas válidas y condiciones de borde.", "ruta": "skills/g08-backend-tester"}, {"name": "g08-classify-vulnerability", "description": "Clasifica vulnerabilidades de seguridad en código fuente mediante tablas de decisión objetivas y mapeo a identificadores MITRE CWE. Usar al auditar código para calificar severidad y dificultad de remediación.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, le para estados de corrección (aprobado, desaprobado, pendiente).\n\n**Resultado:** Tokens de color en TypeScript con verificación de contraste WCAG AA sobre fondos claros y oscuros.", "ruta": "skills/g08-define-color-palette"}, {"name": "g08-plan-with-user-input", "description": "Estructura un proceso interactivo de consultas para alinear alcance, restricciones y preferencias con el usuario antes de redactar un plan de ejecución. Usar al abordar requerimientos ambiguos.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Hilario Lagos", "github": "HiluLagos"}, "colaboradores": [], "area": ["gestion", "documentacion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Ayudame a planificar la funcionalidad de exportación de notas a PDF.\n\n**Resultado:** Batería de preguntas sobre formato, datos a incluir y permisos de rol, seguida del plan de desarrollo consensuado.", "ruta": "skills/g08-plan-with-user-input"}, {"name": "g08-pr-feedback-generator", "description": "Genera feedback estructurado y pedagógico en Markdown para revisiones de Pull Requests en GitHub. Usar al revisar PRs para explicar problemas detectados y sugerir soluciones sin dar código directo.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["qa", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Generá el feedback para el PR #42 señalando que faltan validaciones en el controlador.\n\n**Resultado:** Un comentario formateado para GitHub en Markdown con resumen de hallazgos, explicación pedagógica del riesgo y pistas claras para resolverlo.", "ruta": "skills/g08-pr-feedback-generator"}, {"name": "g08-qa-ticket-reviewer", "description": "Revisa tickets de desarrollo y sus PRs asociados desde la perspectiva de QA Lead, evaluando cumplimiento de requerimientos, criterios de aceptación y calidad. Usar antes de aprobar el paso a testing.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Tomas Bernardez", "github": "Tomibernardez04"}, "colaboradores": [], "area": ["qa", "gestion"], "fase": ["revision", "testing"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": ["g08-ticket-creator", "g08-ticket-creator-backend", "g08-ticket-creator-frontend"], "ejemplo": "**Pedido:** Revisá si el PR #15 cumple con todos los criterios de aceptación del ticket backend_054.\n\n**Resultado:** Informe de revisión que compara cada criterio del ticket con el código implementado, destacando casos borde no cubiertos y dando el veredicto de aprobación.", "ruta": "skills/g08-qa-ticket-reviewer"}, {"name": "g08-scaffold-component", "description": "Porta o construye componentes de UI en la app frontend a partir del Design System y Storybook, integrando paso pedagógico explicativo. Usar al incorporar elementos visuales a las vistas.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["frontend", "diseno"], "fase": ["desarrollo"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": ["g08-ticket-creator-frontend"], "ejemplo": "**Pedido:** Portá el componente ButtonGroup desde el design system a la aplicación frontend.\n\n**Resultado:** Componente creado con TypeScript estricto, variantes tipadas y explicación pedagógica de su integración.", "ruta": "skills/g08-scaffold-component"}, {"name": "g08-scaffold-page", "description": "Crea rutas y vistas de página en el frontend React siguiendo las convenciones de enrutador, layout y protección por roles. Usar al crear nuevas pantallas de la aplicación.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["frontend"], "fase": ["desarrollo"], "tecnologias": ["typescript", "react"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Creá la estructura de la página /exams/:id/grading con protección para rol profesor.\n\n**Resultado:** Ruta configurada con su componente de vista, guarda de autenticación y layout base listo para poblar.", "ruta": "skills/g08-scaffold-page"}, {"name": "g08-scaffold-resource", "description": "Crea recursos REST completos en el backend con ruta, controlador, servicio y repositorio Firestore, con explicación de cada capa. Usar al exponer una nueva entidad en la API.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["typescript", "express", "firestore"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Scaffoldeá el recurso REST para gestión de comentarios de retroalimentación.\n\n**Resultado:** Estructura completa de 4 capas creada con inyección de dependencias y contratos tipados.", "ruta": "skills/g08-scaffold-resource"}, {"name": "g08-teach", "description": "Guía explicaciones pedagógicas estructuradas sobre conceptos de desarrollo web, backend, frontend y arquitectura para desarrolladores junior. Usar cuando se solicita comprender el porqué de una solución.", "tipo": "skill", "grupo": "08", "autor": {"nombre": "Ezequiel Rickert", "github": "ezequielrickert"}, "colaboradores": [], "area": ["documentacion", "ia"], "fase": ["analisis", "desarrollo"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "cursor"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** Explicame paso a paso cómo funciona la cola asíncrona de Cloud Tasks para procesar correcciones.\n\n**Resultado:** Explicación conceptual con analogías, diagrama de flujo del ciclo de vida y puntos clave de manejo de idempotencia.", "ruta": "skills/g08-teach"}, {"name": "g14-ponerse-en-tema", "description": "Usar cuando alguien pregunta dónde está algo en el código de VaiVen, cómo funciona hoy una parte de la app o del motor, qué tiene que saber para trabajar en un área, o arranca un ticket. Contesta la pregunta y nada más; no compara el kit contra el código. Necesita que el repo tenga mapas del código (docs/codigo/frontend.md y docs/codigo/datos-y-motor.md) que indiquen qué archivo cubre cada parte.", "tipo": "skill", "grupo": "14", "autor": {"nombre": "Elías Ballesteros", "github": "Elias85974"}, "colaboradores": [], "area": ["frontend", "backend", "documentacion"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["supabase", "n8n"], "herramientas": ["claude-code", "otra"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde está la función que elige la imagen de portada de una publicación?\"\n**Resultado:** Abre el mapa `frontend.md`, va al archivo que nombra la fila y contesta con `ruta:línea` y dos frases: qué hace la función y qué componentes la usan.", "ruta": "skills/g14-ponerse-en-tema"}, {"name": "g03-express-backend-agent", "description": "Agente mentor de backend con Node.js, Express y TypeScript para estudiantes: guía con Clean Architecture, Prisma, PostgreSQL, autenticación con JWT de Cognito y seguridad, sin generar archivos completos. Usar al desarrollar o revisar código del backend.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [{"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend"], "fase": ["desarrollo", "revision"], "tecnologias": ["express", "typescript", "prisma", "postgresql"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Cómo implemento el servicio para unirse a un evento?\"\n\n**Resultado:** Una guía paso a paso con preguntas, la capa donde va cada parte y fragmentos de referencia, sin entregar el archivo completo resuelto.", "ruta": "agentes/g03-express-backend-agent"}, {"name": "g03-express-pr-mentor", "description": "Agente mentor que prepara un PR del repo backend (Express) antes de abrirlo: atomicidad de commits, descripción del PR, resolución de conflictos, nombre de rama y chequeos de Express. Usar sobre la propia rama, antes de pedir revisión.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase": ["revision"], "tecnologias": ["express", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Mi rama del endpoint de eventos está lista para el PR?\"\n\n**Resultado:** Una lista de lo que falta antes de abrir el PR (commits mezclados, descripción incompleta, lint o tests pendientes) con pistas para resolverlo.", "ruta": "agentes/g03-express-pr-mentor"}, {"name": "g03-express-pr-reviewer", "description": "Agente que revisa un PR ya abierto del repo backend (Express) para el PM o líder antes de aprobarlo: higiene de commits y descripción, resolución de conflictos, nombre de rama y calidad del código Express. Usar al revisar PRs de backend.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase": ["revision"], "tecnologias": ["express", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": ["github"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá el PR 18 de planify-backend antes de que lo apruebe.\"\n\n**Resultado:** Un veredicto (aprobar o pedir cambios) con los problemas encontrados por categoría y una recomendación concreta para cada uno.", "ruta": "agentes/g03-express-pr-reviewer"}, {"name": "g03-express-security-agent", "description": "Agente auditor de seguridad para el backend con Express, TypeScript, Prisma y PostgreSQL: cifrado en tránsito y en reposo, superficie de ataque y checklist alineado con OWASP, con enfoque pedagógico. Usar antes de entregar endpoints que manejan datos sensibles.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "seguridad"], "fase": ["revision"], "tecnologias": ["express", "typescript", "prisma", "postgresql"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Auditá la seguridad del endpoint de login.\"\n\n**Resultado:** Los riesgos encontrados según el checklist (por ejemplo, falta de rate limiting o errores que filtran información), por qué importan y qué revisar para corregirlos.", "ruta": "agentes/g03-express-security-agent"}, {"name": "g03-express-test-builder-agent", "description": "Agente de QA que diseña, escribe y ejecuta suites completas de tests unitarios y de integración HTTP para APIs Express con TypeScript, usando Vitest, Supertest y repositorios falsos en memoria. Usar cuando se necesita cobertura de tests escrita y verificada.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase" x"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Escribí la suite de tests de la feature de invitaciones.\"\n\n**Resultado:** Los archivos de test creados y ejecutados, con el resultado de la corrida y los casos cubiertos.", "ruta": "agentes/g03-flutter-test-builder-agent"}, {"name": "g03-flutter-testing-agent", "description": "Agente mentor de testing en Flutter y Dart: guía a estudiantes para escribir tests unitarios, de notifiers y de widgets con flutter_test y repositorios falsos, sin escribir los tests por ellos. Usar al aprender o revisar tests de la app mobile.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Cómo testeo el notifier que carga los eventos?\"\n\n**Resultado:** Una guía con los casos a cubrir, cómo armar el repositorio falso y la estructura del test, dejando la implementación al estudiante.", "ruta": "agentes/g03-flutter-testing-agent"}, {"name": "g03-pm-po-agent", "description": "Agente de Product Owner consultivo que evalúa si una historia o funcionalidad propuesta aporta al MVP definido en el Project Charter, sin decidir el alcance por el equipo. Usar cuando aparece un pedido nuevo o vago y hay que ver dónde encaja.", "tipo": "agente", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Agregamos chat function ruta(){const h=decodeURIComponent(location.hash.slice(1));const i=h.indexOf("/");
  return i<0?{v:h||"explorar",id:null}:{v:h.slice(0,i),id:h.slice(i+1)}}
function render(){const r=ruta();const av=r.v==="avance"||r.v==="alumno";
