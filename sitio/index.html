<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Común de Agentes</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1a2130;--muted:#5b6577;--line:#dde1e8;--acc:#2e55c8;--soft:#e7ecfb;--on:#fff;
--tag:#8a5a00;--tagbg:#fbf1dc;--ok:#1f7a4d;--okbg:#e2f3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12161e;--card:#1a1f2a;--fg:#e4e8f0;--muted:#9aa4b6;--line:#2c3342;--acc:#8ea8ff;
--soft:#1f2a48;--on:#10141b;--tag:#f0c56a;--tagbg:#3a2f17;--ok:#6fd3a0;--okbg:#17342a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1160px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{margin:0;font-size:1.6rem}.m{color:var(--muted)}.s{font-size:14px}
nav{display:flex;gap:6px}nav a{text-decoration:none;color:var(--fg);padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}
nav a.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
a{color:var(--acc)}
input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.row b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:100px}
.chip{font:inherit;font-size:14px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.g{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}@media(min-width:880px){.g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.list{display:grid;gap:8px;align-content:start}
.c{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.c.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.n{font-family:ui-monospace,Consolas,monospace;font-weight:600;font-size:14px;word-break:break-word}
.t{display:inline-block;font-size:12px;padding:0 7px;border-radius:99px;background:var(--tagbg);color:var(--tag);margin:3px 3px 0 0}
.t.b{background:var(--soft);color:var(--acc)}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-self:start;position:sticky;top:12px;min-width:0}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:14.5px}dt{color:var(--muted)}dd{margin:0}
pre{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;font:14px/1.5 system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.st .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;white-space:nowrap}
td.r{text-align:right;font-variant-numeric:tabular-nums}tr.on td{background:var(--soft)}
.bar{width:110px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}.bar span.full{background:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--tagbg);color:var(--tag)}.pill.ok{background:var(--okbg);color:var(--ok)}
h2{font-size:1.15rem;margin:22px 0 8px}h3{font-size:1rem;margin:14px 0 6px}
ul.p{padding-left:1.1em;margin:4px 0}
</style></head><body><div class="w">
<header><div><h1>Catálogo Común de Agentes</h1><div class="m s" id="sub"></div></div>
<nav><a href="#explorar" id="tab-explorar">Explorador</a><a href="#avance" id="tab-avance">Avance por alumno</a></nav></header>
<main id="main"></main>
</div>
<script>
const P = [{"name": "g03-dart-add-unit-test", "description": "Escribe y organiza tests unitarios de funciones, métodos y clases Dart con package:test. Usar al crear lógica nueva o al corregir un bug, para que el código siga funcionando.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para la función que calcula cuánto debe cada participante.\"\n\n**Resultado:** Un archivo de tests con los casos normales y los bordes (cero participantes, montos con decimales) agrupados y nombrados con claridad.", "ruta": "skills/g03-dart-add-unit-test"}, {"name": "g03-dart-fix-runtime-errors", "description": "Encuentra y corrige errores en tiempo de ejecución de una app Dart o Flutter: obtiene el stack trace, ubica la línea que falla, aplica el arreglo y lo verifica con hot reload. Usar cuando la app tira una excepción mientras corre.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"La app se cierra al abrir el detalle de un evento, arreglalo.\"\n\n**Resultado:** La causa del error ubicada en el código, el arreglo aplicado y la confirmación de que el error ya no aparece después del hot reload.", "ruta": "skills/g03-dart-fix-runtime-errors"}, {"name": "g03-dart-resolve-package-conflicts", "description": "Guía para resolver conflictos de versiones de paquetes cuando pub get falla por dependencias incompatibles. Usar cuando no se pueden instalar las dependencias de un proyecto Dart o Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["dart", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"pub get falla por un conflicto entre intl y flutter_localizations.\"\n\n**Resultado:** La causa del conflicto, las versiones compatibles a usar y el pubspec.yaml ajustado, con pub get funcionando.", "ruta": "skills/g03-dart-resolve-package-conflicts"}, {"name": "g03-dart-run-static-analysis", "description": "Ejecuta dart analyze para encontrar warnings y errores y aplica dart fix para corregir automáticamente los problemas de lint mecánicos. Usar durante el desarrollo y antes de hacer commit.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "qa"], "fase": ["desarrollo", "revision"], "tecnologias": ["dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Dejá el proyecto sin warnings antes de abrir el PR.\"\n\n**Resultado:** El resultado de dart analyze, los arreglos automáticos aplicados con dart fix y la lista de problemas que hay que resolver a mano.", "ruta": "skills/g03-dart-run-static-analysis"}, {"name": "g03-express-project-structure-guidelines", "description": "Define la estructura de carpetas por recurso, la separación en capas (routes, controllers, services, repositories) y las convenciones de nombres para backends Express con TypeScript. Usar al crear un módulo nuevo o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend"], "fase": ["diseno", "desarrollo"], "tecnologias": ["express", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo la lógica para invitar participantes a un evento?\"\n\n**Resultado:** La ubicación de cada parte (ruta, controlador, servicio, repositorio) dentro del módulo correspondiente, con el motivo de cada decisión.", "ruta": "skills/g03-express-project-structure-guidelines"}, {"name": "g03-express-typescript", "description": "Guía para construir APIs con Express y TypeScript estricto: middlewares (asyncHandler, errorHandler), validación de requests con Zod y seguridad (CORS, Helmet). Usar al crear o revisar endpoints de un backend Express.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend"], "fase": ["desarrollo"], "tecnologias": ["express", "typescript", "zod"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el endpoint POST /events con validación del body.\"\n\n**Resultado:** El controlador, la validación con un esquema de Zod y el manejo de errores con los middlewares del proyecto, siguiendo las convenciones de la skill.", "ruta": "skills/g03-express-typescript"}, {"name": "g03-figma-inspect-design", "description": "Inspecciona frames de Figma, extrae medidas, espaciados, tipografías y colores, y los compara con la implementación en Flutter. Usar al revisar un link de diseño o verificar que una pantalla coincide con Figma.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["diseno", "mobile"], "fase": ["diseno", "revision"], "tecnologias": ["figma", "flutter"], "herramientas": ["claude-code", "codex"], "requiere": ["figma"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿La pantalla de login coincide con el diseño de Figma?\"\n\n**Resultado:** Las diferencias encontradas entre el frame y el código (espaciados, tamaños de fuente, colores) con el valor esperado y el valor actual de cada una.", "ruta": "skills/g03-figma-inspect-design"}, {"name": "g03-flutter-add-widget-preview", "description": "Agrega previews interactivas de widgets Flutter con el sistema previews.dart para ver y probar componentes sin correr toda la app. Usar al crear componentes de UI nuevos o al cambiar pantallas existentes.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá una preview del componente de tarjeta de evento.\"\n\n**Resultado:** Una preview del componente con sus variantes principales (con y sin imagen, texto largo) lista para ver en el entorno de previews.", "ruta": "skills/g03-flutter-add-widget-preview"}, {"name": "g03-flutter-add-widget-test", "description": "Escribe tests de widgets Flutter con WidgetTester para verificar que un componente muestra los datos correctos y responde a interacciones (tocar, scrollear, escribir). Usar al validar el comportamiento de un widget concreto.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "qa"], "fase": ["testing"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá tests para el formulario de crear evento.\"\n\n**Resultado:** Un archivo de test que monta el widget, simula la carga de datos y el envío, y verifica los mensajes de error y el caso exitoso.", "ruta": "skills/g03-flutter-add-widget-test"}, {"name": "g03-flutter-apply-glassmorphism-design", "description": "Aplica un estilo glassmorphism (paneles translúcidos con desenfoque, profundidad y movimiento suave) a pantallas Flutter usando BackdropFilter y los tokens de diseño propios del proyecto. Usar cuando una pantalla o componente se ve genérico y tiene que verse más profesional.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["diseno", "mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la pantalla de detalle del evento se vea más pro.\"\n\n**Resultado:** La pantalla con superficies translúcidas, jerarquía visual y animaciones suaves construidas con los colores, radios, espaciados y tipografías del proyecto, sin inventar valores nuevos.", "ruta": "skills/g03-flutter-apply-glassmorphism-design"}, {"name": "g03-flutter-apply-material3-guidelines", "description": "Aplica las guías de Material Design 3 en apps Flutter: theming, esquemas de color dinámicos y uso correcto de componentes. Usar al diseñar o refactorizar pantallas y componentes de UI.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile", "diseno"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Pasá la pantalla de configuración a Material 3.\"\n\n**Resultado:** La pantalla con el ThemeData de Material 3, los componentes actualizados y los colores tomados del esquema del tema en lugar de valores fijos.", "ruta": "skills/g03-flutter-apply-material3-guidelines"}, {"name": "g03-flutter-build-responsive-layout", "description": "Construye layouts Flutter que se adaptan a distintos tamaños de pantalla con LayoutBuilder, MediaQuery y Expanded/Flexible. Usar cuando una pantalla tiene que verse bien en celular, tablet y escritorio.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile", "frontend"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Hacé que la lista de eventos use dos columnas en tablet.\"\n\n**Resultado:** La pantalla reorganizada con LayoutBuilder: una columna en celular y dos en pantallas anchas, sin desbordes.", "ruta": "skills/g03-flutter-build-responsive-layout"}, {"name": "g03-flutter-fix-layout-issues", "description": "Corrige errores de layout en Flutter, como \"RenderFlex overflowed\" o \"unbounded height\", usando las herramientas MCP de Dart y Flutter. Usar cuando una pantalla muestra franjas de desborde o falla por restricciones de tamaño.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo", "mantenimiento"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": ["dart-mcp"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Me aparece \"RenderFlex overflowed by 42 pixels\" en la pantalla de perfil.\"\n\n**Resultado:** La causa del desborde identificada, el widget corregido (por ejemplo con Expanded o un scroll) y la verificación de que el error desapareció.", "ruta": "skills/g03-flutter-fix-layout-issues"}, {"name": "g03-flutter-project-structure-guidelines", "description": "Define la estructura de carpetas Feature-First, las capas con flujo de datos unidireccional y las convenciones de nombres para apps Flutter. Usar al crear una feature nueva o decidir dónde va un archivo.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Lautaro German Reinoso", "github": "LautiGR116"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["mobile"], "fase": ["diseno", "desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"¿Dónde pongo el repositorio y el notifier de la feature de invitaciones?\"\n\n**Resultado:** La ubicación de cada archivo dentro de la feature (data, domain, presentation) con el motivo, siguiendo la estructura del proyecto.", "ruta": "skills/g03-flutter-project-structure-guidelines"}, {"name": "g03-flutter-setup-localization", "description": "Configura la internacionalización de una app Flutter: dependencias flutter_localizations e intl, generate en pubspec.yaml y el archivo l10n.yaml. Usar al agregar soporte de varios idiomas a un proyecto Flutter.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["mobile"], "fase": ["desarrollo"], "tecnologias": ["flutter", "dart"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Prepará la app para que esté en español y en inglés.\"\n\n**Resultado:** Las dependencias agregadas, l10n.yaml configurado, los archivos .arb iniciales y un ejemplo de cómo usar los textos traducidos en un widget.", "ruta": "skills/g03-flutter-setup-localization"}, {"name": "g03-javascript-typescript-vitest", "description": "Buenas prácticas para tests de JavaScript y TypeScript con Vitest: estructura, mocks con vi e imports explícitos, adaptadas a un backend que no usa globals. Usar al escribir o corregir tests con Vitest.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}], "area": ["backend", "qa"], "fase": ["testing"], "tecnologias": ["vitest", "typescript", "javascript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Este test usa jest.fn() y falla, ¿cómo lo paso a Vitest?\"\n\n**Resultado:** El test reescrito con vi.fn(), los imports explícitos desde vitest y la explicación de cada cambio.", "ruta": "skills/g03-javascript-typescript-vitest"}, {"name": "g03-multi-stage-dockerfile", "description": "Crea Dockerfiles multi-stage optimizados para cualquier lenguaje o framework, separando la etapa de build de la imagen final. Usar al dockerizar un servicio o al reducir el tamaño de una imagen.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["devops"], "fase": ["despliegue"], "tecnologias": ["docker"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Armá el Dockerfile del backend para producción.\"\n\n**Resultado:** Un Dockerfile con una etapa de build y una imagen final liviana que solo contiene lo necesario para correr, con la explicación de cada etapa.", "ruta": "skills/g03-multi-stage-dockerfile"}, {"name": "g03-planify-jira-ticket", "description": "Escribe, mejora o crea tickets de Jira del proyecto Planify con un paso a paso anclado al código real de los repos mobile (Flutter) y backend (Express + Prisma). Usar cuando se pide redactar, revisar o detallar un ticket, aunque solo se dé el número.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "analisis"], "tecnologias": ["flutter", "express", "prisma"], "herramientas": ["claude-code"], "requiere": ["jira"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Mejorá el PLANIFY-40 con un paso a paso como el del 33.\"\n\n**Resultado:** La descripción completa del ticket en español, con Objetivo, Depende de (indicando si cada dependencia ya está mergeada), un Paso a paso donde cada paso dice qué se hace, para qué, en qué archivo real va y por qué no se puede saltear, Fuera de alcance y Criterios de aceptación. Antes de escribir en Jira, muestra el borrador y pide confirmación.", "ruta": "skills/g03-planify-jira-ticket"}, {"name": "g03-postgresql-best-practices", "description": "Buenas prácticas de PostgreSQL para diseño de esquemas, optimización de consultas y administración de la base. Usar al diseñar tablas, índices o consultas, o al investigar una consulta lenta.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}, "colaboradores": [], "area": ["backend", "datos"], "fase": ["diseno", "desarrollo"], "tecnologias": ["postgresql"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Esta consulta de eventos por usuario tarda 3 segundos, ¿qué hago?\"\n\n**Resultado:** Un diagnóstico con EXPLAIN, los índices que conviene crear y la consulta reescrita, explicando por qué mejora.", "ruta": "skills/g03-postgresql-best-practices"}, {"name": "g03-prisma", "description": "Guía para usar Prisma ORM con operaciones tipadas sobre la base de datos y buen diseño de esquemas. Usar al modelar tablas en schema.prisma o al escribir consultas con Prisma Client.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Mateo Piccinini", "github": "mPiccinini"}, "colaboradores": [{"nombre": "Ignacio Nicolás Correa Rodríguez", "github": "NachoCor2007"}], "area": ["backend", "datos"], "fase": ["desarrollo"], "tecnologias": ["prisma", "typescript"], "herramientas": ["claude-code", "codex"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Agregá al esquema la relación entre eventos y participantes.\"\n\n**Resultado:** Los modelos de schema.prisma con la relación definida, la migración a generar y un ejemplo de consulta que trae un evento con sus participantes.", "ruta": "skills/g03-prisma"}, {"name": "g03-revisor-de-fichas", "description": "Revisa las fichas de skills, agentes y comandos del Catálogo Común de Agentes y propone mejoras de clasificación, descripción, ejemplo de uso y piezas relacionadas, explicando en qué se diferencian de las parecidas. Usar antes de abrir un PR al catálogo o al revisar uno.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["ia", "documentacion"], "fase": ["revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "otra"], "requiere": [], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Revisá las fichas de las piezas que tengo en `skills/` antes de abrir el PR.\"\n\n**Resultado:** Una sección por pieza con lo que está bien, la clasificación corregida con su motivo (por ejemplo, \"falta `qa`: la skill genera casos de prueba\"), una description y un ejemplo de uso propuestos cuando los actuales son flojos, y las piezas parecidas de otros grupos con su diferencia. Después pregunta qué cambios aplicar y modifica solo la ficha y el ejemplo de las piezas elegidas.", "ruta": "skills/g03-revisor-de-fichas"}, {"name": "g03-status-incidents", "description": "Registra, actualiza y cierra los incidentes del reporte semanal del equipo a partir de evidencia real (bugs en Jira, CI fallido, hotfixes, exposiciones de seguridad). Usar cuando el PM pide anotar un incidente o completar la parte de incidentes del reporte.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["mantenimiento", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá el incidente del deploy que falló ayer.\"\n\n**Resultado:** Una fila nueva en la tabla de Incidentes con fecha, descripción, impacto, evidencia y estado, y el color de Incidentes de la semana actualizado.", "ruta": "skills/g03-status-incidents"}, {"name": "g03-status-risks", "description": "Detecta y escribe los riesgos de la semana en la planilla de estado del equipo, con su color, a partir de evidencia real (tickets vencidos, PRs abiertos, integraciones pendientes). Usar cuando el PM pide revisar o anotar los riesgos del reporte semanal.", "tipo": "skill", "grupo": "03", "autor": {"nombre": "Julieta Iglesias", "github": "JuliIglesias"}, "colaboradores": [], "area": ["gestion"], "fase": ["planificacion", "revision"], "tecnologias": ["agnostico"], "herramientas": ["claude-code", "codex"], "requiere": ["jira", "github", "google-sheets"], "madurez": "usado-en-proyecto", "relacionados": [], "ejemplo": "**Pedido:** \"Anotá los riesgos de la semana.\"\n\n**Resultado:** La fila de Riesgos de la planilla con cada riesgo, su evidencia y el color de la semana, separando hechos de propuestas.", "ruta": "skills/g03-status-risks"}, {"name": "g03-status-schedule", "description": "Actualiza el cronograma de la planilla de estado semanal del equipo (estado, avance, fechas y comentar : "Marcos Sasaki", "github": "sasakiimarcos"}, {"grupo": "15", "nombre": "Nicolas Berretta", "github": "Nicolas-Berretta"}, {"grupo": "15", "nombre": "Felipe Germano", "github": "GermanoFelipe"}, {"grupo": "16", "nombre": "Valentino Gianuzzo", "github": "ValentinoGianuzzo"}, {"grupo": "16", "nombre": "Carla Boggio", "github": "carBoggio"}, {"grupo": "16", "nombre": "Esteban Antonijevic", "github": "eantonijevic"}], META = 10;
const low = s => String(s||"").toLowerCase();
const alumno = gh => A.find(a => low(a.github) === low(gh));
const comoAutor = gh => P.filter(p => p.autor && low(p.autor.github) === low(gh) && p.grupo !== "00");
const comoColab = gh => P.filter(p => p.colaboradores.some(c => low(c.github) === low(gh)) && p.grupo !== "00");
const st = {q:"", area:new Set(), fase:new Set(), herramientas:new Set(), grupo:new Set(), gAv:new Set()};
const $ = id => document.getElementById(id);
function e(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function a(href,txt,c){const n=e("a",c,txt);n.href=href;return n}
function linkPersona(p){if(!p)return e("span",null,"—");return alumno(p.github)?a("#alumno/"+encodeURIComponent(p.github),p.nombre||p.github):e("span",null,p.nombre||p.github)}

function ruta(){const h=decodeURIComponent(location.hash.slice(1));const i=h.indexOf("/");
  return i<0?{v:h||"explorar",id:null}:{v:h.slice(0,i),id:h.slice(i+1)}}
function render(){const r=ruta();const av=r.v==="avance"||r.v==="alumno";
  $("tab-explorar").className=av?"":"on";$("tab-avance").className=av?"on":"";
  $("sub").textContent=P.length+" piezas · "+A.length+" alumnos · "+new Set(P.map(p=>p.grupo)).size+" grupos con piezas";
  const m=$("main");m.innerHTML="";av?vistaAvance(m,r.v==="alumno"?r.id:null):vistaExplorar(m,r.v==="pieza"?r.id:null);
  if(r.v==="pieza"||r.v==="alumno"){const s=document.querySelector(".on[data-k]");if(s)s.scrollIntoView({block:"nearest"})}}

function chips(box,campo,valores,etq){valores.forEach(v=>{const b=e("button","chip"+(st[campo].has(v)?" on":""),etq?etq(v):v);
  b.onclick=()=>{st[campo].has(v)?st[campo].delete(v):st[campo].add(v);render()};box.append(b)})}
function ok(p){const q=low(st.q);
  if(q&&!low(p.name+" "+p.description+" "+p.tecnologias.join(" ")+" "+(p.autor?p.autor.nombre:"")).includes(q))return false;
  for(const c of ["area","fase","herramientas","grupo"]){if(st[c].size&&![].concat(p[c]).some(v=>st[c].has(v)))return false}return true}

function vistaExplorar(m,sel){
  const q=e("input");q.type="search";q.placeholder="Buscar por nombre, descripción, tecnología o autor…";q.value=st.q;
  q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;render();const n=document.querySelector("input");n.focus();n.setSelectionRange(pos,pos)};m.append(q);
  for(const [campo,et] of [["area","Área"],["fase","Fase"],["herramientas","Herramienta"],["grupo","Grupo"]]){
    const r=e("div","row");r.append(e("b",null,et));chips(r,campo,[...new Set(P.flatMap(p=>[].concat(p[campo])))].sort(),campo==="grupo"?v=>"g"+v:null);m.append(r)}
  const l=P.filter(ok);if(!sel||!l.some(p=>p.name===sel))sel=l.length?l[0].name:null;
  const g=e("div","g"),list=e("div","list"),d=e("div","d");g.append(list,d);m.append(g);
  list.append(e("div","m s",l.length+" de "+P.length+" piezas"));
  l.forEach(p=>{const c=a("#pieza/"+encodeURIComponent(p.name),null,"c"+(p.name===sel?" on":""));c.dataset.k=1;
    c.append(e("div","n",p.name),e("div","m s",p.description));const t=e("div");
    p.area.forEach(v=>t.append(e("span","t",v)));p.herramientas.forEach(v=>t.append(e("span","t b",v)));c.append(t);list.append(c)});
  const p=P.find(x=>x.name===sel);
  if(!p){d.append(e("div","m",P.length?"Ninguna pieza coincide con los filtros.":"Todavía no hay piezas en el catálogo."));return}
  d.append(e("div","n",p.name),e("p",null,p.description));const dl=e("dl");
  const fila=(k,v)=>{dl.append(e("dt",null,k));const dd=e("dd");typeof v==="string"?dd.textContent=v||"—":dd.append(v);dl.append(dd)};
  fila("Tipo",p.tipo);fila("Grupo","g"+p.grupo);fila("Autor",linkPersona(p.autor));
  const col=e("span");p.colaboradores.forEach((c,i)=>{if(i)col.append(", ");col.append(linkPersona(c))});fila("Colaboradores",p.colaboradores.length?col:"—");
  fila("Área",p.area.join(", "));fila("Fase",p.fase.join(", "));fila("Tecnologías",p.tecnologias.join(", "));
  fila("Funciona en",p.herramientas.join(", "));fila("Requiere",p.requiere.join(", ")||"nada externo");fila("Madurez",p.madurez);fila("Carpeta",p.ruta);
  d.append(dl,e("h3",null,"Ejemplo de uso"),e("pre",null,p.ejemplo||"—"));
  if(p.relacionados.length){d.append(e("h3",null,"Relacionadas"));const u=e("ul","p");
    p.relacionados.forEach(n=>{const li=e("li");li.append(P.some(x=>x.name===n)?a("#pieza/"+encodeURIComponent(n),n):e("span",null,n));u.append(li)});d.append(u)}}

function vistaAvance(m,sel){
  const grupos=[...new Set(A.map(x=>x.grupo))].sort();const r=e("div","row");r.style.marginTop="16px";r.append(e("b",null,"Grupo"));
  grupos.forEach(gr=>{const b=e("button","chip"+(st.gAv.has(gr)?" on":""),"g"+gr);b.onclick=()=>{st.gAv.has(gr)?st.gAv.delete(gr):st.gAv.add(gr);render()};r.append(b)});m.append(r);
  const vis=A.filter(x=>!st.gAv.size||st.gAv.has(x.grupo));const n=x=>comoAutor(x.github).length;
  const s=e("div","stats");[[vis.filter(x=>n(x)>=META).length+" de "+vis.length,"alumnos con "+META+" o más"],
    [vis.reduce((t,x)=>t+n(x),0),"piezas como autor"],[vis.reduce((t,x)=>t+comoColab(x.github).length,0),"colaboraciones"]]
    .forEach(([v,k])=>{const c=e("div","st");c.append(e("div","v",String(v)),e("div","m s",k));s.append(c)});m.append(s);
  const g=e("div","g"),izq=e("div"),d=e("div","d");g.append(izq,d);m.append(g);
  const tw=e("div","tw"),tb=e("table");tb.innerHTML="<tr><th>Alumno</th><th>Grupo</th><th>Autor</th><th>Avance</th><th>Colab.</th><th>Estado</th></tr>";
  vis.slice().sort((x,y)=>x.grupo.localeCompare(y.grupo)||x.nombre.localeCompare(y.nombre)).forEach(x=>{
    const k=n(x),tr=e("tr",low(x.github)===low(sel)?"on":"");tr.dataset.k=low(x.github)===low(sel)?1:"";
    const td=e("td");td.append(a("#alumno/"+encodeURIComponent(x.github),x.nombre||x.github));tr.append(td,e("td",null,"g"+x.grupo),e("td","r",String(k)));
    const tb2=e("td"),bar=e("div","bar"),sp=e("span",k>=META?"full":"");sp.style.width=Math.min(100,k*100/META)+"%";bar.append(sp);tb2.append(bar);tr.append(tb2);
    tr.append(e("td","r",String(comoColab(x.github).length)));const te=e("td");te.append(e("span","pill"+(k>=META?" ok":""),k>=META?"Completo":"Faltan "+(META-k)));tr.append(te);tb.append(tr)});
  tw.append(tb);izq.append(tw);
  const x=sel&&alumno(sel);
  if(!x){d.append(e("div","m","Elegí un alumno para ver sus piezas."));return}
  d.append(e("h2",null,x.nombre||x.github),e("div","m s","@"+x.github+" · grupo "+x.grupo));
  for(const [tit,l] of [["Como autor ("+comoAutor(x.github).length+")",comoAutor(x.github)],["Como colaborador ("+comoColab(x.github).length+")",comoColab(x.github)]]){
    d.append(e("h3",null,tit));if(!l.length){d.append(e("div","m s","Ninguna todavía."));continue}
    const u=e("ul","p");l.forEach(p=>{const li=e("li");li.append(a("#pieza/"+encodeURIComponent(p.name),p.name));u.append(li)});d.append(u)}}

addEventListener("hashchange",render);render();
</script></body></html>
