  metodologia:
    scrum: Pensada para Scrum
    kanban: Pensada para Kanban
    agnostico: Sirve para cualquier forma de trabajo
  herramientas:
    claude-code: Claude Code
    cursor: Cursor
    codex: Codex
    otra: Otra herramienta
  requiere:
    jira: Jira (por conexión MCP o API)
    github: GitHub (por conexión MCP o la CLI gh)
    figma: Figma (por conexión MCP)
