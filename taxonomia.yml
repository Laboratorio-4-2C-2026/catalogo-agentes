# Valores comunes de las fichas del catálogo.
# Lo actualiza solo el workflow al aceptar un PR: no hace falta editarlo a mano.
# 'alias' convierte variantes conocidas en el valor oficial (ej: reactjs -> react).

valores:
  area:
    frontend: Interfaces web y lo que ve el usuario
    backend: Servidores, APIs, bases de datos
    mobile: Apps para celular
    datos: Análisis, ETL, reportes de datos
    ia: Modelos, prompts, agentes que crean agentes
    qa: Calidad y pruebas
    devops: Infraestructura, CI/CD, despliegues
    seguridad: Auditorías, vulnerabilidades, permisos
    gestion: Tickets, sprints, estimaciones, reportes de estado
    diseno: UX/UI, prototipos, design systems
    documentacion: READMEs, manuales, documentación técnica
  fase:
    planificacion: Antes de empezar, backlog, sprints, estimación
    analisis: Requerimientos, historias de usuario, criterios de aceptación
    diseno: Arquitectura, modelos de datos, prototipos
    desarrollo: Escribir código
    testing: Pruebas automáticas y manuales
    revision: Code review, revisión de entregables, cierres de sprint
    despliegue: Publicar, CI/CD, releases
    mantenimiento: Corrección de errores, refactors, documentación posterior
  tecnologias:
    agnostico: Sirve para cualquier tecnología
    express: ''
    flutter: ''
    prisma: ''
    dart: ''
    docker: ''
    figma: ''
