name: Actualizar catálogo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sumar valores nuevos a las listas y a los READMEs
        run: python scripts/actualizar_listas.py

      - name: Regenerar el sitio (explorador y avance por alumno)
        run: python scripts/generar_sitio.py

      - name: Guardar cambios en main
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add taxonomia.yml README.md CONTRIBUTING.md sitio
            git commit -m "Actualizar listas y sitio"
            git push
          fi
