name: Revisar PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    env:
      # Los scripts se toman siempre de main (carpeta _base) y revisan la rama del PR.
      CATALOGO_RAIZ: ${{ github.workspace }}
    steps:
      - name: Bajar la rama del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bajar los scripts de main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _base

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r _base/requirements.txt

      - name: Normalizar valores de las fichas
        run: python _base/scripts/normalizar.py > ../informe-1-normalizacion.md

      - name: Sumar integrantes nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch ../informe-0-integrantes.md
          if [ -f _base/scripts/sumar_integrantes.py ]; then
            python _base/scripts/sumar_integrantes.py > ../informe-0-integrantes.md
          fi

      - name: Guardar las correcciones en la rama del PR
        run: |
          if [ -n "$(git status --porcelain -- skills agentes comandos integrantes.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills agentes comandos integrantes.yml
            git commit -m "Normalizar fichas y sumar integrantes nuevos"
            git push
          fi

      - name: Agente decisor
        run: python _base/scripts/decisor.py --base origin/main --autor-pr "${{ github.event.pull_request.user.login }}" > ../informe-2-decisor.md

      - name: Revisor de fichas con IA (solo si el repo tiene API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVISOR_MODELO: ${{ vars.REVISOR_MODELO }}
        run: |
          touch ../informe-4-revisor-ia.md
          if [ -f _base/scripts/revisor_ia.py ]; then
            python _base/scripts/revisor_ia.py --base origin/main > ../informe-4-revisor-ia.md
          fi

      - name: Controles automáticos
        run: |
          set -o pipefail
          python _base/scripts/validar.py --base origin/main | tee ../informe-3-validacion.md

      - name: Comentar el resultado en el PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat ../informe-1-normalizacion.md ../informe-0-integrantes.md ../informe-3-validacion.md ../informe-2-decisor.md ../informe-4-revisor-ia.md > ../comentario.md 2>/dev/null || true
          gh pr comment ${{ github.event.pull_request.number }} --body-file ../comentario.md --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} --body-file ../comentario.md
