name: Agente · Checklist OWASP

# Reusable workflow. Para las historias sensibles (auth, datos personales, pagos,
# control de acceso) arma un checklist basado en OWASP ASVS y verifica la PR
# contra el.
#
# IMPORTANTE: este agente NO escribe en el repo de producto. Solo lee el diff y
# comenta en la PR. No tiene `contents: write` ni lo va a tener.

on:
  workflow_call:
    inputs:
      project_kind:
        description: 'frontend | backend.'
        type: string
        required: true
      ticket_prefix:
        type: string
        default: 'MC'
      multica_workspace_id:
        type: string
        required: false
        default: ''
      paths_regex:
        description: |
          ERE sobre los archivos cambiados que marca una PR como sensible.
          Vacio = usar el default segun project_kind.
        type: string
        required: false
        default: ''
      model:
        type: string
        default: 'claude-sonnet-5'
      max_turns:
        # El tope es una red de seguridad, no un presupuesto: los turnos se
        # gastan solo si hacen falta. Pero quedarse corto marca el paso como
        # fallido AUNQUE el agente haya terminado bien y publicado su comentario
        # ("Claude reported a successful result after N turns, exceeding the
        # configured maximum of M"). El de Figma venia en 25 y necesito 31.
        # Quien corta de verdad si algo se desboca es timeout_minutes.
        type: number
        default: 50
      timeout_minutes:
        type: number
        default: 15
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false
      resend_api_key:
        required: false
      multica_token:
        required: false

jobs:
  owasp:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolver codigo de ticket
        id: ticket
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PREFIX: ${{ inputs.ticket_prefix }}
        run: |
          blob="$(printf '%s\n%s\n%s\n' "$HEAD_REF" "$PR_TITLE" "$PR_BODY")"
          code="$(printf '%s' "$blob" | grep -oE '\bMIC-[0-9]+' | head -n1 || true)"
          kind=short_id
          if [ -z "$code" ]; then
            code="$(printf '%s' "$blob" | grep -oE "\b${PREFIX}-[0-9]+" | head -n1 || true)"
            kind=en_titulo
          fi
          if [ -z "$code" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ticket detectado: $code (se busca por $kind)"
            {
              echo "found=true"
              echo "code=$code"
              echo "kind=$kind"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Traer el ticket de Multica
        continue-on-error: true
        if: steps.ticket.outputs.found == 'true' && inputs.multica_workspace_id != ''
        env:
          MULTICA_TOKEN: ${{ secrets.multica_token }}
          MULTICA_WORKSPACE_ID: ${{ inputs.multica_workspace_id }}
          TICKET_CODE: ${{ steps.ticket.outputs.code }}
          TICKET_KIND: ${{ steps.ticket.outputs.kind }}
        run: |
          set -uo pipefail
          if [ -z "${MULTICA_TOKEN:-}" ]; then
            echo "::warning::Falta el secret MULTICA_TOKEN."
            exit 0
          fi
          API="https://api.multica.ai/api"
          auth=(-H "Authorization: Bearer ${MULTICA_TOKEN}" -H "X-Workspace-ID: ${MULTICA_WORKSPACE_ID}")

          bajar() {
            curl -sS --max-time 20 "${auth[@]}" "${API}/issues/$1" -o ticket.json \
              && jq -e '.title' ticket.json >/dev/null 2>&1
          }

          if [ "$TICKET_KIND" = "short_id" ] && bajar "$TICKET_CODE"; then
            echo "Ticket recuperado: $(jq -r --arg c "$TICKET_CODE" '((.short_id // "") | if . == "" then $c else . end) + " — " + (.title // "?")' ticket.json)"
            exit 0
          fi
          rm -f ticket.json

          uuid=''; offset=0
          for _ in $(seq 1 10); do
            page="$(curl -sS --max-time 20 "${auth[@]}" "${API}/issues?limit=100&offset=${offset}")" || break
            if [ "$TICKET_KIND" = "short_id" ]; then
              match="$(printf '%s' "$page" | jq -r --arg c "$TICKET_CODE" \
                '(if type == "object" then (.items // []) else . end) | map(select(.short_id == $c)) | .[0].id // empty')"
            else
              match="$(printf '%s' "$page" | jq -r --arg c "[${TICKET_CODE}]" \
                '(if type == "object" then (.items // []) else . end) | map(select(.title | contains($c))) | .[0].id // empty')"
            fi
            if [ -n "$match" ]; then uuid="$match"; break; fi
            [ "$(printf '%s' "$page" | jq -r '.has_more // false')" = "true" ] || break
            offset="$(printf '%s' "$page" | jq -r --argjson o "$offset" '.next_offset // ($o + 100)')"
          done

          [ -n "$uuid" ] || { echo "::warning::No hay issue para ${TICKET_CODE}."; exit 0; }
          bajar "$uuid" || { echo "::warning::El issue ${uuid} no se pudo leer."; rm -f ticket.json; }

      # ─────────────────────────────────────────────────────────────────────
      # Compuerta: que es una "historia sensible".
      #
      # Dos senales independientes, alcanza con una. Las rutas son la senal
      # confiable (el codigo no miente sobre donde vive); el ticket es la que
      # agarra los casos donde el riesgo esta en el dominio y no en el nombre
      # del archivo. Los tickets de Multica traen un campo "Modulo:".
      # ─────────────────────────────────────────────────────────────────────
      - name: Decidir si la historia es sensible
        id: gate
        env:
          BASE: ${{ github.base_ref }}
          KIND: ${{ inputs.project_kind }}
          REGEX_IN: ${{ inputs.paths_regex }}
        run: |
          set -uo pipefail
          regex="${REGEX_IN:-}"
          if [ -z "$regex" ]; then
            case "$KIND" in
              backend)
                regex='auth|guard|strategy|jwt|token|session|password|credential|role|permission|user|profile|payment|pago|upload|file|^prisma/|middleware|interceptor'
                ;;
              frontend)
                regex='auth|login|register|session|token|password|perfil|profile|account|cuenta|payment|pago|upload|admin'
                ;;
              *)
                regex='auth'
                ;;
            esac
          fi

          git diff --name-only "origin/${BASE}...HEAD" > cambiados.txt || true
          motivo=""
          # grep sin -n: este archivo lo lee el agente y los numeros de linea solo
          # ensucian la lista de rutas.
          if grep -iE "$regex" cambiados.txt > sensibles.txt; then
            motivo="rutas sensibles en el diff"
            echo "--- archivos sensibles ---"
            head -30 sensibles.txt
          fi

          # Segunda senal: el ticket. Modulo identity/auth, o palabras de riesgo
          # en titulo y descripcion.
          if [ -f ticket.json ]; then
            tema="$(jq -r '[(.title // ""), (.description // "")] | join(" ")' ticket.json | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$tema" | grep -qE 'identity|auth|login|registro|contrasen|password|permiso|rol |roles|sesion|pago|payment|dato personal|privacidad|token'; then
              if [ -n "$motivo" ]; then motivo="${motivo} y tema del ticket"; else motivo="tema del ticket"; fi
            fi
          fi

          if [ -n "$motivo" ]; then
            echo "Historia sensible: ${motivo}. Corre el checklist."
            echo "correr=true" >> "$GITHUB_OUTPUT"
            echo "motivo=$motivo" >> "$GITHUB_OUTPUT"
          else
            echo "No parece una historia sensible: ni el diff ni el ticket tocan auth, datos personales, permisos ni pagos."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el contexto del ticket
        if: steps.gate.outputs.correr == 'true'
        run: |
          if [ -f ticket.json ]; then
            {
              echo "## Ticket de Multica"
              jq -r '"**" + (.short_id // "?") + "** — " + (.title // "?")' ticket.json
              echo
              jq -r '.description // "(sin descripcion)"' ticket.json
            } > ticket-context.md
          else
            printf '## Ticket de Multica\n\nNo se pudo recuperar: el checklist sale solo del diff.\n' > ticket-context.md
          fi

      - id: claude
        if: steps.gate.outputs.correr == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          show_full_output: ${{ vars.CLAUDE_DEBUG == 'true' }}
          prompt: |
            Revisas seguridad en las PRs de MicroChangas. El repo es el
            ${{ inputs.project_kind }}. Esta PR se marco como historia sensible por
            ${{ steps.gate.outputs.motivo }}.

            En `ticket-context.md` tenes el ticket. En `sensibles.txt`, los archivos del
            diff que dispararon la revision. El diff completo:
              git diff origin/${{ github.base_ref }}...HEAD

            Trabajas en dos tiempos.

            **Primero, arma el checklist.** No pegues una lista generica: elegi del OWASP
            ASVS solo las categorias que esta PR toca de verdad, y escribi cada item como
            una afirmacion verificable contra este codigo. Las categorias:

            - V2 Autenticacion: fuerza y almacenamiento de contrasenas (hash con bcrypt o
              argon2, nunca MD5/SHA sin salt), recuperacion de cuenta, limite de intentos.
            - V3 Sesiones: generacion y expiracion del token, invalidacion al salir, flags
              de las cookies (HttpOnly, Secure, SameSite), que el token no viaje en la URL.
            - V4 Control de acceso: que cada endpoint verifique **quien** es el usuario y
              **si puede** tocar ese recurso puntual. El agujero clasico es el IDOR: el
              endpoint valida que estes logueado pero no que el recurso sea tuyo.
            - V5 Validacion y encoding: validacion en el servidor (no solo en el form),
              SQL injection, XSS, deserializacion, tamano y tipo de los archivos subidos.
            - V7 Errores y logs: que los mensajes de error no filtren stack traces ni datos
              internos, y que los logs no guarden contrasenas, tokens ni datos personales.
            - V8/V9 Datos y transporte: datos personales en transito y guardados, que no
              haya secretos hardcodeados, que no se expongan campos de mas en las respuestas.
            - V13 API: metodo HTTP correcto, CORS, rate limiting, mass assignment (aceptar
              un body entero y pasarlo al ORM sin filtrar que campos se pueden escribir).

            **Despues, verifica la PR contra cada item** que pusiste. Para cada uno:
            cumple / no cumple / no aplica / no se puede verificar desde el diff. Leé el
            codigo alrededor con Read cuando el diff solo no alcance: un control de acceso
            puede estar en un guard que la PR no toca, y marcarlo como faltante seria un
            falso positivo.

            Reglas:

            - Si algo no se puede determinar leyendo el codigo, se marca "no verificable",
              nunca "cumple". Un checklist con tildes de mas es peor que no tenerlo.
            - Para cada incumplimiento: que se puede hacer con eso en concreto, y como se
              arregla. Si el arreglo es corto, escribi el codigo.
            - Ordena por riesgo real. Un control de acceso faltante va primero que un header.
            - El autor es un dev junior: explica el ataque, no solo el nombre de la categoria.

            Publicacion. Un unico comentario en la PR con:
              gh pr comment ${{ github.event.pull_request.number }} --body "el texto aca"

            Arranca con una frase sobre si la PR se puede mergear desde el lado de seguridad.
            Despues el checklist como tabla (Item / Estado / Nota). Despues el detalle de lo
            que no cumple. Si todo da bien, decilo corto y no inventes hallazgos para
            justificar la corrida.

            Para hallazgos anclados a una linea usa tambien
            mcp__github_inline_comment__create_inline_comment.

            Escribi el texto literal dentro de --body, un solo comando, entre comillas dobles.
            El sandbox rechaza todo lo que no sea un comando simple: nada de `$(...)`,
            backticks, pipes, `>` ni `&&`. Leé los archivos con Read, no con cat.

            Espanol rioplatense. No modifiques ningun archivo del repositorio: tu unica
            salida son los comentarios.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resumen y notificacion
        if: always()
        env:
          AGENTE: 'Checklist OWASP'
          ESTADO: ${{ steps.claude.outcome }}
          CORRER: ${{ steps.gate.outputs.correr }}
          MOTIVO: ${{ steps.gate.outputs.motivo }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUM: ${{ github.event.pull_request.number }}
          TICKET_CODE: ${{ steps.ticket.outputs.code }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          RESEND_API_KEY: ${{ secrets.resend_api_key }}
        run: |
          set -uo pipefail

          if [ "${CORRER:-}" != "true" ]; then
            echo "Agente omitido: la PR no toca auth, datos personales, permisos ni pagos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -f ticket.json ]; then
            multica="OK - $(jq -r --arg c "${TICKET_CODE:-?}" '((.short_id // "") | if . == "" then $c else . end) + " " + (.title // "?")' ticket.json | head -c 90)"
          else
            multica="sin ticket (checklist solo desde el diff)"
          fi

          if [ "${ESTADO:-}" = "failure" ] && [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            echo "::group::Diagnostico de la falla"
            jq -r '
              [.. | objects | with_entries(select(.key | test("error|message|subtype|type|reason|status|code";"i")))]
              | map(select(length > 0)) | unique | .[] | tostring
            ' "$EXEC_FILE" 2>/dev/null | head -40 || echo "(no se pudo parsear)"
            echo "::endgroup::"
          fi

          # ── El agente puede terminar en verde sin haber corrido ──────────
          # La action se autosaltea cuando el archivo de workflow que disparo la
          # corrida no es identico al que hay en la rama default del repo, y en
          # ese caso sale con conclusion=success: job verde, cero review, y el
          # motivo enterrado en el log. Sin archivo de ejecucion no hubo llamada
          # al modelo, asi que eso no se reporta como exito.
          if [ "${ESTADO:-}" = "success" ] && { [ -z "${EXEC_FILE:-}" ] || [ ! -f "${EXEC_FILE}" ]; }; then
            ESTADO="NO CORRIO - ver abajo"
            echo "::error::El agente termino en verde pero no dejo archivo de ejecucion: nunca llamo al modelo. Causa mas probable: .github/workflows/agents.yml de ${GITHUB_REPOSITORY} no es identico al de la rama default. Tiene que estar igual en la default y en la rama de trabajo."
          fi

          conclusion=""
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            conclusion="$(jq -r '
                (.result? // empty),
                ([.. | objects | select(.type? == "result") | .result?] | map(select(. != null)) | last // empty),
                ([.. | objects | select(.type? == "text")   | .text?]   | map(select(. != null)) | last // empty)
              ' "$EXEC_FILE" 2>/dev/null | grep -v '^$' | tail -n1)"
          fi
          [ -n "$conclusion" ] || conclusion="(no se pudo extraer del archivo de ejecucion)"
          corto="$(printf '%s' "$conclusion" | head -c 1200)"
          [ "${#conclusion}" -gt 1200 ] && corto="${corto}..."

          {
            echo "## ${AGENTE}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repo | ${GITHUB_REPOSITORY} |"
            echo "| PR | #${PR_NUM:-?} |"
            echo "| Resultado | ${ESTADO:-omitido} |"
            echo "| Se activo por | ${MOTIVO:-?} |"
            echo "| Multica | ${multica} |"
            echo
            echo "### Conclusion"
            echo
            printf '%s\n' "$corto"
            echo
            echo "Corrida completa: ${RUN_URL}"
          } > resumen.md
          cat resumen.md >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::notice::Sin vars.NOTIFY_EMAIL: no se manda mail."
            exit 0
          fi
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::Hay NOTIFY_EMAIL pero falta el secret RESEND_API_KEY."
            exit 0
          fi
          payload="$(jq -n \
            --arg from "${NOTIFY_FROM:-MicroChangas Agentes <onboarding@resend.dev>}" \
            --arg to "$NOTIFY_EMAIL" \
            --arg subject "[${GITHUB_REPOSITORY##*/}] PR #${PR_NUM:-?} - ${AGENTE}: ${ESTADO:-omitido}" \
            --rawfile text resumen.md \
            '{from: $from, to: [$to], subject: $subject, text: $text}')"
          resp="$(curl -sS --max-time 20 -w '\n%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          code="$(printf '%s' "$resp" | tail -n1)"
          if [ "$code" = "200" ]; then
            echo "Mail enviado a ${NOTIFY_EMAIL}."
          else
            echo "::warning::Resend devolvio HTTP ${code}: $(printf '%s' "$resp" | sed '$d' | head -c 300)"
          fi

      - name: Guardar salida de ejecucion si fallo
        if: failure() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-exec-owasp-pr-${{ github.event.pull_request.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7
